name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cgroup-v2-delegation-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - name: Build disposable cgroup-v2 capability probe
        working-directory: daemon
        shell: bash
        run: |
          set -Eeuo pipefail
          source="$RUNNER_TEMP/cgroup-v2-delegation-probe.go"
          binary="$RUNNER_TEMP/cgroup-v2-delegation-probe"
          cat > "$source" <<'GO'
          package main

          import (
            "bufio"
            "bytes"
            "context"
            "errors"
            "fmt"
            "io"
            "net"
            "os"
            "os/exec"
            "path/filepath"
            "runtime"
            "strconv"
            "strings"
            "syscall"
            "time"
            "unsafe"

            "golang.org/x/sys/unix"
          )

          const (
            probeBUID       = 65534
            probeBGID       = 65534
            capSysSetgid    = 6
            capSysSetuid    = 7
            capSysPtrace    = 19
            soNetNSCookie   = 71
          )

          const namespaceGateScript = `
          import os, sys
          def fail(stage, error):
              os.write(1, ("namespace-gate-failure=%s detail=%r\n" % (stage, str(error))).encode())
              raise SystemExit(1)
          def supplementary_groups():
              with open("/proc/self/status", encoding="ascii") as stream:
                  for line in stream:
                      if line.startswith("Groups:"):
                          return line.partition(":")[2].split()
              raise RuntimeError("Groups missing from process status")
          if len(sys.argv) != 4:
              fail("arguments", "expected probe binary, delegated leaf, and A namespace")
          groups = supplementary_groups()
          if groups:
              fail("supplementary-groups-not-empty", "namespace probe cannot sanitize A groups without the production root launcher; count=%d" % len(groups))
          try:
              os.write(3, b"E")
          except OSError as error:
              fail("uid-map-ready", error)
          if os.read(0, 1) != b"U":
              fail("uid-map-release", "parent did not authorize UID map")
          try:
              os.write(3, b"G")
          except OSError as error:
              fail("gid-map-ready", error)
          if os.read(0, 1) != b"G":
              fail("gid-map-release", "parent did not authorize GID map")
          os.close(3)
          try:
              os.execv(sys.argv[1], [sys.argv[1], "--namespace-worker", sys.argv[2], sys.argv[3]])
          except OSError as error:
              fail("worker-exec", error)
          `

          // Called through sudo only inside the delegated service; writes fixed B maps to an authenticated direct child.
          const rootMapScript = `
          import os, sys
          BUID = 65534
          BGID = 65534
          def fail(stage, error):
              os.write(1, ("mapping-failure=%s detail=%r\n" % (stage, str(error))).encode())
              raise SystemExit(1)
          def read_at(procfd, name):
              fd = os.open(name, os.O_RDONLY, dir_fd=procfd)
              try:
                  return os.read(fd, 65536).decode().strip()
              finally:
                  os.close(fd)
          def write_at(procfd, name, value):
              fd = os.open(name, os.O_WRONLY, dir_fd=procfd)
              try:
                  os.write(fd, value.encode())
              finally:
                  os.close(fd)
          def status(pid):
              values = {}
              with open("/proc/%d/status" % pid, encoding="ascii") as stream:
                  for line in stream:
                      key, separator, value = line.partition(":")
                      if separator and key in ("Uid", "Gid", "PPid", "Groups"):
                          values[key] = [int(item) for item in value.split()]
              if "Uid" not in values or "Gid" not in values or "PPid" not in values or "Groups" not in values:
                  raise RuntimeError("incomplete process status")
              return values
          def cgroup(pid):
              with open("/proc/%d/cgroup" % pid, encoding="ascii") as stream:
                  for line in stream:
                      fields = line.rstrip("\n").split(":", 2)
                      if len(fields) == 3 and fields[0] == "0" and fields[1] == "":
                          return fields[2]
              raise RuntimeError("unified cgroup membership missing")
          def starttime(procfd):
              value = read_at(procfd, "stat")
              end = value.rfind(")")
              fields = value[end + 1:].split()
              if end < 0 or len(fields) <= 19:
                  raise RuntimeError("invalid process stat")
              return int(fields[19])
          def map_ids(fields):
              return fields == ["1", "65534", "1"]
          try:
              if os.geteuid() != 0 or len(sys.argv) != 9:
                  fail("arguments", "expected root and fixed mapping arguments")
              mode = sys.argv[1]
              a_pid, child_pid, ns_dev, ns_ino, child_start = [int(value) for value in sys.argv[2:7]]
              a_cgroup, leaf_cgroup = sys.argv[7:9]
              owner = int(os.environ["SUDO_UID"])
              if mode not in ("uid", "gid") or a_pid <= 1 or child_pid <= 1 or owner == BUID:
                  fail("arguments", "invalid mode, PID, or fixed-B identity")
              sudo_parent_pid = os.getppid()
              if sudo_parent_pid != a_pid and status(sudo_parent_pid)["PPid"] != [a_pid]:
                  fail("caller-process", "mapping helper was not invoked by A")
              procfd = os.open("/proc/%d" % child_pid, os.O_RDONLY | os.O_DIRECTORY)
              try:
                  a = status(a_pid)
                  child = status(child_pid)
                  helper_cgroup = cgroup(os.getpid())
                  if a["Uid"] != [owner] * 4 or child["Uid"] != [owner] * 4 or child["Gid"] != a["Gid"]:
                      fail("caller-identity", "A and its exact child must retain their host credentials")
                  if child["Groups"]:
                      fail("supplementary-groups", "A must clear supplementary groups before either ID map")
                  if child["PPid"] != [a_pid] or cgroup(a_pid) != a_cgroup or helper_cgroup != a_cgroup:
                      fail("delegated-service-identity", "mapping helper and A must share the transient service cgroup")
                  if not os.path.isabs(a_cgroup) or os.path.normpath(a_cgroup) != a_cgroup or not os.path.isabs(leaf_cgroup) or os.path.normpath(leaf_cgroup) != leaf_cgroup:
                      fail("delegated-cgroup-path", "cgroup paths must be normalized absolute paths")
                  if cgroup(child_pid) != leaf_cgroup or os.path.dirname(leaf_cgroup) != a_cgroup:
                      fail("delegated-leaf-identity", "target must be A's direct cgroup leaf")
                  if not os.path.basename(leaf_cgroup).startswith("symmetry-cgroup-probe-"):
                      fail("delegated-leaf-name", "unexpected probe leaf")
                  owner_namespace = os.stat("/proc/%d/ns/user" % a_pid)
                  if owner_namespace.st_dev == ns_dev and owner_namespace.st_ino == ns_ino:
                      fail("userns-owner", "target namespace must be a child of A's user namespace")
                  namespace = os.stat("/proc/%d/ns/user" % child_pid)
                  if namespace.st_dev != ns_dev or namespace.st_ino != ns_ino:
                      fail("userns-identity", "target namespace identity changed")
                  if starttime(procfd) != child_start:
                      fail("pid-identity", "target PID was reused")
                  uid_map = read_at(procfd, "uid_map").split()
                  gid_map = read_at(procfd, "gid_map").split()
                  setgroups = read_at(procfd, "setgroups")
                  if mode == "uid":
                      if uid_map or gid_map or setgroups != "allow":
                          fail("uid-map-precondition", "child maps or setgroups policy changed")
                      write_at(procfd, "uid_map", "1 65534 1\n")
                      if not map_ids(read_at(procfd, "uid_map").split()) or read_at(procfd, "gid_map").strip():
                          fail("uid-map-verification", "only fixed B UID must be mapped")
                  else:
                      if not map_ids(uid_map) or gid_map or setgroups != "allow":
                          fail("gid-map-precondition", "B UID map or setgroups allow state missing")
                      write_at(procfd, "setgroups", "deny\n")
                      if read_at(procfd, "setgroups") != "deny":
                          fail("setgroups-policy", "setgroups denial was not installed")
                      write_at(procfd, "gid_map", "1 65534 1\n")
                      if not map_ids(read_at(procfd, "gid_map").split()):
                          fail("gid-map-verification", "only fixed B GID must be mapped")
                  if starttime(procfd) != child_start or status(child_pid)["PPid"] != [a_pid]:
                      fail("pid-identity", "target process identity changed while mapping")
                  final_namespace = os.stat("/proc/%d/ns/user" % child_pid)
                  if final_namespace.st_dev != ns_dev or final_namespace.st_ino != ns_ino:
                      fail("userns-identity", "target namespace changed while mapping")
                  print("mapping=%s-passed groups=empty" % mode, flush=True)
              finally:
                  os.close(procfd)
          except SystemExit:
              raise
          except Exception as error:
              fail("helper-error", error)
          `

          type report struct {
            uid                  int
            childUID             int
            bUID                 int
            kernel               string
            cgroup               string
            leafCgroup           string
            capability           string
            crossUIDCapability   string
            suidDumpable         string
            usernsEnabled        bool
            usernsCreated        bool
            hostCapEff           string
            failureDetail        string
          }

          func membership() (string, error) {
            file, err := os.Open("/proc/self/cgroup")
            if err != nil {
              return "", err
            }
            defer file.Close()
            scanner := bufio.NewScanner(file)
            for scanner.Scan() {
              fields := strings.SplitN(scanner.Text(), ":", 3)
              if len(fields) == 3 && fields[0] == "0" && fields[1] == "" &&
                strings.HasPrefix(fields[2], "/") && filepath.Clean(fields[2]) == fields[2] {
                return fields[2], nil
              }
            }
            if err := scanner.Err(); err != nil {
              return "", err
            }
            return "", fmt.Errorf("unified cgroup membership missing")
          }

          func unescapeMountField(value string) (string, error) {
            var result strings.Builder
            for i := 0; i < len(value); i++ {
              if value[i] != '\\' {
                result.WriteByte(value[i])
                continue
              }
              if i+3 >= len(value) {
                return "", fmt.Errorf("invalid mountinfo escape")
              }
              code, err := strconv.ParseUint(value[i+1:i+4], 8, 8)
              if err != nil {
                return "", err
              }
              result.WriteByte(byte(code))
              i += 3
            }
            return result.String(), nil
          }

          func cgroupDirectory(cgroup string) (string, error) {
            file, err := os.Open("/proc/self/mountinfo")
            if err != nil {
              return "", err
            }
            defer file.Close()
            scanner := bufio.NewScanner(file)
            scanner.Buffer(make([]byte, 4096), 1024*1024)
            bestRoot := ""
            bestDirectory := ""
            for scanner.Scan() {
              line := scanner.Text()
              separator := strings.Index(line, " - ")
              if separator < 0 {
                continue
              }
              before := strings.Fields(line[:separator])
              after := strings.Fields(line[separator+3:])
              if len(before) < 5 || len(after) < 1 || after[0] != "cgroup2" {
                continue
              }
              root, err := unescapeMountField(before[3])
              if err != nil {
                return "", err
              }
              mountpoint, err := unescapeMountField(before[4])
              if err != nil {
                return "", err
              }
              matches := cgroup == root || root == "/" ||
                (strings.HasPrefix(cgroup, strings.TrimSuffix(root, "/")) &&
                  strings.HasPrefix(strings.TrimPrefix(cgroup, strings.TrimSuffix(root, "/")), "/"))
              if !matches || len(root) < len(bestRoot) {
                continue
              }
              relative := strings.TrimPrefix(strings.TrimPrefix(cgroup, root), "/")
              bestRoot = root
              bestDirectory = filepath.Join(mountpoint, filepath.FromSlash(relative))
            }
            if err := scanner.Err(); err != nil {
              return "", err
            }
            if bestDirectory == "" {
              return "", fmt.Errorf("cgroup2 mount not found")
            }
            return bestDirectory, nil
          }

          func child() int {
            cgroup, err := membership()
            if err != nil {
              return 1
            }
            fmt.Printf("uid=%d\ncgroup_path=%s\n", os.Geteuid(), cgroup)
            return 0
          }

          func membershipFor(pid int) (string, error) {
            file, err := os.Open(fmt.Sprintf("/proc/%d/cgroup", pid))
            if err != nil {
              return "", err
            }
            defer file.Close()
            scanner := bufio.NewScanner(file)
            for scanner.Scan() {
              fields := strings.SplitN(scanner.Text(), ":", 3)
              if len(fields) == 3 && fields[0] == "0" && fields[1] == "" &&
                strings.HasPrefix(fields[2], "/") && filepath.Clean(fields[2]) == fields[2] {
                return fields[2], nil
              }
            }
            if err := scanner.Err(); err != nil {
              return "", err
            }
            return "", fmt.Errorf("unified cgroup membership missing")
          }

          func statusValue(pid int, name string) (string, error) {
            contents, err := os.ReadFile(fmt.Sprintf("/proc/%d/status", pid))
            if err != nil {
              return "", err
            }
            prefix := name + ":"
            for _, line := range strings.Split(string(contents), "\n") {
              if strings.HasPrefix(line, prefix) {
                return strings.TrimSpace(strings.TrimPrefix(line, prefix)), nil
              }
            }
            return "", fmt.Errorf("%s missing from process status", name)
          }

          func statusIDs(pid int, name string) ([]int, error) {
            value, err := statusValue(pid, name)
            if err != nil {
              return nil, err
            }
            fields := strings.Fields(value)
            if len(fields) != 4 {
              return nil, fmt.Errorf("%s did not contain four IDs", name)
            }
            ids := make([]int, len(fields))
            for i, field := range fields {
              ids[i], err = strconv.Atoi(field)
              if err != nil {
                return nil, err
              }
            }
            return ids, nil
          }

          func permissionDenied(err error) bool {
            return err != nil && (errors.Is(err, syscall.EACCES) || errors.Is(err, syscall.EPERM))
          }

          func recordCleanupFailure(failure *string, detail *string, stage string, err error) {
            message := stage + ": " + err.Error()
            if *failure == "" {
              *failure = stage
              *detail = err.Error()
              return
            }
            if *detail == "" {
              *detail = message
            } else {
              *detail += "; " + message
            }
          }

          func usernsCheckChild() int {
            namespace, err := os.Readlink("/proc/self/ns/user")
            if err != nil {
              fmt.Printf("userns-check-failure=%q\n", err.Error())
              return 1
            }
            fmt.Printf("userns=%s\n", namespace)
            if _, err := io.Copy(io.Discard, os.Stdin); err != nil {
              fmt.Printf("userns-check-failure=%q\n", err.Error())
              return 1
            }
            return 0
          }

          func checkUsernsCreate() error {
            parentNamespace, err := os.Readlink("/proc/self/ns/user")
            if err != nil {
              return err
            }
            ctx, cancel := context.WithTimeout(context.Background(), 10*time.Second)
            defer cancel()
            command := exec.CommandContext(ctx, "/proc/self/exe", "--userns-check")
            command.Stderr = io.Discard
            command.SysProcAttr = &syscall.SysProcAttr{Cloneflags: syscall.CLONE_NEWUSER}
            output, err := command.StdoutPipe()
            if err != nil {
              return err
            }
            input, err := command.StdinPipe()
            if err != nil {
              return err
            }
            if err := command.Start(); err != nil {
              return err
            }
            waited := false
            defer func() {
              _ = input.Close()
              if !waited {
                _ = command.Process.Kill()
                _ = command.Wait()
              }
            }()
            line, err := bufio.NewReader(output).ReadString('\n')
            if err != nil {
              return err
            }
            values := parseValues(line)
            childNamespace := values["userns"]
            if childNamespace == "" || childNamespace == parentNamespace {
              return fmt.Errorf("child did not enter a distinct user namespace: %s", strings.TrimSpace(line))
            }
            if _, err := input.Write([]byte{'x'}); err != nil {
              return err
            }
            if err := input.Close(); err != nil {
              return err
            }
            if err := command.Wait(); err != nil {
              waited = true
              if ctx.Err() != nil {
                return ctx.Err()
              }
              return err
            }
            waited = true
            return nil
          }

          func checkHostPrerequisites(result *report) string {
            dumpable, err := os.ReadFile("/proc/sys/fs/suid_dumpable")
            if err != nil {
              result.suidDumpable = "unavailable"
            } else {
              result.suidDumpable = strings.TrimSpace(string(dumpable))
            }

            maxNamespaces, err := os.ReadFile("/proc/sys/user/max_user_namespaces")
            if err != nil {
              result.failureDetail = err.Error()
              return "read-user-max-user-namespaces"
            }
            maxCount, err := strconv.ParseUint(strings.TrimSpace(string(maxNamespaces)), 10, 64)
            if err != nil || maxCount == 0 {
              result.failureDetail = "user.max_user_namespaces must be positive"
              return "user-namespaces-disabled"
            }
            if unprivilegedClone, err := os.ReadFile("/proc/sys/kernel/unprivileged_userns_clone"); err == nil {
              if strings.TrimSpace(string(unprivilegedClone)) != "1" {
                result.failureDetail = "kernel.unprivileged_userns_clone must be 1"
                return "unprivileged-user-namespaces-disabled"
              }
            } else if !errors.Is(err, os.ErrNotExist) {
              result.failureDetail = err.Error()
              return "read-unprivileged-user-namespaces"
            }
            result.usernsEnabled = true

            capEff, err := statusValue(os.Getpid(), "CapEff")
            if err != nil {
              result.failureDetail = err.Error()
              return "read-host-cap-eff"
            }
            result.hostCapEff = capEff
            capMask, err := strconv.ParseUint(capEff, 16, 64)
            if err != nil || capMask != 0 {
              result.failureDetail = "the host runner process must have CapEff=0"
              return "host-capabilities-nonzero"
            }
            hostUIDs, uidErr := statusIDs(os.Getpid(), "Uid")
            hostGIDs, gidErr := statusIDs(os.Getpid(), "Gid")
            if uidErr != nil || gidErr != nil || len(hostUIDs) != 4 || len(hostGIDs) != 4 {
              result.failureDetail = "could not verify A's host UID/GID tuple"
              return "host-id-tuple"
            }
            for i := range hostUIDs {
              if hostUIDs[i] == probeBUID || hostGIDs[i] == probeBGID {
                result.failureDetail = "fixed B UID/GID must differ from every A UID/GID"
                return "fixed-b-not-distinct"
              }
            }
            groups, err := statusValue(os.Getpid(), "Groups")
            if err != nil {
              result.failureDetail = err.Error()
              return "read-host-supplementary-groups"
            }
            groupCount := len(strings.Fields(groups))
            if groupCount != 0 {
              result.failureDetail = fmt.Sprintf("A has %d supplementary groups; this probe cannot sanitize them without the production root launcher", groupCount)
              return "host-supplementary-groups-not-empty"
            }
            if err := checkUsernsCreate(); err != nil {
              result.failureDetail = err.Error()
              return "user-namespace-create-denied"
            }
            result.usernsCreated = true
            return ""
          }

          func exactIDMap(pid int, name string, expectedID int) error {
            contents, err := os.ReadFile(fmt.Sprintf("/proc/%d/%s", pid, name))
            if err != nil {
              return err
            }
            fields := strings.Fields(string(contents))
            expected := []string{"1", strconv.Itoa(expectedID), "1"}
            if len(fields) != len(expected) {
              return fmt.Errorf("%s was not a single-ID B-only mapping", name)
            }
            for i := range expected {
              if fields[i] != expected[i] {
                return fmt.Errorf("%s was not the required B-only mapping", name)
              }
            }
            return nil
          }

          func namespaceIdentity(pid int) (uint64, uint64, error) {
            info, err := os.Stat(fmt.Sprintf("/proc/%d/ns/user", pid))
            if err != nil {
              return 0, 0, err
            }
            stat, ok := info.Sys().(*syscall.Stat_t)
            if !ok {
              return 0, 0, fmt.Errorf("user namespace stat unavailable")
            }
            return uint64(stat.Dev), stat.Ino, nil
          }

          func processStartTime(pid int) (uint64, error) {
            contents, err := os.ReadFile(fmt.Sprintf("/proc/%d/stat", pid))
            if err != nil {
              return 0, err
            }
            end := strings.LastIndex(string(contents), ")")
            if end < 0 {
              return 0, fmt.Errorf("process stat command field malformed")
            }
            fields := strings.Fields(string(contents)[end+1:])
            if len(fields) <= 19 {
              return 0, fmt.Errorf("process start time missing")
            }
            return strconv.ParseUint(fields[19], 10, 64)
          }

          func trustedRootExecutable(path string) error {
            info, err := os.Stat(path)
            if err != nil {
              return err
            }
            stat, ok := info.Sys().(*syscall.Stat_t)
            if !ok || stat.Uid != 0 || !info.Mode().IsRegular() || info.Mode().Perm()&0o022 != 0 || info.Mode().Perm()&0o111 == 0 {
              return fmt.Errorf("%s is not a trusted root-owned executable", path)
            }
            return nil
          }

          func runRootMapping(mode string, aPID int, childPID int, nsDev uint64, nsIno uint64,
            childStart uint64, aCgroup string, leafCgroup string) error {
            for _, path := range []string{"/usr/bin/sudo", "/usr/bin/python3"} {
              if err := trustedRootExecutable(path); err != nil {
                return err
              }
            }
            args := []string{
              "-n", "--", "/usr/bin/python3", "-I", "-S", "-c", rootMapScript,
              mode, strconv.Itoa(aPID), strconv.Itoa(childPID), strconv.FormatUint(nsDev, 10),
              strconv.FormatUint(nsIno, 10), strconv.FormatUint(childStart, 10), aCgroup, leafCgroup,
            }
            command := exec.Command("/usr/bin/sudo", args...)
            command.Dir = "/"
            command.Env = []string{"PATH=/usr/bin:/bin", "LANG=C", "LC_ALL=C"}
            var stdout bytes.Buffer
            var stderr bytes.Buffer
            command.Stdout = &stdout
            command.Stderr = &stderr
            if err := command.Run(); err != nil {
              return fmt.Errorf("transient %s map helper failed: %w: %s %s", mode, err,
                strings.TrimSpace(stdout.String()), strings.TrimSpace(stderr.String()))
            }
            if !strings.Contains(stdout.String(), "mapping="+mode+"-passed") {
              return fmt.Errorf("transient %s map helper did not confirm the fixed B map: %s", mode, strings.TrimSpace(stdout.String()))
            }
            fmt.Println(strings.TrimSpace(stdout.String()))
            return nil
          }

          func parseValues(line string) map[string]string {
            values := make(map[string]string)
            for _, field := range strings.Fields(line) {
              key, value, ok := strings.Cut(field, "=")
              if ok {
                values[key] = value
              }
            }
            return values
          }

          func procSocketInode(pid int, fd int) (uint64, error) {
            contents, err := os.ReadFile(fmt.Sprintf("/proc/%d/fdinfo/%d", pid, fd))
            if err != nil {
              return 0, err
            }
            for _, line := range strings.Split(string(contents), "\n") {
              fields := strings.Fields(line)
              if len(fields) == 2 && fields[0] == "ino:" {
                infoInode, err := strconv.ParseUint(fields[1], 10, 64)
                if err != nil {
                  return 0, err
                }
                return infoInode, nil
              }
            }
            return 0, fmt.Errorf("inode missing from fdinfo")
          }

          func tcpFD(conn *net.TCPConn) (int, error) {
            raw, err := conn.SyscallConn()
            if err != nil {
              return -1, err
            }
            fd := -1
            if err := raw.Control(func(value uintptr) { fd = int(value) }); err != nil {
              return -1, err
            }
            if fd < 0 {
              return -1, fmt.Errorf("TCP socket descriptor missing")
            }
            return fd, nil
          }

          func socketNetnsCookie(fd int) (uint64, error) {
            var cookie uint64
            length := uint32(8)
            _, _, errno := syscall.Syscall6(syscall.SYS_GETSOCKOPT,
              uintptr(fd), uintptr(syscall.SOL_SOCKET), uintptr(soNetNSCookie),
              uintptr(unsafe.Pointer(&cookie)), uintptr(unsafe.Pointer(&length)), 0)
            runtime.KeepAlive(&cookie)
            runtime.KeepAlive(&length)
            if errno != 0 {
              return 0, errno
            }
            if length != 8 {
              return 0, fmt.Errorf("SO_NETNS_COOKIE returned %d bytes", length)
            }
            return cookie, nil
          }

          func sameTCPAddr(left net.Addr, right net.Addr) bool {
            a, okA := left.(*net.TCPAddr)
            b, okB := right.(*net.TCPAddr)
            return okA && okB && a.Port == b.Port && bytes.Equal(a.IP.To4(), b.IP.To4())
          }

          func verifySocketDuplicate(fd int, inode uint64, expectedLocal net.Addr,
            expectedRemote net.Addr, expectedNetnsCookie uint64) (uint64, error) {
            duplicateFile := os.NewFile(uintptr(fd), "pidfd-getfd-socket")
            if duplicateFile == nil {
              _ = syscall.Close(fd)
              return 0, fmt.Errorf("duplicated descriptor was invalid")
            }
            defer duplicateFile.Close()
            var duplicateStat syscall.Stat_t
            if err := syscall.Fstat(fd, &duplicateStat); err != nil || uint64(duplicateStat.Ino) != inode {
              return 0, fmt.Errorf("pidfd duplicate did not match fdinfo inode %d: %v", inode, err)
            }
            socketType, err := unix.GetsockoptInt(fd, unix.SOL_SOCKET, unix.SO_TYPE)
            if err != nil || socketType != unix.SOCK_STREAM {
              return 0, fmt.Errorf("expected SOCK_STREAM: %v", err)
            }
            tcpInfo, err := unix.GetsockoptTCPInfo(fd, unix.IPPROTO_TCP, unix.TCP_INFO)
            if err != nil || tcpInfo.State != 1 {
              return 0, fmt.Errorf("expected TCP_ESTABLISHED: %v", err)
            }
            connection, err := net.FileConn(duplicateFile)
            if err != nil {
              return 0, err
            }
            defer connection.Close()
            local, okLocal := connection.LocalAddr().(*net.TCPAddr)
            remote, okRemote := connection.RemoteAddr().(*net.TCPAddr)
            if !okLocal || !okRemote || !local.IP.IsLoopback() || !remote.IP.IsLoopback() ||
              local.Port == 0 || remote.Port == 0 || !sameTCPAddr(local, expectedLocal) ||
              !sameTCPAddr(remote, expectedRemote) {
              return 0, fmt.Errorf("duplicated B socket tuple did not match the live loopback connection")
            }
            netnsCookie, err := socketNetnsCookie(fd)
            if err != nil || netnsCookie == 0 || netnsCookie != expectedNetnsCookie {
              return 0, fmt.Errorf("duplicated B socket network namespace cookie mismatch: %v", err)
            }
            return netnsCookie, nil
          }

          func probeLeafWriteDenied(leafDirectory string) error {
            file, err := os.OpenFile(filepath.Join(leafDirectory, "cgroup.procs"), os.O_WRONLY, 0)
            if err != nil {
              if permissionDenied(err) {
                return nil
              }
              return fmt.Errorf("opening A's cgroup.procs did not return EACCES/EPERM: %w", err)
            }
            defer file.Close()
            _, err = file.Write([]byte("not-a-pid\n"))
            if permissionDenied(err) {
              return nil
            }
            if err == nil {
              return fmt.Errorf("B could write A's cgroup.procs")
            }
            return fmt.Errorf("writing A's cgroup.procs returned %v, not EACCES/EPERM", err)
          }

          func peerFailure(stage string, err error) int {
            fmt.Printf("peer-failure=%s detail=%q\n", stage, err.Error())
            return 1
          }

          func socketPeer() int {
            if err := unix.Prctl(unix.PR_SET_DUMPABLE, 0, 0, 0, 0); err != nil {
              return peerFailure("set-nondumpable", err)
            }
            if os.Getuid() != 1 || os.Getgid() != 1 {
              return peerFailure("fixed-b-namespace-credentials", fmt.Errorf("expected namespace uid/gid 1"))
            }
            listener, err := net.ListenTCP("tcp4", &net.TCPAddr{IP: net.IPv4(127, 0, 0, 1)})
            if err != nil {
              return peerFailure("loopback-listen", err)
            }
            defer listener.Close()
            fmt.Printf("port=%d\n", listener.Addr().(*net.TCPAddr).Port)
            connection, err := listener.AcceptTCP()
            if err != nil {
              return peerFailure("loopback-accept", err)
            }
            defer connection.Close()
            fd, err := tcpFD(connection)
            if err != nil {
              return peerFailure("socket-fd", err)
            }
            if err := probeLeafWriteDenied(os.Args[2]); err != nil {
              return peerFailure("b-cgroup-write-permission", err)
            }
            fmt.Printf("socket-ready fd=%d uid=%d gid=%d leaf_write=denied\n", fd, os.Getuid(), os.Getgid())
            if _, err := io.Copy(io.Discard, os.Stdin); err != nil {
              return peerFailure("socket-peer-wait", err)
            }
            return 0
          }

          func namespaceWorker(leafDirectory string, parentUserNS string, input *bufio.Reader) int {
            currentUserNS, err := os.Readlink("/proc/self/ns/user")
            if err != nil {
              return peerFailure("read-worker-userns", err)
            }
            if currentUserNS == parentUserNS {
              return peerFailure("worker-userns-not-child", fmt.Errorf("worker remained in A's parent user namespace"))
            }

            peer := exec.Command("/proc/self/exe", "--socket-peer", leafDirectory)
            peer.Dir = "/"
            peer.Env = []string{"PATH=/usr/bin:/bin", "LANG=C", "LC_ALL=C"}
            peerPIDFD := -1
            peer.SysProcAttr = &syscall.SysProcAttr{
              Credential: &syscall.Credential{Uid: 1, Gid: 1, NoSetGroups: true},
              Pdeathsig: syscall.SIGKILL,
              PidFD: &peerPIDFD,
            }
            peerOutput, err := peer.StdoutPipe()
            if err != nil {
              return peerFailure("peer-stdout", err)
            }
            peerInput, err := peer.StdinPipe()
            if err != nil {
              return peerFailure("peer-stdin", err)
            }
            peer.Stderr = io.Discard
            if err := peer.Start(); err != nil {
              return peerFailure("cross-uid-b-launch", err)
            }
            if peerPIDFD < 0 {
              _ = peer.Process.Kill()
              _ = peer.Wait()
              return peerFailure("cross-uid-b-pidfd", fmt.Errorf("B launch did not return a pidfd"))
            }
            defer unix.Close(peerPIDFD)
            defer func() {
              _ = peerInput.Close()
              _ = peer.Process.Kill()
              _ = peer.Wait()
            }()

            peerReader := bufio.NewReader(peerOutput)
            portLine, err := peerReader.ReadString('\n')
            if err != nil {
              return peerFailure("loopback-listener-ready", err)
            }
            portValues := parseValues(portLine)
            port, err := strconv.Atoi(portValues["port"])
            if err != nil || port < 1 || port > 65535 {
              return peerFailure("loopback-listener-port", fmt.Errorf("invalid listener port"))
            }
            connection, err := net.DialTimeout("tcp4", net.JoinHostPort("127.0.0.1", strconv.Itoa(port)), 5*time.Second)
            if err != nil {
              return peerFailure("loopback-connect", err)
            }
            defer connection.Close()
            client, ok := connection.(*net.TCPConn)
            if !ok {
              return peerFailure("loopback-client-type", fmt.Errorf("connection was not TCP"))
            }

            peerLine, err := peerReader.ReadString('\n')
            if err != nil {
              return peerFailure("b-socket-ready", err)
            }
            peerValues := parseValues(peerLine)
            if peerValues["leaf_write"] != "denied" || peerValues["uid"] != "1" || peerValues["gid"] != "1" {
              return peerFailure("b-cgroup-write-permission", fmt.Errorf("B identity or denied leaf write was not proved"))
            }
            fd, err := strconv.Atoi(peerValues["fd"])
            if err != nil || fd < 0 {
              return peerFailure("b-socket-fd", fmt.Errorf("invalid B socket descriptor"))
            }
            clientLocal := client.LocalAddr().(*net.TCPAddr)
            clientRemote := client.RemoteAddr().(*net.TCPAddr)
            if !clientLocal.IP.IsLoopback() || !clientRemote.IP.IsLoopback() ||
              clientLocal.Port == 0 || clientRemote.Port == 0 {
              return peerFailure("loopback-client-tuple", fmt.Errorf("client was not an established loopback TCP connection"))
            }
            clientFD, err := tcpFD(client)
            if err != nil {
              return peerFailure("client-socket-fd", err)
            }
            clientNetnsCookie, err := socketNetnsCookie(clientFD)
            if err != nil || clientNetnsCookie == 0 {
              return peerFailure("client-socket-netns-cookie", fmt.Errorf("loopback client lacked a network namespace cookie: %v", err))
            }
            peerStart, err := processStartTime(peer.Process.Pid)
            if err != nil {
              return peerFailure("b-process-start-time", err)
            }
            fmt.Printf("peer pid=%d start=%d fd=%d leaf_write=denied client_local_ip=%s client_local_port=%d client_remote_ip=%s client_remote_port=%d client_netns_cookie=%d\n",
              peer.Process.Pid, peerStart, fd, clientLocal.IP.String(), clientLocal.Port,
              clientRemote.IP.String(), clientRemote.Port, clientNetnsCookie)

            signal, err := input.ReadByte()
            if err != nil || signal != 'P' {
              return peerFailure("host-a-cross-uid-check", fmt.Errorf("host A did not authorize namespace proof"))
            }

            inode, err := procSocketInode(peer.Process.Pid, fd)
            if err != nil {
              return peerFailure("namespace-fdinfo-permission", err)
            }
            duplicateFD, err := unix.PidfdGetfd(peerPIDFD, fd, 0)
            if err != nil {
              return peerFailure("namespace-pidfd-getfd-permission", err)
            }
            netnsCookie, err := verifySocketDuplicate(duplicateFD, inode, clientRemote, clientLocal, clientNetnsCookie)
            if err != nil {
              return peerFailure("namespace-duplicated-socket", err)
            }
            fmt.Printf("namespace-proof=passed fdinfo_inode=%d tuple=%s:%d<->%s:%d tcp_state=ESTABLISHED netns_cookie=%d pidfd_getfd=passed\n",
              inode, clientRemote.IP.String(), clientRemote.Port, clientLocal.IP.String(), clientLocal.Port, netnsCookie)
            return 0
          }

          func leafIsEmpty(leafDirectory string) (bool, error) {
            events, err := os.ReadFile(filepath.Join(leafDirectory, "cgroup.events"))
            if err != nil {
              return false, err
            }
            fields := strings.Fields(string(events))
            for i := 0; i+1 < len(fields); i += 2 {
              if fields[i] == "populated" {
                return fields[i+1] == "0", nil
              }
            }
            return false, fmt.Errorf("populated entry missing from cgroup.events")
          }

          func waitForLeafEmpty(leafDirectory string) error {
            deadline := time.Now().Add(5 * time.Second)
            for time.Now().Before(deadline) {
              empty, err := leafIsEmpty(leafDirectory)
              if err != nil {
                return err
              }
              if empty {
                return nil
              }
              time.Sleep(50 * time.Millisecond)
            }
            return fmt.Errorf("delegated leaf remained populated after cross-UID cleanup")
          }

          func runCrossUIDProbe(result *report, leafFD *os.File, leafDirectory string) (failure string, detail string) {
            leafInfo, err := os.Stat(leafDirectory)
            if err != nil {
              return "cross-uid-leaf-stat", err.Error()
            }
            leafStat, ok := leafInfo.Sys().(*syscall.Stat_t)
            if !ok || int(leafStat.Uid) != result.uid {
              return "cross-uid-leaf-not-owned-by-a", "delegated probe leaf must be owned by A"
            }
            procsInfo, err := os.Stat(filepath.Join(leafDirectory, "cgroup.procs"))
            if err != nil {
              return "cross-uid-leaf-procs-stat", err.Error()
            }
            procsStat, ok := procsInfo.Sys().(*syscall.Stat_t)
            if !ok || int(procsStat.Uid) != result.uid {
              return "cross-uid-leaf-procs-not-owned-by-a", "delegated cgroup.procs must be owned by A"
            }
            parentUserNS, err := os.Readlink("/proc/self/ns/user")
            if err != nil {
              return "parent-userns-read", err.Error()
            }

            ctx, cancel := context.WithTimeout(context.Background(), 45*time.Second)
            defer cancel()
            executable, err := os.Executable()
            if err != nil {
              return "cross-uid-executable-path", err.Error()
            }
            if err := trustedRootExecutable("/usr/bin/python3"); err != nil {
              return "cross-uid-python-prerequisite", err.Error()
            }
            command := exec.CommandContext(ctx, "/usr/bin/python3", "-I", "-S", "-c",
              namespaceGateScript, executable, leafDirectory, parentUserNS)
            command.Dir = "/"
            command.Env = []string{"PATH=/usr/bin:/bin", "LANG=C", "LC_ALL=C"}
            command.Stderr = io.Discard
            pidFD := -1
            command.SysProcAttr = &syscall.SysProcAttr{
              Cloneflags: syscall.CLONE_NEWUSER,
              UseCgroupFD: true,
              CgroupFD: int(leafFD.Fd()),
              PidFD: &pidFD,
              AmbientCaps: []uintptr{capSysSetgid, capSysSetuid, capSysPtrace},
            }
            readyRead, readyWrite, err := os.Pipe()
            if err != nil {
              return "userns-ready-pipe", err.Error()
            }
            defer readyRead.Close()
            command.ExtraFiles = []*os.File{readyWrite}
            input, err := command.StdinPipe()
            if err != nil {
              _ = readyWrite.Close()
              return "userns-stdin", err.Error()
            }
            output, err := command.StdoutPipe()
            if err != nil {
              _ = readyWrite.Close()
              _ = input.Close()
              return "userns-stdout", err.Error()
            }
            if err := command.Start(); err != nil {
              _ = readyWrite.Close()
              _ = input.Close()
              return "cross-uid-userns-create", err.Error()
            }
            waited := false
            defer func() {
              _ = input.Close()
              _ = readyWrite.Close()
              if !waited {
                _ = command.Process.Kill()
                _ = command.Wait()
                waited = true
              }
              if err := waitForLeafEmpty(leafDirectory); err != nil {
                recordCleanupFailure(&failure, &detail, "cross-uid-child-cleanup", err)
              }
            }()
            _ = readyWrite.Close()
            pid := command.Process.Pid
            if pidFD < 0 {
              return "cross-uid-userns-pidfd", "clone3 did not return a pidfd"
            }
            defer syscall.Close(pidFD)
            ready := make([]byte, 1)
            if _, err := io.ReadFull(readyRead, ready); err != nil || ready[0] != 'E' {
              diagnostic, _ := io.ReadAll(output)
              return "cross-uid-userns-create", fmt.Sprintf("child user namespace unavailable: %v: %s", err, strings.TrimSpace(string(diagnostic)))
            }
            fmt.Println("namespace_gate_groups=empty")
            nsDev, nsIno, err := namespaceIdentity(pid)
            if err != nil {
              return "cross-uid-userns-identity", err.Error()
            }
            childStart, err := processStartTime(pid)
            if err != nil {
              return "cross-uid-child-identity", err.Error()
            }
            if err := runRootMapping("uid", os.Getpid(), pid, nsDev, nsIno, childStart,
              result.cgroup, result.leafCgroup); err != nil {
              return "cross-uid-fixed-b-uid-map", err.Error()
            }
            if err := exactIDMap(pid, "uid_map", probeBUID); err != nil {
              return "cross-uid-fixed-b-uid-map", err.Error()
            }
            if _, err := input.Write([]byte{'U'}); err != nil {
              return "cross-uid-clear-groups", err.Error()
            }
            if _, err := io.ReadFull(readyRead, ready); err != nil || ready[0] != 'G' {
              diagnostic, _ := io.ReadAll(output)
              return "cross-uid-gid-map-ready", fmt.Sprintf("namespace gate did not reach the GID map boundary: %v: %s", err, strings.TrimSpace(string(diagnostic)))
            }
            if err := runRootMapping("gid", os.Getpid(), pid, nsDev, nsIno, childStart,
              result.cgroup, result.leafCgroup); err != nil {
              return "cross-uid-fixed-b-gid-map", err.Error()
            }
            if err := exactIDMap(pid, "gid_map", probeBGID); err != nil {
              return "cross-uid-fixed-b-gid-map", err.Error()
            }
            setgroups, err := os.ReadFile(fmt.Sprintf("/proc/%d/setgroups", pid))
            if err != nil || strings.TrimSpace(string(setgroups)) != "deny" {
              return "cross-uid-setgroups-policy", "setgroups policy was not deny after the B-only GID map"
            }
            fmt.Println("userns_uid_map=1,65534,1")
            fmt.Println("userns_gid_map=1,65534,1")
            fmt.Println("userns_setgroups=deny")
            fmt.Println("root_mapping=transient-helper-in-delegated-unit")
            if _, err := input.Write([]byte{'G'}); err != nil {
              return "cross-uid-userns-release", err.Error()
            }

            parentNamespace, err := os.Readlink("/proc/self/ns/user")
            if err != nil {
              return "parent-userns-read", err.Error()
            }
            childNamespace, err := os.Readlink(fmt.Sprintf("/proc/%d/ns/user", pid))
            if err != nil || childNamespace == parentNamespace {
              return "cross-uid-userns-not-child", "A-owned child user namespace was not observed"
            }
            ownerIDs, err := statusIDs(pid, "Uid")
            if err != nil || len(ownerIDs) != 4 || ownerIDs[0] != result.uid || ownerIDs[1] != result.uid ||
              ownerIDs[2] != result.uid || ownerIDs[3] != result.uid {
              return "cross-uid-userns-owner", "user namespace worker did not retain A's host UID"
            }
            parentGIDs, err := statusIDs(os.Getpid(), "Gid")
            workerGIDs, workerGIDErr := statusIDs(pid, "Gid")
            if err != nil || workerGIDErr != nil || len(parentGIDs) != 4 || len(workerGIDs) != 4 {
              return "cross-uid-userns-owner-gid", "could not verify A's host GID in the namespace worker"
            }
            for i := range parentGIDs {
              if workerGIDs[i] != parentGIDs[i] {
                return "cross-uid-userns-owner-gid", "user namespace worker did not retain A's host GID"
              }
            }
            groups, err := statusValue(pid, "Groups")
            if err != nil || strings.TrimSpace(groups) != "" {
              return "cross-uid-groups-not-cleared", "A-owned namespace worker retained supplementary groups"
            }
            workerCaps, err := statusValue(pid, "CapEff")
            workerCapMask, capErr := strconv.ParseUint(workerCaps, 16, 64)
            if err != nil || capErr != nil || workerCapMask&(1<<capSysPtrace) == 0 {
              return "namespace-cap-sys-ptrace-unavailable", "A-owned child namespace lacks CAP_SYS_PTRACE"
            }
            if result.hostCapEff != "0000000000000000" {
              return "host-capabilities-changed", "A must retain host CapEff=0"
            }
            hostCapEff, err := statusValue(os.Getpid(), "CapEff")
            if err != nil || strings.TrimSpace(hostCapEff) != "0000000000000000" {
              return "host-capabilities-changed", "A must retain host CapEff=0"
            }

            reader := bufio.NewReader(output)
            line, err := reader.ReadString('\n')
            if err != nil {
              return "cross-uid-b-launch", fmt.Sprintf("B socket peer did not become ready: %v", err)
            }
            values := parseValues(line)
            if !strings.HasPrefix(line, "peer ") {
              return "cross-uid-b-launch", strings.TrimSpace(line)
            }
            peerPID, err := strconv.Atoi(values["pid"])
            if err != nil || peerPID <= 0 {
              return "cross-uid-b-launch", "invalid B PID"
            }
            peerStart, err := strconv.ParseUint(values["start"], 10, 64)
            if err != nil || peerStart == 0 {
              return "cross-uid-b-start-time", "invalid B start time"
            }
            peerFD, err := strconv.Atoi(values["fd"])
            if err != nil || peerFD < 0 {
              return "cross-uid-b-socket-fd", "invalid B socket FD"
            }
            clientLocalIP := net.ParseIP(values["client_local_ip"])
            clientLocalPort, localPortErr := strconv.Atoi(values["client_local_port"])
            clientRemoteIP := net.ParseIP(values["client_remote_ip"])
            clientRemotePort, remotePortErr := strconv.Atoi(values["client_remote_port"])
            clientNetnsCookie, cookieErr := strconv.ParseUint(values["client_netns_cookie"], 10, 64)
            if localPortErr != nil || remotePortErr != nil || cookieErr != nil ||
              clientLocalIP == nil || clientRemoteIP == nil || !clientLocalIP.IsLoopback() ||
              !clientRemoteIP.IsLoopback() || clientLocalPort < 1 || clientRemotePort < 1 || clientNetnsCookie == 0 {
              return "cross-uid-loopback-metadata", "B peer did not forward a valid live loopback tuple and network namespace cookie"
            }
            expectedLocal := &net.TCPAddr{IP: clientRemoteIP, Port: clientRemotePort}
            expectedRemote := &net.TCPAddr{IP: clientLocalIP, Port: clientLocalPort}
            hostPeerFD, err := unix.PidfdOpen(peerPID, 0)
            if err != nil {
              return "host-a-pidfd-open", err.Error()
            }
            defer unix.Close(hostPeerFD)
            currentStart, err := processStartTime(peerPID)
            if err != nil || currentStart != peerStart {
              return "host-a-b-pid-identity", "B PID/start-time changed before host-A pidfd acquisition"
            }
            peerParent, err := statusValue(peerPID, "PPid")
            parentPID, parentErr := strconv.Atoi(peerParent)
            if err != nil || parentErr != nil || parentPID != pid {
              return "host-a-b-parent-identity", "B was not the exact child of A's namespace worker"
            }
            if values["leaf_write"] != "denied" {
              return "cross-uid-b-cgroup-write", "B did not prove denial on A's cgroup.procs"
            }
            peerUIDs, err := statusIDs(peerPID, "Uid")
            if err != nil || len(peerUIDs) != 4 || peerUIDs[0] != probeBUID || peerUIDs[1] != probeBUID ||
              peerUIDs[2] != probeBUID || peerUIDs[3] != probeBUID {
              return "cross-uid-b-host-uid", "B process did not run with the fixed host UID"
            }
            peerGIDs, err := statusIDs(peerPID, "Gid")
            if err != nil || len(peerGIDs) != 4 || peerGIDs[0] != probeBGID || peerGIDs[1] != probeBGID ||
              peerGIDs[2] != probeBGID || peerGIDs[3] != probeBGID {
              return "cross-uid-b-host-gid", "B process did not run with the fixed host GID"
            }
            peerGroups, err := statusValue(peerPID, "Groups")
            if err != nil || strings.TrimSpace(peerGroups) != "" {
              return "cross-uid-b-groups-not-empty", "B retained supplementary groups"
            }
            peerCapEff, err := statusValue(peerPID, "CapEff")
            if err != nil || strings.TrimSpace(peerCapEff) != "0000000000000000" {
              return "cross-uid-b-capabilities-nonzero", "B must have CapEff=0"
            }
            peerUserNS, err := os.Readlink(fmt.Sprintf("/proc/%d/ns/user", peerPID))
            if err != nil || peerUserNS != childNamespace {
              return "cross-uid-b-userns", "B was not launched in A's child user namespace"
            }
            peerCgroup, err := membershipFor(peerPID)
            if err != nil || peerCgroup != result.leafCgroup {
              return "cross-uid-b-cgroup", "B was not launched in A's exact delegated leaf"
            }

            hostCapEff, err = statusValue(os.Getpid(), "CapEff")
            if err != nil || strings.TrimSpace(hostCapEff) != "0000000000000000" {
              return "host-a-capabilities-nonzero", "host A must retain CapEff=0 for its positive B socket proof"
            }
            inode, err := procSocketInode(peerPID, peerFD)
            if err != nil {
              return "host-a-fdinfo-permission", err.Error()
            }
            hostDuplicate, err := unix.PidfdGetfd(hostPeerFD, peerFD, 0)
            if err != nil {
              return "host-a-pidfd-getfd-permission", err.Error()
            }
            hostNetnsCookie, err := verifySocketDuplicate(hostDuplicate, inode, expectedLocal, expectedRemote, clientNetnsCookie)
            if err != nil {
              return "host-a-duplicated-socket", err.Error()
            }
            fmt.Printf("host_a_pidfd_getfd=passed b_pid=%d b_start=%d fdinfo_inode=%d netns_cookie=%d host_cap_eff=0\n",
              peerPID, peerStart, inode, hostNetnsCookie)

            if _, err := input.Write([]byte{'P'}); err != nil {
              return "cross-uid-namespace-release", err.Error()
            }
            proof, err := io.ReadAll(reader)
            if err != nil {
              return "namespace-pidfd-proof-read", err.Error()
            }
            waitErr := command.Wait()
            waited = true
            if waitErr != nil {
              if ctx.Err() != nil {
                return "cross-uid-probe-timeout", ctx.Err().Error()
              }
              return "cross-uid-namespace-pidfd-proof", waitErr.Error() + ": " + strings.TrimSpace(string(proof))
            }
            if !strings.Contains(string(proof), "namespace-proof=passed") ||
              !strings.Contains(string(proof), "fdinfo_inode=") ||
              !strings.Contains(string(proof), "tcp_state=ESTABLISHED") ||
              !strings.Contains(string(proof), "netns_cookie=") ||
              !strings.Contains(string(proof), "pidfd_getfd=passed") {
              return "cross-uid-namespace-pidfd-proof", strings.TrimSpace(string(proof))
            }
            return "", ""
          }

          func runProbe() (result report, failure string) {
            result.uid = os.Geteuid()
            result.bUID = probeBUID
            result.capability = "not-proven"
            result.crossUIDCapability = "not-proven"
            kernel, err := os.ReadFile("/proc/sys/kernel/osrelease")
            if err != nil {
              return result, "kernel-version"
            }
            result.kernel = "linux/" + strings.TrimSpace(string(kernel))
            if result.uid == 0 {
              return result, "runner-is-root"
            }
            if failure := checkHostPrerequisites(&result); failure != "" {
              return result, failure
            }
            result.cgroup, err = membership()
            if err != nil {
              return result, "parent-membership"
            }
            parentDirectory, err := cgroupDirectory(result.cgroup)
            if err != nil {
              return result, "cgroup2-mount"
            }
            leafDirectory, err := os.MkdirTemp(parentDirectory, "symmetry-cgroup-probe-")
            if err != nil {
              result.capability = "unavailable"
              return result, "delegated-parent-not-writable"
            }
            result.leafCgroup = result.cgroup
            if result.leafCgroup != "/" {
              result.leafCgroup += "/"
            }
            result.leafCgroup += filepath.Base(leafDirectory)
            leafCreated := true
            var leafFD *os.File
            defer func() {
              if leafFD != nil {
                if err := leafFD.Close(); err != nil {
                  recordCleanupFailure(&failure, &result.failureDetail, "close-leaf-fd", err)
                }
              }
              if leafCreated {
                if err := os.Remove(leafDirectory); err != nil {
                  recordCleanupFailure(&failure, &result.failureDetail, "remove-leaf", err)
                }
              }
            }()
            leafFD, err = os.Open(leafDirectory)
            if err != nil {
              return result, "open-leaf-fd"
            }

            ctx, cancel := context.WithTimeout(context.Background(), 20*time.Second)
            defer cancel()
            output := new(bytes.Buffer)
            pidFD := -1
            command := exec.CommandContext(ctx, "/proc/self/exe", "--child")
            command.Stdout = output
            command.Stderr = io.Discard
            command.SysProcAttr = &syscall.SysProcAttr{
              UseCgroupFD: true,
              CgroupFD:    int(leafFD.Fd()),
              PidFD:       &pidFD,
            }
            if err := command.Start(); err != nil {
              result.capability = "unavailable"
              return result, "clone3-cgroupfd-pidfd"
            }
            if pidFD < 0 {
              cancel()
              _ = command.Wait()
              result.capability = "unavailable"
              return result, "pidfd-not-returned"
            }
            pidFDErr := syscall.Close(pidFD)
            waitErr := command.Wait()
            timedOut := ctx.Err() != nil
            cancel()
            if pidFDErr != nil {
              return result, "close-pidfd"
            }
            if waitErr != nil {
              if timedOut {
                return result, "child-timeout"
              }
              return result, "child-exit"
            }

            values := make(map[string]string)
            for _, line := range strings.Split(strings.TrimSpace(output.String()), "\n") {
              key, value, ok := strings.Cut(line, "=")
              if ok {
                values[key] = value
              }
            }
            result.childUID, err = strconv.Atoi(values["uid"])
            if err != nil || result.childUID != result.uid {
              return result, "child-uid-mismatch"
            }
            if values["cgroup_path"] != result.leafCgroup {
              return result, "child-leaf-mismatch"
            }
            events, err := os.ReadFile(filepath.Join(leafDirectory, "cgroup.events"))
            if err != nil {
              return result, "read-cgroup-events"
            }
            populatedZero := false
            fields := strings.Fields(string(events))
            for i := 0; i+1 < len(fields); i += 2 {
              if fields[i] == "populated" && fields[i+1] == "0" {
                populatedZero = true
              }
            }
            if !populatedZero {
              return result, "leaf-still-populated"
            }
            result.capability = "clone3-cgroupfd-pidfd"
            if failure, detail := runCrossUIDProbe(&result, leafFD, leafDirectory); failure != "" {
              result.failureDetail = detail
              return result, failure
            }
            events, err = os.ReadFile(filepath.Join(leafDirectory, "cgroup.events"))
            if err != nil {
              return result, "read-cross-uid-cgroup-events"
            }
            populatedZero = false
            fields = strings.Fields(string(events))
            for i := 0; i+1 < len(fields); i += 2 {
              if fields[i] == "populated" && fields[i+1] == "0" {
                populatedZero = true
              }
            }
            if !populatedZero {
              return result, "cross-uid-leaf-still-populated"
            }
            result.crossUIDCapability = "fixed-b-child-userns-fdinfo-pidfd-getfd"
            return result, ""
          }

          func main() {
            if len(os.Args) == 2 && os.Args[1] == "--userns-check" {
              os.Exit(usernsCheckChild())
            }
            if len(os.Args) == 2 && os.Args[1] == "--child" {
              os.Exit(child())
            }
            if len(os.Args) == 4 && os.Args[1] == "--namespace-worker" {
              os.Exit(namespaceWorker(os.Args[2], os.Args[3], bufio.NewReader(os.Stdin)))
            }
            if len(os.Args) == 3 && os.Args[1] == "--socket-peer" {
              os.Exit(socketPeer())
            }
            result, failure := runProbe()
            fmt.Printf("uid=%d\n", result.uid)
            fmt.Printf("cross_uid_target=%d\n", result.bUID)
            fmt.Printf("cross_gid_target=%d\n", probeBGID)
            if result.childUID != 0 {
              fmt.Printf("child_uid=%d\n", result.childUID)
            }
            if result.kernel != "" {
              fmt.Printf("kernel=%s\n", result.kernel)
            }
            if result.cgroup != "" {
              fmt.Printf("cgroup_path=%s\n", result.cgroup)
            }
            if result.leafCgroup != "" {
              fmt.Printf("leaf_cgroup_path=%s\n", result.leafCgroup)
            }
            fmt.Printf("capability=%s\n", result.capability)
            fmt.Printf("cross_uid_capability=%s\n", result.crossUIDCapability)
            fmt.Println("coverage=production_a_gate=not-tested native_pi_opencode=not-tested daemon_crash=not-tested")
            if result.suidDumpable != "" {
              fmt.Printf("fs_suid_dumpable=%s\n", result.suidDumpable)
            }
            if result.usernsEnabled {
              fmt.Println("userns_enabled=true")
            }
            if result.usernsCreated {
              fmt.Println("userns_create=passed")
            }
            if result.hostCapEff != "" {
              fmt.Printf("host_cap_eff=%s\n", result.hostCapEff)
            }
            if failure != "" {
              fmt.Printf("status=failed stage=%s", failure)
              if result.failureDetail != "" {
                fmt.Printf(" detail=%q", result.failureDetail)
              }
              fmt.Println()
              os.Exit(1)
            }
            fmt.Println("status=passed")
          }
          GO
          go build -trimpath -o "$binary" "$source"
      - name: Run as the unprivileged delegated service user
        shell: bash
        run: |
          set -Eeuo pipefail
          if timeout --signal=TERM --kill-after=5s 120s \
            sudo -n systemd-run --quiet --system --wait --collect --pipe \
              --property=Delegate=yes \
              --property="User=$(id -un)" \
              --property="WorkingDirectory=$GITHUB_WORKSPACE/daemon" \
              --property=RuntimeMaxSec=90s \
              "$RUNNER_TEMP/cgroup-v2-delegation-probe"; then
            exit 0
          fi
          printf 'capability=not-proven\nstatus=failed stage=systemd-run-or-timeout\n'
          exit 1

      - name: Remove disposable cgroup probe programs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f -- "$RUNNER_TEMP/cgroup-v2-delegation-probe.go" \
            "$RUNNER_TEMP/cgroup-v2-delegation-probe"

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check

  control:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: symmetry_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d symmetry_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: control
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: symmetry_control_test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.6
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache-dependency-path: daemon/go.sum
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - name: Run provider broker end-to-end tests
        timeout-minutes: 10
        env:
          SYMMETRY_PROVIDER_BROKER_E2E: "1"
        run: mix test test/symmetry_control/provider_broker_e2e_test.exs
      - name: Verify committed Goal receipts over HTTP
        timeout-minutes: 5
        env:
          SYMMETRY_GOAL_RECEIPT_E2E: "1"
        run: |
          set -Eeuo pipefail
          export POSTGRES_DB="symmetry_receipt_e2e_$(openssl rand -hex 16)"
          test_output="$RUNNER_TEMP/goal-receipt-e2e.log"
          set +e
          mix test test/symmetry_control_web/controllers/goal_machine_controller_test.exs --only goal_receipt_e2e 2>&1 |
            tee "$test_output"
          pipeline_status=("${PIPESTATUS[@]}")
          test_status=${pipeline_status[0]}
          tee_status=${pipeline_status[1]}
          set -e

          summary_status=0
          python3 - "$test_output" <<'PY' || summary_status=$?
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          text = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", text)
          results = re.findall(r"(?m)^\s*Result:\s*(\d+)(?:/(\d+))?\s+passed\b([^\r\n]*)$", text)
          reported_failures = re.findall(r"(?m)^\s*Failed:\s*(\d+)\s+tests?\b", text)
          summaries = re.findall(r"(?m)^\s*(\d+)\s+tests?,\s*(\d+)\s+failures?\b", text)
          if results:
              passed_text, total_text, tail = results[-1]
              passed = int(passed_text)
              failed = re.search(r"(\d+)\s+failed\b", tail)
              failures = (
                  int(reported_failures[-1])
                  if reported_failures
                  else int(failed.group(1))
                  if failed
                  else int(total_text) - passed
                  if total_text
                  else 0
              )
              tests = int(total_text) if total_text else passed + failures
          elif summaries:
              tests, failures = map(int, summaries[-1])
          else:
              raise SystemExit("ExUnit summary was not found")
          if tests <= 0 or failures != 0:
              raise SystemExit(
                  f"ExUnit selective gate expected tests>0 and failures=0; got tests={tests}, failures={failures}"
              )
          print(f"verified ExUnit summary: tests={tests}, failures={failures}")
          PY

          if (( test_status != 0 )); then
            exit "$test_status"
          fi
          if (( tee_status != 0 )); then
            exit "$tee_status"
          fi
          if (( summary_status != 0 )); then
            exit "$summary_status"
          fi
      - run: MIX_ENV=prod mix release --overwrite

  pi-control-e2e-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: symmetry_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d symmetry_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: control
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: symmetry_control_test
    steps:
      - uses: actions/checkout@v4
      - name: Initialize Linux Pi E2E workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          export TMPDIR="$RUNNER_TEMP/symmetry-pi-control-tmp"
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
          mkdir -p "$TMPDIR"
          : > "$RUNNER_TEMP/pi-control-e2e-linux.log"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.6
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache-dependency-path: daemon/go.sum
      - run: mix deps.get
      - name: Prepare pinned Linux Pi release
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -Eeuo pipefail

          release_url='https://github.com/earendil-works/pi/releases/download/v0.87.1/pi-linux-x64.tar.gz'
          archive="$RUNNER_TEMP/pi-linux-x64.tar.gz"
          release_dir="$RUNNER_TEMP/pi-0.87.1"
          executable="$release_dir/pi/pi"
          log="$RUNNER_TEMP/pi-control-e2e-linux.log"
          provenance="$RUNNER_TEMP/pi-control-e2e-linux-provenance.txt"
          archive_sha256='80d78dd62d50049a006b981d994c61255bcc10e730b0c278d4ea0a755909764c'
          executable_sha256='3e8177cb94d6b4577f3626f9400d80c92d991867400c21a779784f5bee9b9925'
          pi_version='0.87.1'

          : > "$log"
          rm -rf "$release_dir"
          mkdir -p "$release_dir"

          {
            printf 'source_revision=%s\n' "$GITHUB_SHA"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'pi_target=x86_64-pc-linux-gnu\n'
            printf 'pi_release_url=%s\n' "$release_url"
            printf 'pi_version_expected=%s\n' "$pi_version"
            printf 'pi_archive_sha256_expected=%s\n' "$archive_sha256"
            printf 'pi_executable_path=%s\n' "$executable"
            printf 'pi_executable_sha256_expected=%s\n' "$executable_sha256"
            printf 'provider_credentials=none\n'
            printf 'upstream_scope=numeric IPv4 loopback only\n'
            printf 'witness_scope=test-only\n'
          } > "$provenance"

          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-max-time 120 --retry-all-errors \
            "$release_url" --output "$archive" 2>&1 | tee -a "$log"

          printf '%s  %s\n' "$archive_sha256" "$archive" |
            sha256sum --check --strict 2>&1 | tee -a "$log"

          tar --extract --file "$archive" --directory "$release_dir"
          test -x "$executable"

          actual_executable_sha256=$(sha256sum "$executable" | awk '{print $1}')
          actual_pi_version=$(timeout 30s "$executable" --version)
          test "$actual_executable_sha256" = "$executable_sha256"
          test "$actual_pi_version" = "$pi_version"

          {
            printf 'pi_archive_sha256_actual=%s\n' "$(sha256sum "$archive" | awk '{print $1}')"
            printf 'pi_executable_sha256_actual=%s\n' "$actual_executable_sha256"
            printf 'pi_version_actual=%s\n' "$actual_pi_version"
          } >> "$provenance"

          printf 'verified Pi %s (%s) at %s\n' "$actual_pi_version" "$actual_executable_sha256" "$executable" |
            tee -a "$log"
      - name: Run Linux Pi provider bridge smoke
        working-directory: daemon
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/pi-control-e2e-linux.log"
          test_output="$RUNNER_TEMP/pi-provider-bridge-linux.json"
          : > "$test_output"
          set +e
          SYMMETRY_PI_PROVIDER_ACTION_SMOKE=1 \
          SYMMETRY_PI_NATIVE_SMOKE_EXECUTABLE="$RUNNER_TEMP/pi-0.87.1/pi/pi" \
            go test -json -count=1 -timeout 90s ./internal/harness/pi \
              -run '^TestNativePiProviderBridgeAction$' 2>&1 |
            tee -a "$log" "$test_output"
          pipeline_status=("${PIPESTATUS[@]}")
          test_status=${pipeline_status[0]}
          tee_status=${pipeline_status[1]}
          set -e

          summary_status=0
          python3 - "$test_output" <<'PY' || summary_status=$?
          import json
          import sys

          expected = "TestNativePiProviderBridgeAction"
          runs = set()
          passes = set()
          failures = set()
          with open(sys.argv[1], encoding="utf-8", errors="strict") as stream:
              for number, line in enumerate(stream, 1):
                  if not line.strip():
                      continue
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError as error:
                      raise SystemExit(f"invalid go test -json line {number}: {error}")
                  test = event.get("Test")
                  action = event.get("Action")
                  if test == expected and action == "run":
                      runs.add(test)
                  elif test == expected and action == "pass":
                      passes.add(test)
                  elif test == expected and action == "fail":
                      failures.add(test)
          if expected not in runs or expected not in passes or failures:
              raise SystemExit(
                  f"Pi provider bridge selective gate failed: run={sorted(runs)} pass={sorted(passes)} fail={sorted(failures)}"
              )
          PY

          printf 'provider_bridge_smoke_exit_status=%s\n' "$test_status" >> "$RUNNER_TEMP/pi-control-e2e-linux-provenance.txt"
          if [ "$tee_status" -ne 0 ]; then
            printf 'provider_bridge_smoke_status=failed: tee exited with status %s\n' "$tee_status" >> "$RUNNER_TEMP/pi-control-e2e-linux-provenance.txt"
            exit "$tee_status"
          fi
          if [ "$test_status" -ne 0 ]; then
            printf 'provider_bridge_smoke_status=failed: go test exited with status %s\n' "$test_status" >> "$RUNNER_TEMP/pi-control-e2e-linux-provenance.txt"
            exit "$test_status"
          fi
          if [ "$summary_status" -ne 0 ]; then
            printf 'provider_bridge_smoke_status=failed: selective witness validation exited with status %s\n' "$summary_status" >> "$RUNNER_TEMP/pi-control-e2e-linux-provenance.txt"
            exit "$summary_status"
          fi
          printf 'provider_bridge_smoke_status=passed\n' >> "$RUNNER_TEMP/pi-control-e2e-linux-provenance.txt"
      - name: Run control format and compile
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/pi-control-e2e-linux.log"
          mix format --check-formatted 2>&1 | tee -a "$log"
          mix compile --warnings-as-errors 2>&1 | tee -a "$log"
      - name: Verify Linux Pi cleanup pidfd group signaling
        shell: bash
        run: |
          set -Eeuo pipefail
          fixture_root="$RUNNER_TEMP/pi-pidfd-cleanup-fixture"
          mkdir -p "$fixture_root/runner-temp" "$fixture_root/tmp"
          export RUNNER_TEMP="$fixture_root/runner-temp"
          export TMPDIR="$fixture_root/tmp"
          python3 - ../scripts/cleanup-linux-pi-processes.sh <<'PY'
          import json
          import os
          import pathlib
          import platform
          import signal
          import subprocess
          import sys
          import tempfile
          import threading

          cleanup_script = sys.argv[1]
          groups = []

          def process_stat(pid):
              with open(f"/proc/{pid}/stat", encoding="ascii") as stream:
                  _, fields = stream.read().rsplit(") ", 1)
              values = fields.split()
              return {
                  "state": values[0],
                  "pgrp": int(values[2]),
                  "session": int(values[3]),
                  "start": values[19],
              }

          def launch_group(label):
              marker_dir = pathlib.Path(
                  tempfile.mkdtemp(
                      prefix=f"symmetry-pi-control-run-{label}-",
                      dir=os.environ["TMPDIR"],
                  )
              )
              group = {
                  "label": label,
                  "marker": marker_dir / "process-marker.json",
                  "processes": [],
                  "pidfds": [],
                  "reaped": [],
              }
              groups.append(group)

              leader = subprocess.Popen(
                  [sys.executable, "-c", "import signal; signal.pause()"],
                  process_group=0,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              group["processes"].append(leader)
              group["pidfds"].append(None)
              leader_reaped = threading.Event()
              group["reaped"].append(leader_reaped)
              threading.Thread(
                  target=lambda: (leader.wait(), leader_reaped.set()),
                  daemon=True,
              ).start()
              group["pidfds"][-1] = os.pidfd_open(leader.pid, 0)

              child = subprocess.Popen(
                  [sys.executable, "-c", "import signal; signal.pause()"],
                  process_group=leader.pid,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              group["processes"].append(child)
              group["pidfds"].append(None)
              child_reaped = threading.Event()
              group["reaped"].append(child_reaped)
              threading.Thread(
                  target=lambda: (child.wait(), child_reaped.set()),
                  daemon=True,
              ).start()
              group["pidfds"][-1] = os.pidfd_open(child.pid, 0)

              leader_stat = process_stat(leader.pid)
              child_stat = process_stat(child.pid)
              if (
                  leader_stat["state"] in ("Z", "X", "x")
                  or child_stat["state"] in ("Z", "X", "x")
                  or leader_stat["pgrp"] != leader.pid
                  or leader_stat["session"] == leader.pid
                  or child_stat["pgrp"] != leader.pid
                  or child_stat["session"] != leader_stat["session"]
              ):
                  raise RuntimeError("fixture processes are not a live same-session process group")

              with open("/proc/sys/kernel/random/boot_id", encoding="ascii") as stream:
                  boot_id = stream.read().strip()
              namespace_link = os.readlink(f"/proc/{leader.pid}/ns/pid")
              namespace_inode = os.stat(f"/proc/{leader.pid}/ns/pid").st_ino
              if namespace_link != f"pid:[{namespace_inode}]":
                  raise RuntimeError("fixture PID namespace identity did not match its proc link")
              group["identity"] = (
                  f"linux:v2:{boot_id}:{namespace_inode}:{leader.pid}:{leader_stat['start']}"
              )
              return group

          def write_marker(group, identity):
              group["marker"].write_text(
                  json.dumps({"pid": group["processes"][0].pid, "process_identity": identity}),
                  encoding="utf-8",
              )

          def run_cleanup():
              result = subprocess.run(
                  ["bash", cleanup_script],
                  capture_output=True,
                  check=False,
                  text=True,
              )
              sys.stdout.write(result.stdout)
              sys.stderr.write(result.stderr)
              return result

          def wait_for_stopped_group(group):
              for reaped in group["reaped"]:
                  if not reaped.wait(timeout=5):
                      raise RuntimeError(f"{group['label']} fixture process did not exit")

          def assert_group_live(group):
              if any(process.poll() is not None for process in group["processes"]):
                  raise RuntimeError(f"{group['label']} fixture process was signalled")

          def signal_fixture_process(group, index, signal_number):
              process = group["processes"][index]
              pidfd = group["pidfds"][index]
              if pidfd is None:
                  if process.poll() is None:
                      process.send_signal(signal_number)
              else:
                  try:
                      signal.pidfd_send_signal(pidfd, signal_number)
                  except ProcessLookupError:
                      pass

          def stop_fixture_group(group):
              for index in range(len(group["processes"])):
                  signal_fixture_process(group, index, signal.SIGTERM)
              if not all(reaped.wait(timeout=5) for reaped in group["reaped"]):
                  for index in range(len(group["processes"])):
                      signal_fixture_process(group, index, signal.SIGKILL)
                  if not all(reaped.wait(timeout=5) for reaped in group["reaped"]):
                      raise RuntimeError(f"could not stop {group['label']} fixture processes")

          try:
              if platform.machine() not in ("x86_64", "amd64"):
                  raise RuntimeError(f"fixture requires x86_64, got {platform.machine()!r}")

              matching = launch_group("matching")
              write_marker(matching, matching["identity"])
              matching_result = run_cleanup()
              if matching_result.returncode != 0:
                  raise RuntimeError(
                      f"matching identity cleanup failed with status {matching_result.returncode}"
                  )
              if f"cleanup stopped process group={matching['processes'][0].pid}" not in matching_result.stdout:
                  raise RuntimeError("matching identity cleanup did not report stopped process group")
              wait_for_stopped_group(matching)
              matching["marker"].unlink()
              print("verified matching v2 identity stopped and proved leader plus same-group child")

              mismatched = launch_group("wrong-start")
              _, _, boot_id, namespace, pid, start = mismatched["identity"].split(":")
              wrong_identity = (
                  f"linux:v2:{boot_id}:{namespace}:{pid}:{int(start) + 1}"
              )
              write_marker(mismatched, wrong_identity)
              mismatch_result = run_cleanup()
              if mismatch_result.returncode == 0:
                  raise RuntimeError("wrong-start identity was accepted")
              if "exact process identity is not live" not in mismatch_result.stdout:
                  raise RuntimeError("wrong-start identity was not refused for the identity mismatch")
              assert_group_live(mismatched)
              mismatched["marker"].unlink()
              print("verified wrong-start identity was refused without signalling either process")
          finally:
              cleanup_errors = []
              for group in groups:
                  try:
                      group["marker"].unlink(missing_ok=True)
                      stop_fixture_group(group)
                  except Exception as error:
                      cleanup_errors.append(f"{group['label']}: {error}")
                  finally:
                      for pidfd in group["pidfds"]:
                          if pidfd is not None:
                              os.close(pidfd)
                      for process in group["processes"]:
                          if process.stdout is not None:
                              process.stdout.close()
                          if process.stderr is not None:
                              process.stderr.close()
              if cleanup_errors:
                  raise RuntimeError("fixture cleanup failed: " + "; ".join(cleanup_errors))
          PY
      - name: Run Linux Pi Control E2E
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/pi-control-e2e-linux.log"
          test_output="$RUNNER_TEMP/pi-control-e2e-linux-test.log"
          : > "$test_output"
          set +e
          SYMMETRY_PI_CONTROL_E2E=1 \
          SYMMETRY_PI_CONTROL_E2E_EXECUTABLE="$RUNNER_TEMP/pi-0.87.1/pi/pi" \
            mix test test/symmetry_control/pi_control_e2e_test.exs --include skip:true --only pi_control_e2e 2>&1 |
            tee -a "$log" "$test_output"
          pipeline_status=("${PIPESTATUS[@]}")
          test_status=${pipeline_status[0]}
          tee_status=${pipeline_status[1]}
          set -e

          summary_status=0
          python3 - "$test_output" <<'PY' || summary_status=$?
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          text = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", text)
          results = re.findall(r"(?m)^\s*Result:\s*(\d+)(?:/(\d+))?\s+passed\b([^\r\n]*)$", text)
          reported_failures = re.findall(r"(?m)^\s*Failed:\s*(\d+)\s+tests?\b", text)
          summaries = re.findall(r"(?m)^\s*(\d+)\s+tests?,\s*(\d+)\s+failures?\b", text)
          if results:
              passed_text, total_text, tail = results[-1]
              passed = int(passed_text)
              failed = re.search(r"(\d+)\s+failed\b", tail)
              failures = (
                  int(reported_failures[-1])
                  if reported_failures
                  else int(failed.group(1))
                  if failed
                  else int(total_text) - passed
                  if total_text
                  else 0
              )
              tests = int(total_text) if total_text else passed + failures
          elif summaries:
              tests, failures = map(int, summaries[-1])
          else:
              raise SystemExit("ExUnit summary was not found")
          if tests <= 0 or failures != 0:
              raise SystemExit(
                  f"ExUnit selective gate expected tests>0 and failures=0; got tests={tests}, failures={failures}"
              )
          print(f"verified ExUnit summary: tests={tests}, failures={failures}")
          PY

          if (( test_status != 0 )); then
            exit "$test_status"
          fi
          if (( tee_status != 0 )); then
            exit "$tee_status"
          fi
          if (( summary_status != 0 )); then
            exit "$summary_status"
          fi
      - name: Cleanup orphaned Pi Control processes
        if: always()
        shell: bash
        run: bash ../scripts/cleanup-linux-pi-processes.sh
      - name: Upload Linux Pi E2E log and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-control-e2e-linux-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/pi-control-e2e-linux.log
            ${{ runner.temp }}/pi-control-e2e-linux-provenance.txt

  pi-control-e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: control
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: symmetry_control_test
    steps:
      - uses: actions/checkout@v4
      - name: Initialize Windows Pi E2E workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PI_E2E_TEMP = Join-Path $env:RUNNER_TEMP 'symmetry-pi-control-tmp'
          $env:PI_E2E_LOG = Join-Path $env:RUNNER_TEMP 'pi-control-e2e-windows.log'
          $env:PI_E2E_PROVENANCE = Join-Path $env:RUNNER_TEMP 'pi-control-e2e-windows-provenance.txt'
          $env:PI_E2E_POSTGRES_DATA = Join-Path $env:RUNNER_TEMP 'symmetry-pi-control-postgres'
          $env:PI_E2E_POSTGRES_LOG = Join-Path $env:RUNNER_TEMP 'symmetry-pi-control-postgres.log'
          $env:PI_E2E_EXECUTABLE = Join-Path $env:RUNNER_TEMP 'pi-0.87.1\pi.exe'
          @(
            "PI_E2E_TEMP=$env:PI_E2E_TEMP"
            "PI_E2E_LOG=$env:PI_E2E_LOG"
            "PI_E2E_PROVENANCE=$env:PI_E2E_PROVENANCE"
            "PI_E2E_POSTGRES_DATA=$env:PI_E2E_POSTGRES_DATA"
            "PI_E2E_POSTGRES_LOG=$env:PI_E2E_POSTGRES_LOG"
            "PI_E2E_EXECUTABLE=$env:PI_E2E_EXECUTABLE"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $env:PI_E2E_TEMP | Out-Null
          Set-Content -LiteralPath $env:PI_E2E_LOG -Value ''
          if ($env:POSTGRES_HOST -cne '127.0.0.1') {
            throw "Windows Pi E2E PostgreSQL host must remain IPv4 loopback: $env:POSTGRES_HOST"
          }
          $portListener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          try {
            $portListener.Server.ExclusiveAddressUse = $true
            $portListener.Start()
            $postgresPort = [int]$portListener.LocalEndpoint.Port
          }
          finally {
            if ($null -ne $portListener) { $portListener.Stop() }
          }
          if ($postgresPort -lt 1024 -or $postgresPort -gt 65535) {
            throw "Selected PostgreSQL loopback port is invalid: $postgresPort"
          }
          $env:POSTGRES_PORT = [string]$postgresPort
          "POSTGRES_PORT=$postgresPort" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $runnerImage = [Environment]::GetEnvironmentVariable('ImageVersion')
          @(
            "source_revision=$env:GITHUB_SHA"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "runner_image=$runnerImage"
            'pi_target=x86_64-pc-windows'
            'pi_version_expected=0.87.1'
            'pi_release_url=https://github.com/earendil-works/pi/releases/download/v0.87.1/pi-windows-x64.zip'
            'pi_archive_sha256_expected=aab2ba67baf8ff97a52d05b62d88e9e65a840c6ea8fa1029a28d62d210d4e5fc'
            "pi_executable_path=$env:PI_E2E_EXECUTABLE"
            'pi_executable_sha256_expected=dd5fdf61bdd10e3fa3fb3d7dbca1ce9f21475d4a7a410f2e0524fd19ae35651f'
            'process_visibility=Elixir Port.open :hide for Windows native children; backup cleanup is verification-only and never invokes numeric process termination'
            'upstream_scope=numeric IPv4 loopback only'
            'provider_credentials=none'
            "postgres_host=$env:POSTGRES_HOST"
            "postgres_port=$postgresPort"
            'postgres_port_selection=IPv4 loopback TcpListener bound to port 0'
            'gate_status=initializing'
          ) | Set-Content -LiteralPath $env:PI_E2E_PROVENANCE
          Add-Content -LiteralPath $env:PI_E2E_LOG -Value "postgres_port=$postgresPort (selected from IPv4 loopback TcpListener port 0)"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.6
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache-dependency-path: daemon/go.sum
      - name: Start isolated PostgreSQL loopback
        id: windows_postgres
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ready = $false

          try {
            function Add-PostgresCandidate(
              [System.Collections.Generic.List[object]] $Candidates,
              [System.Collections.Generic.HashSet[string]] $Seen,
              [string] $Path,
              [string] $Source
            ) {
              if ([string]::IsNullOrWhiteSpace($Path)) { return }

              try {
                $normalized = [System.IO.Path]::GetFullPath($Path.Trim().Trim('"')).TrimEnd('\')
              }
              catch {
                return
              }

              if (-not (Test-Path -LiteralPath $normalized -PathType Container)) { return }
              if ($Seen.Add($normalized)) {
                $Candidates.Add([pscustomobject]@{ Path = $normalized; Source = $Source }) | Out-Null
              }
            }

            $candidates = [System.Collections.Generic.List[object]]::new()
            $seenCandidates = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)

            Add-PostgresCandidate $candidates $seenCandidates $env:PGBIN 'PGBIN'

            foreach ($toolName in @('pg_ctl', 'initdb', 'createdb')) {
              foreach ($command in @(Get-Command "$toolName.exe" -All -ErrorAction SilentlyContinue)) {
                if (-not [string]::IsNullOrWhiteSpace([string]$command.Source)) {
                  Add-PostgresCandidate $candidates $seenCandidates ([System.IO.Path]::GetDirectoryName($command.Source)) "PATH:$toolName"
                }
              }
            }

            foreach ($registryPattern in @(
              'HKLM:\SOFTWARE\PostgreSQL\Installations\*'
              'HKLM:\SOFTWARE\WOW6432Node\PostgreSQL\Installations\*'
              'HKCU:\SOFTWARE\PostgreSQL\Installations\*'
              'HKCU:\SOFTWARE\WOW6432Node\PostgreSQL\Installations\*'
            )) {
              foreach ($registryKey in @(Get-Item -Path $registryPattern -ErrorAction SilentlyContinue)) {
                $properties = Get-ItemProperty -LiteralPath $registryKey.PSPath -ErrorAction SilentlyContinue
                if ($null -ne $properties -and -not [string]::IsNullOrWhiteSpace([string]$properties.'Base Directory')) {
                  Add-PostgresCandidate $candidates $seenCandidates (Join-Path ([string]$properties.'Base Directory') 'bin') "registry:$registryPattern"
                }
              }
            }

            foreach ($programFiles in @(
              [Environment]::GetEnvironmentVariable('ProgramFiles')
              [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
              [Environment]::GetEnvironmentVariable('ProgramW6432')
            )) {
              if ([string]::IsNullOrWhiteSpace($programFiles)) { continue }

              $postgresRoot = Join-Path $programFiles 'PostgreSQL'
              foreach ($versionDirectory in @(Get-ChildItem -LiteralPath $postgresRoot -Directory -ErrorAction SilentlyContinue | Sort-Object -Property Name -Descending)) {
                Add-PostgresCandidate $candidates $seenCandidates (Join-Path $versionDirectory.FullName 'bin') "program-files:$postgresRoot"
              }
            }

            $selected = $null
            $candidateRecords = [System.Collections.Generic.List[string]]::new()
            foreach ($candidate in $candidates) {
              $candidateTools = @{
                pg_ctl = Join-Path $candidate.Path 'pg_ctl.exe'
                initdb = Join-Path $candidate.Path 'initdb.exe'
                createdb = Join-Path $candidate.Path 'createdb.exe'
              }
              $missing = @(
                foreach ($toolName in @('pg_ctl', 'initdb', 'createdb')) {
                  if (-not (Test-Path -LiteralPath $candidateTools[$toolName] -PathType Leaf)) {
                    "$toolName.exe"
                  }
                }
              )
              $candidateRecords.Add("$($candidate.Path);source=$($candidate.Source);missing=$($missing -join ',')") | Out-Null
              if ($null -eq $selected -and $missing.Count -eq 0) {
                $selected = [pscustomobject]@{
                  Bin = $candidate.Path
                  Source = $candidate.Source
                  PgCtl = $candidateTools.pg_ctl
                  InitDb = $candidateTools.initdb
                  CreateDb = $candidateTools.createdb
                }
              }
            }

            $candidateSummary = if ($candidateRecords.Count -gt 0) { $candidateRecords -join ' | ' } else { 'none' }
            Add-Content -LiteralPath $env:PI_E2E_LOG -Value "postgres_candidate_bins=$candidateSummary"
            Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "postgres_candidate_bins=$candidateSummary"

            if ($null -eq $selected) {
              $message = 'Windows runner lacks a complete PostgreSQL toolset (pg_ctl.exe, initdb.exe, createdb.exe) in one discovered bin directory'
              Add-Content -LiteralPath $env:PI_E2E_LOG -Value "postgres_status=unavailable; $message"
              Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "postgres_status=unavailable; $message"
              throw $message
            }
            else {
              $pgCtl = $selected.PgCtl
              $initDb = $selected.InitDb
              $createDb = $selected.CreateDb
              if ($env:POSTGRES_PORT -notmatch '^[0-9]+$') {
                throw "POSTGRES_PORT is not a decimal port: $env:POSTGRES_PORT"
              }
              $postgresPort = [int]$env:POSTGRES_PORT
              if ($postgresPort -lt 1024 -or $postgresPort -gt 65535) {
                throw "POSTGRES_PORT is outside the valid TCP range: $postgresPort"
              }
              $env:PI_E2E_POSTGRES_BIN = $selected.Bin
              $env:PI_E2E_POSTGRES_PGCTL = $selected.PgCtl
              "PI_E2E_POSTGRES_BIN=$($selected.Bin)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "PI_E2E_POSTGRES_PGCTL=$($selected.PgCtl)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Add-Content -LiteralPath $env:PI_E2E_LOG -Value "postgres_bin=$($selected.Bin);source=$($selected.Source)"
              Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "postgres_bin=$($selected.Bin);source=$($selected.Source)"
              Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "postgres_pg_ctl=$($selected.PgCtl)"
              Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "postgres_initdb=$($selected.InitDb)"
              Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "postgres_createdb=$($selected.CreateDb)"

              $versionOutput = & $pgCtl --version 2>&1
              $versionStatus = $LASTEXITCODE
              $version = ($versionOutput -join "`n").Trim()
              if ($versionStatus -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
                throw "pg_ctl.exe --version failed with status $versionStatus"
              }
              Add-Content -LiteralPath $env:PI_E2E_LOG -Value "postgres_version=$version"
              Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "postgres_version=$version"

              $env:PGPASSWORD = $env:POSTGRES_PASSWORD

              $initOutput = & $initDb -D $env:PI_E2E_POSTGRES_DATA -U $env:POSTGRES_USER --auth=trust --no-locale --encoding=UTF8 2>&1
              $initStatus = $LASTEXITCODE
              $initOutput | Tee-Object -FilePath $env:PI_E2E_LOG -Append | Out-Host
              if ($initStatus -ne 0) {
                throw "initdb.exe failed with status $initStatus"
              }

              # The postmaster inherits pg_ctl's stdout/stderr. Capturing them
              # with & ... 2>&1 keeps the pipe open and never returns, so wait
              # on pg_ctl alone and read its redirected output afterwards.
              $startOut = Join-Path $env:RUNNER_TEMP 'pg_ctl-start.out'
              $startErr = Join-Path $env:RUNNER_TEMP 'pg_ctl-start.err'
              $startProcess = Start-Process -FilePath $pgCtl -NoNewWindow -PassThru `
                -ArgumentList @('-D', "`"$env:PI_E2E_POSTGRES_DATA`"", '-o', "`"-h $env:POSTGRES_HOST -p $env:POSTGRES_PORT`"", '-l', "`"$env:PI_E2E_POSTGRES_LOG`"", '-w', '-t', '30', 'start') `
                -RedirectStandardOutput $startOut -RedirectStandardError $startErr
              if (-not $startProcess.WaitForExit(60000)) {
                throw 'pg_ctl.exe start did not exit within 60 seconds'
              }
              $startStatus = $startProcess.ExitCode
              Get-Content -LiteralPath $startOut, $startErr -ErrorAction SilentlyContinue | Tee-Object -FilePath $env:PI_E2E_LOG -Append | Out-Host
              if ($startStatus -ne 0) {
                throw "pg_ctl.exe start failed with status $startStatus"
              }

              $createOutput = & $createDb -h $env:POSTGRES_HOST -p $env:POSTGRES_PORT -U $env:POSTGRES_USER $env:POSTGRES_DB 2>&1
              $createStatus = $LASTEXITCODE
              $createOutput | Tee-Object -FilePath $env:PI_E2E_LOG -Append | Out-Host
              if ($createStatus -ne 0) {
                throw "createdb.exe failed with status $createStatus"
              }

              Add-Content -LiteralPath $env:PI_E2E_LOG -Value "postgres_status=ready on $env:POSTGRES_HOST`:$env:POSTGRES_PORT"
              Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "postgres_status=ready on $env:POSTGRES_HOST`:$env:POSTGRES_PORT"
              $ready = $true
            }
          }
          catch {
            $message = "Windows PostgreSQL preflight failed: $($_.Exception.Message)"
            Add-Content -LiteralPath $env:PI_E2E_LOG -Value $message
            Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "postgres_status=unavailable; $message"
            Write-Output "::error::$message; Pi Control E2E acceptance gate failed"
            throw
          }

          "ready=$($ready.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - run: mix deps.get
      - name: Prepare pinned Windows Pi release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseUrl = 'https://github.com/earendil-works/pi/releases/download/v0.87.1/pi-windows-x64.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'pi-windows-x64.zip'
          $releaseDir = Split-Path -Parent $env:PI_E2E_EXECUTABLE
          $archiveSha256 = 'aab2ba67baf8ff97a52d05b62d88e9e65a840c6ea8fa1029a28d62d210d4e5fc'
          $executableSha256 = 'dd5fdf61bdd10e3fa3fb3d7dbca1ce9f21475d4a7a410f2e0524fd19ae35651f'

          Add-Content -LiteralPath $env:PI_E2E_LOG -Value "download_url=$releaseUrl"
          Invoke-WebRequest -UseBasicParsing -TimeoutSec 120 -Headers @{ 'User-Agent' = 'symmetry-ci' } -Uri $releaseUrl -OutFile $archive

          $actualArchiveSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "pi_archive_sha256_actual=$actualArchiveSha256"
          if ($actualArchiveSha256 -ne $archiveSha256) {
            throw "Pi archive SHA-256 did not equal $archiveSha256; got $actualArchiveSha256"
          }

          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $releaseDir -Force
          if (-not (Test-Path -LiteralPath $env:PI_E2E_EXECUTABLE -PathType Leaf)) {
            throw "Pi executable was not found at $env:PI_E2E_EXECUTABLE"
          }

          $actualExecutableSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:PI_E2E_EXECUTABLE).Hash.ToLowerInvariant()
          if ($actualExecutableSha256 -ne $executableSha256) {
            throw "Pi executable SHA-256 did not equal $executableSha256; got $actualExecutableSha256"
          }

          $versionOutput = & $env:PI_E2E_EXECUTABLE --version 2>&1
          $versionStatus = $LASTEXITCODE
          $actualPiVersion = ($versionOutput -join "`n").Trim()
          if ($versionStatus -ne 0 -or $actualPiVersion -ne '0.87.1') {
            throw "Pi --version did not equal 0.87.1; status=$versionStatus output=$actualPiVersion"
          }

          Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "pi_executable_sha256_actual=$actualExecutableSha256"
          Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "pi_version_actual=$actualPiVersion"
          Add-Content -LiteralPath $env:PI_E2E_LOG -Value "verified Pi $actualPiVersion ($actualExecutableSha256) at $env:PI_E2E_EXECUTABLE"
      - name: Run Windows Pi provider bridge smoke
        working-directory: daemon
        shell: pwsh
        env:
          SYMMETRY_PI_PROVIDER_ACTION_SMOKE: "1"
          SYMMETRY_PI_NATIVE_SMOKE_EXECUTABLE: ${{ runner.temp }}\pi-0.87.1\pi.exe
        run: |
          $ErrorActionPreference = 'Stop'
          $testOutput = & go test -json -count=1 -timeout 90s ./internal/harness/pi -run '^TestNativePiProviderBridgeAction$' 2>&1
          $testStatus = $LASTEXITCODE
          $testOutput | Tee-Object -FilePath $env:PI_E2E_LOG -Append | Out-Host
          Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "provider_bridge_smoke_exit_status=$testStatus"

          $runs = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $passes = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $failures = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          foreach ($line in $testOutput) {
            $text = [string]$line
            if ([string]::IsNullOrWhiteSpace($text)) { continue }
            try {
              $event = $text | ConvertFrom-Json -ErrorAction Stop
            }
            catch {
              Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value 'provider_bridge_smoke_status=failed: invalid go test JSON'
              throw "Pi provider bridge emitted invalid go test JSON"
            }
            if ($event.Test -ceq 'TestNativePiProviderBridgeAction') {
              if ($event.Action -ceq 'run') { [void]$runs.Add($event.Test) }
              elseif ($event.Action -ceq 'pass') { [void]$passes.Add($event.Test) }
              elseif ($event.Action -ceq 'fail') { [void]$failures.Add($event.Test) }
            }
          }
          if ($testStatus -ne 0) {
            Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "provider_bridge_smoke_status=failed: go test exited with status $testStatus"
            exit $testStatus
          }
          if (-not $runs.Contains('TestNativePiProviderBridgeAction') -or -not $passes.Contains('TestNativePiProviderBridgeAction') -or $failures.Count -ne 0) {
            Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value 'provider_bridge_smoke_status=failed: selective witness missing run/pass or reported fail'
            throw "Pi provider bridge selective gate failed: run=$($runs -join ',') pass=$($passes -join ',') fail=$($failures -join ',')"
          }
          Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value 'provider_bridge_smoke_status=passed'
      - name: Run control format and compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $formatOutput = & mix format --check-formatted 2>&1
          $formatStatus = $LASTEXITCODE
          $formatOutput | Tee-Object -FilePath $env:PI_E2E_LOG -Append | Out-Host
          if ($formatStatus -ne 0) { exit $formatStatus }

          $compileOutput = & mix compile --warnings-as-errors 2>&1
          $compileStatus = $LASTEXITCODE
          $compileOutput | Tee-Object -FilePath $env:PI_E2E_LOG -Append | Out-Host
          if ($compileStatus -ne 0) { exit $compileStatus }
      - name: Run Windows Pi Control E2E
        id: windows_pi_e2e
        if: steps.windows_postgres.outputs.ready == 'true'
        shell: pwsh
        env:
          SYMMETRY_PI_CONTROL_E2E: "1"
          SYMMETRY_PI_CONTROL_E2E_EXECUTABLE: ${{ runner.temp }}\pi-0.87.1\pi.exe
          TEMP: ${{ runner.temp }}\symmetry-pi-control-tmp
          TMP: ${{ runner.temp }}\symmetry-pi-control-tmp
          TMPDIR: ${{ runner.temp }}\symmetry-pi-control-tmp
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          $testOutput = & mix test test/symmetry_control/pi_control_e2e_test.exs --include skip:true --only pi_control_e2e 2>&1
          $testStatus = $LASTEXITCODE
          $testOutput | Tee-Object -FilePath $env:PI_E2E_LOG -Append | Out-Host
          Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "e2e_exit_status=$testStatus"
          $resultSummaries = @(
            foreach ($line in $testOutput) {
              $text = ([string]$line) -replace "`e\[[0-9;]*[A-Za-z]", ''
              if ($text -match '^\s*Result:\s*(\d+)(?:/(\d+))?\s+passed\b(.*)$') {
                $passedCount = [int]$Matches[1]
                $totalCount = if ([string]::IsNullOrEmpty($Matches[2])) { $passedCount } else { [int]$Matches[2] }
                $resultTail = $Matches[3]
                $failureCount = $totalCount - $passedCount
                if ($resultTail -match '(\d+)\s+failed\b') {
                  $failureCount = [int]$Matches[1]
                  $totalCount = $passedCount + $failureCount
                }
                [pscustomobject]@{
                  Passed = $passedCount
                  Tests = $totalCount
                  Failures = $failureCount
                }
              }
              elseif ($text -match '^\s*(\d+)\s+tests?,\s*(\d+)\s+failures?\b') {
                [pscustomobject]@{
                  Passed = [int]$Matches[1] - [int]$Matches[2]
                  Tests = [int]$Matches[1]
                  Failures = [int]$Matches[2]
                }
              }
            }
          )
          $reportedFailures = @(
            foreach ($line in $testOutput) {
              $text = ([string]$line) -replace "`e\[[0-9;]*[A-Za-z]", ''
              if ($text -match '^\s*Failed:\s*(\d+)\s+tests?\b') {
                [int]$Matches[1]
              }
            }
          )
          if ($resultSummaries.Count -eq 0) {
            Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value 'gate_status=failed: ExUnit summary was not found'
            if ($testStatus -ne 0) { exit $testStatus }
            exit 1
          }
          $summary = $resultSummaries[-1]
          if ($reportedFailures.Count -gt 0) {
            $failureCount = $reportedFailures[-1]
            $summary = [pscustomobject]@{
              Passed = $summary.Passed
              Tests = [Math]::Max($summary.Tests, $summary.Passed + $failureCount)
              Failures = $failureCount
            }
          }
          Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "test_summary=tests=$($summary.Tests);failures=$($summary.Failures)"
          if ($summary.Tests -le 0 -or $summary.Failures -ne 0) {
            Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "gate_status=failed: invalid ExUnit summary tests=$($summary.Tests) failures=$($summary.Failures)"
            if ($testStatus -ne 0) { exit $testStatus }
            exit 1
          }
          if ($testStatus -ne 0) { exit $testStatus }
          Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value 'gate_status=passed'
      - name: Record Windows Pi E2E prerequisite failure diagnostics
        if: always() && steps.windows_postgres.outcome == 'failure'
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value 'gate_status=failed: PostgreSQL loopback prerequisite unavailable'
          Add-Content -LiteralPath $env:PI_E2E_LOG -Value 'gate_status=failed: PostgreSQL loopback prerequisite unavailable'
      - name: Verify Windows Pi Control cleanup evidence
        if: always()
        shell: pwsh
        env:
          PI_E2E_OUTCOME: ${{ steps.windows_pi_e2e.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cleanupFailed = $false

          function Write-CleanupLog([string] $Message) {
            Add-Content -LiteralPath $env:PI_E2E_LOG -Value $Message
            Write-Output $Message
          }

          $e2eOutcome = [string]$env:PI_E2E_OUTCOME
          Write-CleanupLog "cleanup verification e2e_outcome=$e2eOutcome"
          if ($e2eOutcome -ne 'success') {
            if ([string]::IsNullOrWhiteSpace($e2eOutcome)) {
              Write-CleanupLog 'cleanup verification failed: Windows Pi E2E outcome was unavailable'
            }
            else {
              Write-CleanupLog "cleanup verification failed: Windows Pi E2E outcome was $e2eOutcome"
            }
            $cleanupFailed = $true
          }

          $markerPattern = Join-Path $env:PI_E2E_TEMP 'symmetry-pi-control-run-*\process-marker.json'
          $markers = $null
          try {
            $markers = @(Get-ChildItem -Path $markerPattern -File -ErrorAction Stop)
          }
          catch {
            Write-CleanupLog "cleanup verification could not enumerate markers: $($_.Exception.Message)"
            $cleanupFailed = $true
          }

          if ($null -ne $markers) {
            foreach ($marker in $markers) {
              $markerState = 'unreadable'
              $markerLength = 'unknown'
              try {
                $contents = (Get-Content -LiteralPath $marker.FullName -Raw -ErrorAction Stop).Trim()
                $markerLength = $contents.Length
              }
              catch {
                Write-CleanupLog "cleanup verification residual marker path=$($marker.FullName) chars=$markerLength state=$markerState"
                $cleanupFailed = $true
                continue
              }

              if ($contents -eq 'not_started') {
                $markerState = 'not_started'
              }
              elseif ($contents -eq 'starting') {
                $markerState = 'starting'
              }
              else {
                try {
                  $record = $contents | ConvertFrom-Json -ErrorAction Stop
                  $pidProperty = $record.PSObject.Properties['pid']
                  $identityProperty = $record.PSObject.Properties['process_identity']
                  $pidValue = if ($null -eq $pidProperty) { $null } else { $pidProperty.Value }
                  $identityValue = if ($null -eq $identityProperty) { $null } else { $identityProperty.Value }
                  if (($pidValue -is [int] -or $pidValue -is [long]) -and
                    [int64]$pidValue -gt 0 -and [int64]$pidValue -le [int]::MaxValue -and
                    $identityValue -is [string] -and
                    ([string]$identityValue -match ("^windows:{0}:[0-9a-fA-F]{{16}}$" -f [int64]$pidValue))) {
                    $markerState = 'json_valid'
                    $validatedPid = [int64]$pidValue
                    $validatedIdentity = [string]$identityValue
                  }
                  else {
                    $markerState = 'json_invalid'
                  }
                }
                catch {
                  $markerState = 'json_invalid'
                }
              }
              Write-CleanupLog "cleanup verification residual marker path=$($marker.FullName) chars=$markerLength state=$markerState"
              if ($markerState -eq 'json_valid') {
                Write-CleanupLog "cleanup verification residual marker validated pid=$validatedPid process_identity=$validatedIdentity"
              }
              $cleanupFailed = $true
            }

            if ($e2eOutcome -eq 'success' -and $markers.Count -eq 0) {
              Write-CleanupLog 'cleanup verification accepted: successful Windows Pi E2E suite-level test/on_exit containment cleanup and applicable stop-receipt assertions removed every run root; no process markers remain'
            }
            elseif ($markers.Count -gt 0) {
              Write-CleanupLog "cleanup verification failed: $($markers.Count) residual process marker(s) remain"
            }
          }

          $markerCount = if ($null -eq $markers) { 'unknown' } else { [string]$markers.Count }
          Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value 'orphan_cleanup_verification_mode=successful_e2e_outcome_and_zero_markers;numeric_termination=disabled'
          Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "orphan_cleanup_e2e_outcome=$e2eOutcome"
          Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "orphan_cleanup_marker_count=$markerCount"
          Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "orphan_cleanup_status=$(if ($cleanupFailed) { 'failed' } else { 'passed' })"
          if ($cleanupFailed) { exit 1 }
      - name: Stop isolated PostgreSQL
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:POSTGRES_PORT -notmatch '^[0-9]+$') {
            $message = "postgres_stop_status=failed: POSTGRES_PORT is not a decimal port: $env:POSTGRES_PORT"
            Add-Content -LiteralPath $env:PI_E2E_LOG -Value $message
            Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value $message
            exit 1
          }
          $postgresPort = [int]$env:POSTGRES_PORT
          if ($postgresPort -lt 1024 -or $postgresPort -gt 65535) {
            $message = "postgres_stop_status=failed: POSTGRES_PORT is outside the valid TCP range: $postgresPort"
            Add-Content -LiteralPath $env:PI_E2E_LOG -Value $message
            Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value $message
            exit 1
          }
          Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "postgres_stop_port=$env:POSTGRES_PORT"
          $pgCtlPath = $env:PI_E2E_POSTGRES_PGCTL
          if ([string]::IsNullOrWhiteSpace($pgCtlPath) -and -not [string]::IsNullOrWhiteSpace($env:PI_E2E_POSTGRES_BIN)) {
            $candidate = Join-Path $env:PI_E2E_POSTGRES_BIN 'pg_ctl.exe'
            if (Test-Path -LiteralPath $candidate -PathType Leaf) { $pgCtlPath = $candidate }
          }
          $pidFile = Join-Path $env:PI_E2E_POSTGRES_DATA 'postmaster.pid'
          if (Test-Path -LiteralPath $pidFile) {
            if ([string]::IsNullOrWhiteSpace($pgCtlPath) -or -not (Test-Path -LiteralPath $pgCtlPath -PathType Leaf)) {
              $message = 'postgres_stop_status=failed: postmaster.pid exists but the selected pg_ctl.exe path is unavailable'
              Add-Content -LiteralPath $env:PI_E2E_LOG -Value $message
              Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value $message
              exit 1
            }
            $stopOutput = & $pgCtlPath -D $env:PI_E2E_POSTGRES_DATA -m fast -w -t 10 stop 2>&1
            $stopStatus = $LASTEXITCODE
            $stopOutput | Tee-Object -FilePath $env:PI_E2E_LOG -Append | Out-Host
            Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "postgres_stop_status=$stopStatus"
            if ($stopStatus -ne 0) { exit $stopStatus }
          }
          else {
            Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value 'postgres_stop_status=not_running'
          }
      - name: Upload Windows Pi E2E log, provenance, and markers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-control-e2e-windows-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/pi-control-e2e-windows.log
            ${{ runner.temp }}/pi-control-e2e-windows-provenance.txt
            ${{ runner.temp }}/symmetry-pi-control-postgres.log
            ${{ runner.temp }}/symmetry-pi-control-tmp/symmetry-pi-control-run-*/process-marker*.json

  daemon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache-dependency-path: daemon/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=3 -timeout 300s ./...
      - run: go test -race -count=1 -timeout 600s ./...
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./...

  opencode-native-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache-dependency-path: daemon/go.sum
      - name: Prepare pinned OpenCode release
        shell: bash
        run: |
          set -Eeuo pipefail
          release_url='https://github.com/anomalyco/opencode/releases/download/v1.18.32/opencode-linux-x64-baseline.tar.gz'
          archive="$RUNNER_TEMP/opencode-linux-x64-baseline.tar.gz"
          release_dir="$RUNNER_TEMP/opencode-1.18.32"
          executable="$release_dir/opencode"
          provenance="$RUNNER_TEMP/opencode-native-synthetic-provenance.txt"
          archive_sha256='763af386ef88a8cab18df00fcf055690e5a55e31a7088beabe02307142a6adce'

          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          {
            printf 'source_revision=%s\n' "$GITHUB_SHA"
            printf 'release_url=%s\n' "$release_url"
            printf 'version_expected=1.18.32\n'
            printf 'archive_sha256_expected=%s\n' "$archive_sha256"
            printf 'provider_credentials=none\n'
            printf 'upstream_scope=synthetic numeric loopback only\n'
          } > "$provenance"

          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-max-time 120 --retry-all-errors \
            "$release_url" --output "$archive"
          printf '%s  %s\n' "$archive_sha256" "$archive" | sha256sum --check --strict
          tar --extract --file "$archive" --directory "$release_dir"
          test -x "$executable"
          actual_version=$(timeout 30s "$executable" --version)
          test "$actual_version" = '1.18.32'
          {
            printf 'archive_sha256_actual=%s\n' "$(sha256sum "$archive" | awk '{print $1}')"
            printf 'version_actual=%s\n' "$actual_version"
            printf 'executable=%s\n' "$executable"
          } >> "$provenance"
      - name: Run bounded synthetic native tool integration
        working-directory: daemon
        env:
          SYMMETRY_OPENCODE_NATIVE_SYNTHETIC_TOOL: "1"
          SYMMETRY_OPENCODE_NATIVE_SYNTHETIC_TOOL_EXECUTABLE: ${{ runner.temp }}/opencode-1.18.32/opencode
        run: |
          set -Eeuo pipefail
          test_events="$RUNNER_TEMP/opencode-native-synthetic-test.json"
          set +e
          go test -count=1 -timeout 180s -json ./internal/harness/opencode \
            -run '^TestNativeSyntheticGatewayToolIntegration$' > "$test_events" 2>&1
          test_status=$?
          set -e
          cat "$test_events"

          summary_status=0
          python3 - "$test_events" TestNativeSyntheticGatewayToolIntegration <<'PY' || summary_status=$?
          import json
          import sys

          expected = set(sys.argv[2:])
          run = set()
          passed = set()
          failures = []
          for line in open(sys.argv[1], encoding="utf-8", errors="replace"):
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              action = event.get("Action")
              test = event.get("Test")
              if action == "run" and test in expected:
                  run.add(test)
              elif action == "pass" and test in expected:
                  passed.add(test)
              elif action == "fail":
                  failures.append(test or event.get("Package") or "<package>")
          missing_run = expected - run
          missing_pass = expected - passed
          if missing_run or missing_pass or failures:
              raise SystemExit(
                  "Go selective gate failed: "
                  f"missing run={sorted(missing_run)}, missing pass={sorted(missing_pass)}, "
                  f"fail events={failures}"
              )
          print(f"verified Go events: run={sorted(run)}, pass={sorted(passed)}")
          PY

          printf 'e2e_exit_status=%s\n' "$test_status" >> "$RUNNER_TEMP/opencode-native-synthetic-provenance.txt"
          if (( test_status != 0 )); then
            printf 'gate_status=failed: go test exited with status %s\n' "$test_status" >> "$RUNNER_TEMP/opencode-native-synthetic-provenance.txt"
            exit "$test_status"
          fi
          if (( summary_status != 0 )); then
            printf 'gate_status=failed: selective witness validation exited with status %s\n' "$summary_status" >> "$RUNNER_TEMP/opencode-native-synthetic-provenance.txt"
            exit "$summary_status"
          fi
          printf 'gate_status=passed\n' >> "$RUNNER_TEMP/opencode-native-synthetic-provenance.txt"
      - name: Upload OpenCode synthetic provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-native-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/opencode-native-synthetic-provenance.txt

  opencode-native-synthetic-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize OpenCode synthetic evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OPENCODE_SYNTHETIC_LOG = Join-Path $env:RUNNER_TEMP 'opencode-native-synthetic-windows.log'
          $env:OPENCODE_SYNTHETIC_PROVENANCE = Join-Path $env:RUNNER_TEMP 'opencode-native-synthetic-windows-provenance.txt'
          $env:OPENCODE_SYNTHETIC_EXECUTABLE = Join-Path $env:RUNNER_TEMP 'opencode-1.18.32\opencode.exe'
          @(
            "OPENCODE_SYNTHETIC_LOG=$env:OPENCODE_SYNTHETIC_LOG"
            "OPENCODE_SYNTHETIC_PROVENANCE=$env:OPENCODE_SYNTHETIC_PROVENANCE"
            "OPENCODE_SYNTHETIC_EXECUTABLE=$env:OPENCODE_SYNTHETIC_EXECUTABLE"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Set-Content -LiteralPath $env:OPENCODE_SYNTHETIC_LOG -Value ''
          $runnerImage = [Environment]::GetEnvironmentVariable('ImageVersion')
          @(
            "source_revision=$env:GITHUB_SHA"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "runner_image=$runnerImage"
            'release_url=https://github.com/anomalyco/opencode/releases/download/v1.18.32/opencode-windows-x64-baseline.zip'
            'version_expected=1.18.32'
            'archive_sha256_expected=cd852831bd094c2df2eb379eb98bed7a63db7f823a7caf277c732cdac33cbdb6'
            'executable_sha256_expected=da86eed515d91a7b2d7da9a8230a2bd095f68a89f0cf44eb6a9217bead81fffc'
            'provider_credentials=none'
            'upstream_scope=synthetic numeric loopback only'
            'witness_scope=test-only'
            'gate_status=initializing'
          ) | Set-Content -LiteralPath $env:OPENCODE_SYNTHETIC_PROVENANCE
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache-dependency-path: daemon/go.sum
      - name: Prepare pinned OpenCode release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseUrl = 'https://github.com/anomalyco/opencode/releases/download/v1.18.32/opencode-windows-x64-baseline.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'opencode-windows-x64-baseline.zip'
          $releaseDir = Join-Path $env:RUNNER_TEMP 'opencode-1.18.32'
          $archiveSha256 = 'cd852831bd094c2df2eb379eb98bed7a63db7f823a7caf277c732cdac33cbdb6'
          $executableSha256 = 'da86eed515d91a7b2d7da9a8230a2bd095f68a89f0cf44eb6a9217bead81fffc'

          Add-Content -LiteralPath $env:OPENCODE_SYNTHETIC_LOG -Value "download_url=$releaseUrl"
          Invoke-WebRequest -UseBasicParsing -TimeoutSec 120 -Headers @{ 'User-Agent' = 'symmetry-ci' } -Uri $releaseUrl -OutFile $archive

          $actualArchiveSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:OPENCODE_SYNTHETIC_LOG -Value "archive_sha256_actual=$actualArchiveSha256"
          Add-Content -LiteralPath $env:OPENCODE_SYNTHETIC_PROVENANCE -Value "archive_sha256_actual=$actualArchiveSha256"
          if ($actualArchiveSha256 -ne $archiveSha256) {
            throw "OpenCode archive SHA-256 did not equal $archiveSha256; got $actualArchiveSha256"
          }

          Remove-Item -LiteralPath $releaseDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $releaseDir -Force
          if (-not (Test-Path -LiteralPath $env:OPENCODE_SYNTHETIC_EXECUTABLE -PathType Leaf)) {
            throw "OpenCode executable was not found at $env:OPENCODE_SYNTHETIC_EXECUTABLE"
          }

          $actualExecutableSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:OPENCODE_SYNTHETIC_EXECUTABLE).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:OPENCODE_SYNTHETIC_LOG -Value "executable_sha256_actual=$actualExecutableSha256"
          Add-Content -LiteralPath $env:OPENCODE_SYNTHETIC_PROVENANCE -Value "executable_sha256_actual=$actualExecutableSha256"
          if ($actualExecutableSha256 -ne $executableSha256) {
            throw "OpenCode executable SHA-256 did not equal $executableSha256; got $actualExecutableSha256"
          }

          $versionOutput = & $env:OPENCODE_SYNTHETIC_EXECUTABLE --version 2>&1
          $versionStatus = $LASTEXITCODE
          $actualVersion = ($versionOutput -join "`n").Trim()
          $versionOutput | Tee-Object -FilePath $env:OPENCODE_SYNTHETIC_LOG -Append | Out-Host
          if ($versionStatus -ne 0 -or $actualVersion -ne '1.18.32') {
            throw "OpenCode --version did not equal 1.18.32; status=$versionStatus output=$actualVersion"
          }

          $helpOutput = & $env:OPENCODE_SYNTHETIC_EXECUTABLE serve --help 2>&1
          $helpStatus = $LASTEXITCODE
          $helpText = ($helpOutput -join "`n")
          $helpOutput | Tee-Object -FilePath $env:OPENCODE_SYNTHETIC_LOG -Append | Out-Host
          if ($helpStatus -ne 0) {
            throw "OpenCode serve --help failed with status $helpStatus"
          }
          foreach ($requiredOption in @('--hostname', '--port', '--pure')) {
            if ($helpText -notmatch [regex]::Escape($requiredOption)) {
              throw "OpenCode serve --help did not advertise $requiredOption"
            }
          }

          Add-Content -LiteralPath $env:OPENCODE_SYNTHETIC_LOG -Value "version_actual=$actualVersion"
          Add-Content -LiteralPath $env:OPENCODE_SYNTHETIC_LOG -Value 'serve_help_required_options=--hostname,--port,--pure'
          Add-Content -LiteralPath $env:OPENCODE_SYNTHETIC_PROVENANCE -Value "version_actual=$actualVersion"
          Add-Content -LiteralPath $env:OPENCODE_SYNTHETIC_PROVENANCE -Value 'serve_help_required_options=--hostname,--port,--pure'
      - name: Run bounded synthetic native tool integration
        working-directory: daemon
        shell: pwsh
        env:
          SYMMETRY_OPENCODE_NATIVE_SYNTHETIC_TOOL: '1'
          SYMMETRY_OPENCODE_NATIVE_SYNTHETIC_TOOL_EXECUTABLE: ${{ runner.temp }}\opencode-1.18.32\opencode.exe
        run: |
          $ErrorActionPreference = 'Stop'
          $testOutput = & go test -count=1 -timeout 180s -json ./internal/harness/opencode -run '^TestNativeSyntheticGatewayToolIntegration$' 2>&1
          $testStatus = $LASTEXITCODE
          $testOutput | Tee-Object -FilePath $env:OPENCODE_SYNTHETIC_LOG -Append | Out-Host
          Add-Content -LiteralPath $env:OPENCODE_SYNTHETIC_PROVENANCE -Value "e2e_exit_status=$testStatus"
          $expected = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $expected.Add('TestNativeSyntheticGatewayToolIntegration') | Out-Null
          $run = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $passed = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $failed = [System.Collections.Generic.List[string]]::new()
          foreach ($line in $testOutput) {
            try {
              $event = ([string]$line | ConvertFrom-Json -ErrorAction Stop)
            }
            catch {
              continue
            }
            $testName = [string]$event.Test
            switch ([string]$event.Action) {
              'run' { if ($expected.Contains($testName)) { $run.Add($testName) | Out-Null } }
              'pass' { if ($expected.Contains($testName)) { $passed.Add($testName) | Out-Null } }
              'fail' { $failed.Add($(if ([string]::IsNullOrEmpty($testName)) { [string]$event.Package } else { $testName })) | Out-Null }
            }
          }
          $missingRun = @($expected | Where-Object { -not $run.Contains($_) })
          $missingPass = @($expected | Where-Object { -not $passed.Contains($_) })
          Add-Content -LiteralPath $env:OPENCODE_SYNTHETIC_PROVENANCE -Value "test_events=run:$($run.Count);pass:$($passed.Count);fail:$($failed.Count)"
          if ($missingRun.Count -gt 0 -or $missingPass.Count -gt 0 -or $failed.Count -gt 0) {
            Add-Content -LiteralPath $env:OPENCODE_SYNTHETIC_PROVENANCE -Value "gate_status=failed: missing_run=$($missingRun -join ',');missing_pass=$($missingPass -join ',');fail_events=$($failed -join ',')"
            if ($testStatus -ne 0) { exit $testStatus }
            exit 1
          }
          if ($testStatus -ne 0) { exit $testStatus }
          Add-Content -LiteralPath $env:OPENCODE_SYNTHETIC_PROVENANCE -Value 'gate_status=passed'
      - name: Upload OpenCode synthetic Windows log and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-native-synthetic-windows-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/opencode-native-synthetic-windows.log
            ${{ runner.temp }}/opencode-native-synthetic-windows-provenance.txt

  legacy-route-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/audit-no-legacy-routes.sh

  daemon-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache-dependency-path: daemon/go.sum
      - run: go test -count=1 -timeout 180s ./...
      - run: go build ./cmd/symmetry-daemon ./cmd/symmetry-fake-agent
      - name: Run production Windows containment witness
        env:
          SYMMETRY_PRODUCTION_CONTAINMENT_WITNESS: "1"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testOutput = & go test -count=1 -timeout 180s -json ./internal/platform -run '^TestProductionContainmentSupervisorReplaysReceiptAfterLostRecoverResponse$' 2>&1
          $testStatus = $LASTEXITCODE
          $testOutput | Out-Host
          $expected = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $expected.Add('TestProductionContainmentSupervisorReplaysReceiptAfterLostRecoverResponse') | Out-Null
          $run = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $passed = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $failed = [System.Collections.Generic.List[string]]::new()
          foreach ($line in $testOutput) {
            try {
              $event = ([string]$line | ConvertFrom-Json -ErrorAction Stop)
            }
            catch {
              continue
            }
            $testName = [string]$event.Test
            switch ([string]$event.Action) {
              'run' { if ($expected.Contains($testName)) { $run.Add($testName) | Out-Null } }
              'pass' { if ($expected.Contains($testName)) { $passed.Add($testName) | Out-Null } }
              'fail' { $failed.Add($(if ([string]::IsNullOrEmpty($testName)) { [string]$event.Package } else { $testName })) | Out-Null }
            }
          }
          $missingRun = @($expected | Where-Object { -not $run.Contains($_) })
          $missingPass = @($expected | Where-Object { -not $passed.Contains($_) })
          if ($missingRun.Count -gt 0 -or $missingPass.Count -gt 0 -or $failed.Count -gt 0) {
            Write-Error "Go selective gate failed: missing_run=$($missingRun -join ',');missing_pass=$($missingPass -join ',');fail_events=$($failed -join ',')"
            if ($testStatus -ne 0) { exit $testStatus }
            exit 1
          }
          if ($testStatus -ne 0) { exit $testStatus }
      - name: Run production pre-authority crash witness matrix
        env:
          SYMMETRY_PRODUCTION_PREAUTHORITY_WITNESS: "1"
        run: go test -count=1 -timeout 600s ./e2e -run '^TestProductionPreAuthority(CrashWitnessMatrix|WrongSecretFirstClientRace)$' -v

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: symmetry_control_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d symmetry_control_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/symmetry_control_e2e
      SECRET_KEY_BASE: ci-only-secret-key-base-0123456789012345678901234567890123456789
      PHX_HOST: localhost
      PHX_SERVER: "true"
      PORT: "4000"
      SYMMETRY_ENROLLMENT_TOKEN: development-enrollment-token
      SYMMETRY_OPERATOR_TOKEN: development-operator-token
      SYMMETRY_HEARTBEAT_INTERVAL_MS: "1000"
      SYMMETRY_POLL_INTERVAL_MS: "1000"
      SYMMETRY_LEASE_DURATION_MS: "30000"
      SYMMETRY_ASSIGNMENT_DURATION_MS: "5000"
      SYMMETRY_REAPER_INTERVAL_MS: "500"
      SYMMETRY_CONTRACTS_DIR: ${{ github.workspace }}/contracts
      SYMMETRY_GOALS_ROLLOUT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.6
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache-dependency-path: daemon/go.sum
      - name: Build control release
        working-directory: control
        run: |
          MIX_ENV=prod mix deps.get
          MIX_ENV=prod mix release --overwrite
          _build/prod/rel/symmetry_control/bin/symmetry_control eval 'SymmetryControl.Release.migrate()'
          _build/prod/rel/symmetry_control/bin/symmetry_control start > /tmp/symmetry-control.log 2>&1 &
          echo "$!" > /tmp/symmetry-control.pid
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:4000/healthz
      - name: Verify Goal rollout and Oban worker execution
        working-directory: control
        shell: bash
        run: |
          set -Eeuo pipefail

          control_bin=_build/prod/rel/symmetry_control/bin/symmetry_control
          smoke_expr='
          if Application.get_env(:symmetry_control, :goals, [])[:rollout_enabled] != true do
            raise "Goal rollout is disabled"
          end

          unless is_pid(Oban.whereis(Oban)) do
            raise "Oban supervisor is not running"
          end

          job = SymmetryControl.Goals.Workers.WakeupWorker.new(%{}) |> Oban.insert!()

          result =
            Enum.reduce_while(1..60, nil, fn _, _ ->
              case SymmetryControl.Repo.get!(Oban.Job, job.id).state do
                "completed" ->
                  {:halt, :completed}

                state when state in ["cancelled", "discarded"] ->
                  raise "Goal Oban smoke job ended in #{state}"

                _ ->
                  Process.sleep(1000)
                  {:cont, nil}
              end
            end)

          unless result == :completed do
            raise "Goal Oban smoke job did not complete"
          end

          IO.puts("goal_oban_smoke=completed")
          '
          "$control_bin" rpc "$smoke_expr"
      - name: Run live daemon scenarios
        working-directory: daemon
        env:
          SYMMETRY_E2E: "1"
          SYMMETRY_E2E_URL: http://127.0.0.1:4000
          SYMMETRY_E2E_AGENT: /tmp/symmetry-fake-agent
        run: |
          set -Eeuo pipefail
          go build -o /tmp/symmetry-fake-agent ./cmd/symmetry-fake-agent
          test_events="$RUNNER_TEMP/integration-selective-tests.json"
          set +e
          go test -count=1 -timeout 180s -json ./e2e -run '^(TestCoreDaemonWorkflows|TestPollingFallbackDispatchesWithoutNotifications|TestStaleRuntimeEpochCannotOverwriteNewGeneration|TestDaemonReregistersAfterRestart|TestDaemonReconnectReclaimsExpiredRunWithNewGeneration|TestTaskInputDistinguishesOmissionFromEmptyObject|TestGitWorktreeCleanupRemovesOwnedArtifacts|TestTerminalTransitionRetriesAfterLeaseExpiry)$' > "$test_events" 2>&1
          test_status=$?
          set -e
          cat "$test_events"

          summary_status=0
          python3 - "$test_events" \
            TestCoreDaemonWorkflows \
            TestPollingFallbackDispatchesWithoutNotifications \
            TestStaleRuntimeEpochCannotOverwriteNewGeneration \
            TestDaemonReregistersAfterRestart \
            TestDaemonReconnectReclaimsExpiredRunWithNewGeneration \
            TestTaskInputDistinguishesOmissionFromEmptyObject \
            TestGitWorktreeCleanupRemovesOwnedArtifacts \
            TestTerminalTransitionRetriesAfterLeaseExpiry <<'PY' || summary_status=$?
          import json
          import sys

          expected = set(sys.argv[2:])
          if len(expected) != 8:
              raise SystemExit(f"expected exactly 8 selective tests, got {len(expected)}")
          run = set()
          passed = set()
          failures = []
          for line in open(sys.argv[1], encoding="utf-8", errors="replace"):
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              action = event.get("Action")
              test = event.get("Test")
              if action == "run" and test in expected:
                  run.add(test)
              elif action == "pass" and test in expected:
                  passed.add(test)
              elif action == "fail":
                  failures.append(test or event.get("Package") or "<package>")
          missing_run = expected - run
          missing_pass = expected - passed
          if missing_run or missing_pass or failures:
              raise SystemExit(
                  "Go selective gate failed: "
                  f"missing run={sorted(missing_run)}, missing pass={sorted(missing_pass)}, "
                  f"fail events={failures}"
              )
          print(f"verified 8 Go events: run={sorted(run)}, pass={sorted(passed)}")
          PY

          if (( test_status != 0 )); then
            exit "$test_status"
          fi
          if (( summary_status != 0 )); then
            exit "$summary_status"
          fi
      - name: Run production daemon crash response-loss witness
