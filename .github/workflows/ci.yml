name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Documentation-only pull requests skip the heavy matrix below. GitHub has no
  # job-level `paths-ignore`, so this classifier implements the equivalent of
  # `paths-ignore: ['docs/**', '**/*.md']` for pull_request events only: a PR
  # whose every changed path is under `docs/**` or ends in `.md` (any Markdown
  # file, including root files such as AGENTS.md) reports run-heavy=false.
  # Every non-pull_request event runs the full matrix.
  #
  # The same diff also reports `run-records`: a change that adds or modifies an
  # evaluation record under `docs/evaluations/**` or `docs/evidence/**`, or that
  # changes `model-routing-record-sanitize.py`, `check-record-cleanliness.py` or
  # the shared `revision_scope.py`, gates the record-cleanliness job below. That
  # gate must run for a records-only (documentation-only) pull request, so it is
  # a separate output rather than part of run-heavy; and it self-triggers on its
  # own program and on the module it reads, because a change to either must run
  # the gate end to end on a real checkout's event shape, which no fixture can
  # reproduce.
  #
  # And `run-citations`: a change to a document the citation existence gate audits -
  # the corpus in `scripts/ci/audited_paths.py` - or to the gate's own program, its
  # fixture suite, the shared `revision_scope.py` or the corpus module, gates the
  # citation-existence job below. The audited documents are the documents a
  # documentation-only pull request can change, so this too is a separate output
  # rather than part of run-heavy, and the self-triggering tool paths run the gate end
  # to end exactly the same way.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run-heavy: ${{ github.event_name != 'pull_request' || steps.paths.outputs.run-heavy == 'true' }}
      run-records: ${{ github.event_name != 'pull_request' || steps.paths.outputs.run-records == 'true' }}
      run-citations: ${{ github.event_name != 'pull_request' || steps.paths.outputs.run-citations == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify changed paths
        id: paths
        if: github.event_name == 'pull_request'
        shell: bash
        run: python3 scripts/ci/classify-changed-paths.py

  # The sanitize tool's own root-only `--check` over records a change adds or
  # modifies. It is deliberately independent of the heavy matrix - the change it
  # most needs to see is a records-only (documentation-only) pull request - so it
  # runs whenever the classifier above says a record, the tool itself or the shared
  # revision-range module changed.
  # `fetch-depth: 0` gives the job the comparison base the gate needs. On a
  # pull request that is the checked-out event head's first parent (`HEAD^1`,
  # exactly the range the classifier above used); on a push it is the pushed
  # `before` commit; an empty or all-zero base (a manual `workflow_dispatch` run
  # has no `before` field and arrives empty; a new branch or tag is all-zero)
  # falls back inside the script.
  # The head is the checkout's own `HEAD`, not the event's `$GITHUB_SHA`: both name
  # the same revision in every event here, but only `HEAD` is guaranteed to be the
  # revision this checkout holds, so a `refs/pull/N/merge` rebuilt between the event
  # and the clone cannot compare `HEAD^1` with a commit the clone never fetched.
  record-cleanliness:
    needs: changes
    if: needs.changes.outputs.run-records == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse host paths in records this change adds or modifies
        env:
          RECORD_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: python3 scripts/ci/check-record-cleanliness.py --base "$RECORD_BASE" --head HEAD

  # The citation existence gate: the backticked repo paths and symbols of the audited
  # documents - `docs/runbooks/**`, `docs/design/quality.md` and the archived closures
  # in `docs/archive/CLOSED-TODO.md` - must hold in the tree of the revision under
  # test, because a cited file:line or symbol rots silently when its owner moves. Like
  # the cleanliness gate above it is deliberately independent of the heavy matrix: the
  # documents it audits are documents a documentation-only pull request can change,
  # and the classifier also fires it for a change to the gate's own program, its
  # fixture suite, the revision-range module or the corpus module, so a change to any
  # of those runs the gate end to end. The gate's pathspec and the classifier's document
  # family both derive from the shared `scripts/ci/audited_paths.py`, so the documents
  # audited and the changes that start the audit cannot drift apart. `fetch-depth: 0`
  # gives the job the comparison base the gate needs.
  citation-existence:
    needs: changes
    if: needs.changes.outputs.run-citations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse citations the head revision does not hold
        env:
          CITATION_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: python3 scripts/ci/check-citation-existence.py --base "$CITATION_BASE" --head HEAD

  contracts:
    needs: changes
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # It resolves the locked versions against the registry, so it belongs
      # beside the provenance check, before the install.
      - name: Measure production dependency advisories (advisory)
        if: always()
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          if [ ! -f pnpm-lock.yaml ]; then
            echo "note: the repository has no pnpm-lock.yaml; skipping the advisory production-dependency audit"
            exit 0
          fi
          set +e
          pnpm audit --prod
          pnpm_audit_status=$?
          set -e
          echo "pnpm_audit_prod_exit_status=$pnpm_audit_status"
          exit "$pnpm_audit_status"
      - uses: ./.github/actions/contracts-build
        with:
          build-control-release: "true"
      - name: Refuse code clones this change adds to the files it touches
        env:
          JSCPD_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          python3 scripts/ci/test-jscpd-changed.py
          python3 scripts/ci/jscpd-changed.py --base "$JSCPD_BASE" --head HEAD

  control:
    needs: [changes, contracts]
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: symmetry_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d symmetry_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: control
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: symmetry_control_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: portal-assets
          path: control/priv/static/portal
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.6
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: daemon/go.sum
      - run: mix deps.get
      - name: Enforce the committed Credo strict baseline
        if: always()
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          credo_log="$RUNNER_TEMP/credo-strict.log"
          set +e
          mix credo --strict 2>&1 | tee "$credo_log"
          credo_status=${PIPESTATUS[0]}
          set -e
          # Credo's exit status is a bitmask of issue severities, not a count; the gate below is the verdict.
          echo "credo_strict_exit_status=$credo_status"
          python3 ../scripts/ci/assert-credo-strict-baseline.py --log "$credo_log"
      - name: Measure Hex advisories (advisory)
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail
          if [ ! -f mix.lock ]; then
            echo "note: control/mix.lock is absent; skipping the advisory Hex audit"
            exit 0
          fi
          if ! mix help hex.audit >/dev/null 2>&1; then
            echo "note: the Hex archive (mix hex.audit) is not installed in this image; skipping the advisory Hex audit"
            exit 0
          fi
          hex_audit_log="$RUNNER_TEMP/hex-audit.log"
          set +e
          mix hex.audit | tee "$hex_audit_log"
          hex_audit_status=${PIPESTATUS[0]}
          set -e
          echo "hex_audit_exit_status=$hex_audit_status"
          echo "hex_audit_advisories=$(grep -cE '^  [a-z][a-z0-9_-]* [0-9]' "$hex_audit_log" || true)"
          exit "$hex_audit_status"
      - run: mix format --check-formatted
      # Compile the environment `mix test` compiles below instead of the default
      # dev environment: the same sources are not compiled twice, the test-only
      # support tree is compiled too, and a warning there now fails this gate.
      - run: MIX_ENV=test mix compile --warnings-as-errors
      # `--slowest` stays out: it forces ExUnit trace mode (`max_cases: 1`, every test timeout
      # `:infinity`); separately, `ExUnit.CLIFormatter` stays listed and the run keeps its normal output and status.
      - run: mix test --formatter ExUnit.CLIFormatter --formatter SymmetryControl.SlowestFormatter
      - name: Run provider broker end-to-end tests
        timeout-minutes: 10
        env:
          SYMMETRY_PROVIDER_BROKER_E2E: "1"
        run: mix test test/symmetry_control/provider_broker_e2e_test.exs
      - name: Verify committed Goal receipts over HTTP
        timeout-minutes: 5
        env:
          SYMMETRY_GOAL_RECEIPT_E2E: "1"
          SYMMETRY_EXUNIT_EVENTS_FILE: ${{ runner.temp }}/goal-receipt-e2e-events.json
        run: |
          set -Eeuo pipefail
          export POSTGRES_DB="symmetry_receipt_e2e_$(openssl rand -hex 16)"
          : > "$SYMMETRY_EXUNIT_EVENTS_FILE"
          set +e
          mix test test/symmetry_control_web/controllers/goal_machine_controller_test.exs \
            --only goal_receipt_e2e \
            --formatter ExUnit.CLIFormatter \
            --formatter SymmetryControl.ExUnitJsonFormatter 2>&1
          test_status=$?
          set -e

          gate_status=0
          python3 ../scripts/ci/assert-exunit-json.py "$SYMMETRY_EXUNIT_EVENTS_FILE" \
            --runner-status "$test_status" \
            --expected-selector goal_receipt_e2e \
            'test committed harness session receipts recover through real Go HTTP after listener restarts' || gate_status=$?

          if (( test_status != 0 )); then
            exit "$test_status"
          fi
          if (( gate_status != 0 )); then
            exit "$gate_status"
          fi
      # This gate had no invocation site anywhere in the tree while the witness it
      # exercises stayed live. It needs a working `mix` and the compiled Control test
      # environment the steps above produce, so it runs here rather than in the
      # daemon job's helper step.
      - name: Check credentialed provider witness launcher and HTTP policy
        run: python3 ../scripts/ci/test-credentialed-provider-witness.py
      # Folded from the retired `pi-control-e2e-linux` job: same ubuntu runner, the
      # same `postgres` service and database, the same `control` working directory and
      # the same steps. Every folded step keeps `if: always()` so it still runs after
      # an earlier control failure, and the closing assertion step refuses to let a
      # skipped or failed fold be read as success.
      - name: Initialize Linux Pi E2E workspace
        id: linux_pi_workspace
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          export TMPDIR="$RUNNER_TEMP/symmetry-pi-control-tmp"
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
          mkdir -p "$TMPDIR"
          : > "$RUNNER_TEMP/pi-control-e2e-linux.log"
      - name: Prepare pinned Linux Pi release
        id: linux_pi_release
        if: always()
        uses: ./.github/actions/prepare-pi-release
        with:
          release-url: https://github.com/earendil-works/pi/releases/download/v1.5.2/pi-linux-x64.tar.gz
          target: x86_64-pc-linux-gnu
          archive-name: pi-linux-x64.tar.gz
          archive-sha256: 811c6f2c9e7aaee252b5404252e556fb713aa209c1f7f924226aa77d4ef70cb5
          executable-sha256: 6a2ac1c5b0d08b91ce6095591c1960b469d0665c7fc5f32812960a4a17ca0c57
          executable-path: ${{ runner.temp }}/pi-1.5.2/pi/pi
          release-dir: ${{ runner.temp }}/pi-1.5.2
          expected-version: "1.5.2"
          provenance-file: ${{ runner.temp }}/pi-control-e2e-linux-provenance.txt
          log-file: ${{ runner.temp }}/pi-control-e2e-linux.log
          witness-scope: "Linux legacy refusal before provider action; not installed-v2 positive acceptance"
      # Linux legacy owners lack retained-v2 peer capabilities. Require real
      # zero-effect refusal; Windows positives and manual installed-v2 positives remain separate.
      - name: Require Linux legacy Pi refusal before provider action
        id: linux_pi_refusal
        if: always()
        working-directory: daemon
        shell: bash
        env:
          SYMMETRY_PI_PROVIDER_ACTION_SMOKE: "1"
          SYMMETRY_PI_NATIVE_SMOKE_EXECUTABLE: ${{ runner.temp }}/pi-1.5.2/pi/pi
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/pi-control-e2e-linux.log"
          test_output="$RUNNER_TEMP/pi-provider-bridge-linux.json"
          : > "$test_output"
          python3 ../scripts/ci/go-test-json-gate.py \
            --events "$test_output" \
            --log "$log" \
            --provenance "$RUNNER_TEMP/pi-control-e2e-linux-provenance.txt" \
            --exit-status-key provider_bridge_smoke_exit_status \
            --gate-status-key provider_bridge_smoke_status \
            --assert github.com/wxxb789/symmetry/daemon/internal/harness/pi \
              TestLinuxLegacyPiProviderBridgeRefusesBeforeProviderAction \
            -- "$(command -v go)" test -json -count=1 -timeout 90s ./internal/harness/pi \
              -run '^TestLinuxLegacyPiProviderBridgeRefusesBeforeProviderAction$'
      - name: Compile Control for Linux Pi E2E
        id: linux_pi_compile
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/pi-control-e2e-linux.log"
          MIX_ENV=test mix compile --warnings-as-errors 2>&1 | tee -a "$log"
      - name: Verify Linux Pi cleanup pidfd group signaling
        id: linux_pi_pidfd_cleanup
        if: always()
        shell: bash
        working-directory: control
        run: bash ../scripts/ci/verify-linux-pi-pidfd-cleanup.sh
      - name: Run Linux Pi Control E2E
        id: linux_pi_e2e
        if: always()
        shell: bash
        env:
          SYMMETRY_EXUNIT_EVENTS_FILE: ${{ runner.temp }}/pi-control-e2e-linux-events.json
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/pi-control-e2e-linux.log"
          : > "$SYMMETRY_EXUNIT_EVENTS_FILE"
          set +e
          SYMMETRY_PI_CONTROL_E2E=1 \
          SYMMETRY_PI_CONTROL_E2E_EXECUTABLE="$RUNNER_TEMP/pi-1.5.2/pi/pi" \
            mix test test/symmetry_control/pi_control_e2e_test.exs \
              --only pi_control_e2e_linux_refusal \
              --include skip:pi_control_e2e_linux_refusal \
              --formatter ExUnit.CLIFormatter \
              --formatter SymmetryControl.ExUnitJsonFormatter 2>&1 |
            tee -a "$log"
          pipeline_status=("${PIPESTATUS[@]}")
          test_status=${pipeline_status[0]}
          tee_status=${pipeline_status[1]}
          set -e

          gate_status=0
          python3 ../scripts/ci/assert-exunit-json.py "$SYMMETRY_EXUNIT_EVENTS_FILE" \
            --runner-status "$test_status" \
            --expected-selector pi_control_e2e_linux_refusal \
            'test Linux Pi exact Control Goal Claim refuses the missing installed owner before effects' || gate_status=$?

          if (( test_status != 0 )); then
            exit "$test_status"
          fi
          if (( tee_status != 0 )); then
            exit "$tee_status"
          fi
          if (( gate_status != 0 )); then
            exit "$gate_status"
          fi
      - name: Cleanup orphaned Pi Control processes
        id: linux_pi_cleanup
        if: always()
        shell: bash
        run: bash ../scripts/cleanup-linux-pi-processes.sh
      - name: Upload Linux Pi E2E log and provenance
        id: linux_pi_upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pi-control-e2e-linux-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/pi-control-e2e-linux.log
            ${{ runner.temp }}/pi-control-e2e-linux-provenance.txt
      - name: Assert every folded Linux Pi gate succeeded
        if: always()
        shell: bash
        env:
          WORKSPACE_OUTCOME: ${{ steps.linux_pi_workspace.outcome }}
          RELEASE_OUTCOME: ${{ steps.linux_pi_release.outcome }}
          REFUSAL_OUTCOME: ${{ steps.linux_pi_refusal.outcome }}
          COMPILE_OUTCOME: ${{ steps.linux_pi_compile.outcome }}
          PIDFD_OUTCOME: ${{ steps.linux_pi_pidfd_cleanup.outcome }}
          E2E_OUTCOME: ${{ steps.linux_pi_e2e.outcome }}
          CLEANUP_OUTCOME: ${{ steps.linux_pi_cleanup.outcome }}
          UPLOAD_OUTCOME: ${{ steps.linux_pi_upload.outcome }}
        run: |
          set -Eeuo pipefail
          gates=(
            "Initialize Linux Pi E2E workspace=$WORKSPACE_OUTCOME"
            "Prepare pinned Linux Pi release=$RELEASE_OUTCOME"
            "Require Linux legacy Pi refusal before provider action=$REFUSAL_OUTCOME"
            "Compile Control for Linux Pi E2E=$COMPILE_OUTCOME"
            "Verify Linux Pi cleanup pidfd group signaling=$PIDFD_OUTCOME"
            "Run Linux Pi Control E2E=$E2E_OUTCOME"
            "Cleanup orphaned Pi Control processes=$CLEANUP_OUTCOME"
            "Upload Linux Pi E2E log and provenance=$UPLOAD_OUTCOME"
          )
          python3 ../scripts/ci/assert-folded-gates.py --job control "${gates[@]}"
      - uses: actions/download-artifact@v8
        with:
          name: control-release-linux
          path: ${{ runner.temp }}
      - name: Extract shared Control release
        run: |
          mkdir -p _build/prod/rel
          tar --extract --gzip --file "$RUNNER_TEMP/control-release-linux.tar.gz" --directory _build/prod/rel

      - uses: pnpm/action-setup@v6
        with:
          version: 12.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Check lockfile registry provenance
        run: python3 ../scripts/ci/check-lockfile-registry.py
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm --filter symmetry-browser-acceptance lint
        working-directory: .
      - run: pnpm --filter symmetry-browser-acceptance exec playwright install --with-deps chromium
        working-directory: .
      # The Goal-managed render case runs scripts/ci/portal-planning-fixture.exs
      # through `mix run` in the fixture's own development build (the release
      # serves; the fixture only writes the row). Compiling that build here
      # keeps the case's own fixture guard for the run, not a cold compile.
      - name: Compile the planning fixture's development build
        run: mix compile
      - name: Render authenticated release shell on desktop and mobile
        id: render_release_shell
        shell: bash
        run: |
          set -Eeuo pipefail
          export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
          export SECRET_KEY_BASE="$(openssl rand -hex 64)"
          export SYMMETRY_OPERATOR_TOKEN="$(openssl rand -hex 32)"
          export SYMMETRY_ENROLLMENT_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$SYMMETRY_OPERATOR_TOKEN"
          export SYMMETRY_CONTRACTS_DIR="$GITHUB_WORKSPACE/contracts"
          # The browser drives this instance at 127.0.0.1, and the operator
          # invalidation socket enforces the endpoint's origin check (Phoenix's
          # default, which compares the Origin host against the configured url
          # host). Point the endpoint at the host the gate actually browses
          # instead of disabling the check.
          export PHX_HOST=127.0.0.1 PHX_SERVER=true
          bin=_build/prod/rel/symmetry_control/bin/symmetry_control
          # The primary release carries Goal rollout on: the attention suite's
          # plan admission cases (accept_plan) are admission-gated. The
          # rollout-off case below gets its own instance with rollout off.
          SYMMETRY_GOALS_ROLLOUT_ENABLED=true PORT=4000 RELEASE_NODE=symmetry_shell \
            "$bin" start > "$RUNNER_TEMP/shell-release.log" 2>&1 &
          primary=$!
          PORT=4001 RELEASE_NODE=symmetry_expiry SYMMETRY_PORTAL_SESSION_MAX_AGE_SECONDS=2 \
            "$bin" start > "$RUNNER_TEMP/shell-expiry.log" 2>&1 &
          expiry=$!
          PORT=4002 RELEASE_NODE=symmetry_goals_off SYMMETRY_GOALS_ROLLOUT_ENABLED=false \
            "$bin" start > "$RUNNER_TEMP/shell-goals-off.log" 2>&1 &
          goals_off=$!
          trap 'kill "$primary" "$expiry" "$goals_off" 2>/dev/null || true' EXIT
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:4000/healthz
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:4001/healthz
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:4002/healthz
          cd ..
          # The environment-gated cases (Goal-managed fixture, rollout-off
          # attention, expiry) throw at collection under this flag instead of
          # skipping green when the environment below goes missing. The JSON
          # report is what the next step's executed-set assertion reads back.
          SYMMETRY_RENDER_GATE_REQUIRED=1 \
          SYMMETRY_SHELL_EXPIRY_URL=http://127.0.0.1:4001 \
          SYMMETRY_GOALS_OFF_URL=http://127.0.0.1:4002 \
          SYMMETRY_FIXTURE_MIX=mix \
          SYMMETRY_PLAYWRIGHT_JSON_REPORT="$RUNNER_TEMP/symmetry-render-gate.json" \
            pnpm --filter symmetry-browser-acceptance test \
              tests/workspace-shell.spec.mjs tests/portal-work-views.spec.mjs \
              tests/portal-execution-control.spec.mjs tests/portal-goal-managed.spec.mjs \
              tests/portal-goal-attention.spec.mjs \
              tests/portal-cutover.spec.mjs tests/portal-chat.spec.mjs
      # Playwright exits 0 when a case is merely skipped, so the run's own JSON
      # report pins the executed set: exactly the spec files of the list above
      # (the report names each relative to `browser/tests`), exactly the one
      # by-design concurrency skip, and every environment-gated case at both
      # widths. A dropped guard, a dropped SYMMETRY_RENDER_GATE_REQUIRED=1 or a
      # spec file dropped from the render step's list fails here instead of
      # passing as a silent skip.
      - name: Assert the render gate's executed set
        run: |
          set -Eeuo pipefail
          python3 ../scripts/ci/assert-playwright-json.py \
            "$RUNNER_TEMP/symmetry-render-gate.json" \
            --expect-skipped 1 \
            --expect-project desktop-chromium \
            --expect-project mobile-chromium \
            --expect-file workspace-shell.spec.mjs \
            --expect-file portal-work-views.spec.mjs \
            --expect-file portal-execution-control.spec.mjs \
            --expect-file portal-goal-managed.spec.mjs \
            --expect-file portal-goal-attention.spec.mjs \
            --expect-file portal-cutover.spec.mjs \
            --expect-file portal-chat.spec.mjs \
            "with Goal rollout off a present Goal still serves its real attention entry" \
            "a real Goal-managed work item presents no legacy path, and the server refuses one" \
            "expired authentication clears private content and recovers the deep link"
      # A release that never binds leaves no evidence anywhere else in the run:
      # the log files are the only record of why it did not start. Surface the
      # tail of every non-empty one — the failing instance is not always the
      # primary — in the annotation (workflow commands need `%`, CR and LF
      # escaped) and upload the logs, on the render step's own failure only.
      - name: Report release shell boot logs
        if: failure() && steps.render_release_shell.outcome == 'failure'
        shell: bash
        run: |
          set -Eeuo pipefail
          logs=("$RUNNER_TEMP/shell-release.log" "$RUNNER_TEMP/shell-expiry.log" "$RUNNER_TEMP/shell-goals-off.log")
          reported=0
          for log in "${logs[@]}"; do
            if [[ ! -s "$log" ]]; then
              continue
            fi
            tail_text=$(tail --bytes=8000 "$log")
            escaped=${tail_text//'%'/'%25'}
            escaped=${escaped//$'\r'/'%0D'}
            escaped=${escaped//$'\n'/'%0A'}
            echo "::error title=Release shell boot log tail (last 8000 bytes of ${log})::${escaped}"
            reported=1
          done
          if (( reported == 0 )); then
            echo "::error title=Release shell boot logs missing::no instance wrote a log: the render step failed before a release wrote one, so this failure has no boot log to read."
            exit 0
          fi
      - name: Upload release shell boot logs
        if: failure() && steps.render_release_shell.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: shell-release-boot-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/shell-release.log
            ${{ runner.temp }}/shell-expiry.log
            ${{ runner.temp }}/shell-goals-off.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workspace-render
          path: |
            browser/playwright-report
            /tmp/symmetry-playwright-results

  # All three coverage floors are blocking (rf-w6-10 flipped Control, rf-w6-12 the Go and vitest jobs).
  # Separate runners keep the instrumentation off the race step's budget and Control's `mix test`.
  coverage-control:
    needs: [changes, contracts]
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: symmetry_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d symmetry_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: control
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: symmetry_control_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: portal-assets
          path: control/priv/static/portal
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.6
      - run: mix deps.get
      # `control/mix.exs` carries the summary threshold this run must clear; a total below it
      # makes the step exit 3 and, since the job is no longer advisory, fails the job.
      - name: Run the Control suite with a coverage report
        run: mix test --cover
      - name: Upload the Control coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: control-coverage
          path: control/cover
          if-no-files-found: warn
          retention-days: 7

  coverage-daemon:
    needs: changes
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: daemon/go.sum
      - name: Prepare ordinary private user and PID namespaces
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          SYMMETRY_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash scripts/ci/prepare-private-namespace-tests.sh
      # `-timeout` doubles the per-package budget: coverage instrumentation slows every package, and the race step
      # keeps its `600s`. No env here: `go test` sets `GOCOVERDIR` for the exact-output cases (run 44887419717).
      - name: Run the Go suite with a coverage profile
        shell: bash
        run: |
          python3 ../scripts/ci/stdio-only-caller-boundary.py \
            "$(command -v go)" test -count=1 -timeout 1200s -coverprofile=coverage.out ./...
      # `go tool cover -func` owns the arithmetic the committed floor compares against.
      - name: Enforce the committed Go coverage floor
        run: |
          "$(command -v go)" tool cover -func=coverage.out > "$RUNNER_TEMP/daemon-coverage-func.txt"
          python3 ../scripts/ci/assert-go-coverage-floor.py --summary "$RUNNER_TEMP/daemon-coverage-func.txt"
      - name: Upload the Go coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daemon-coverage
          path: daemon/coverage.out
          if-no-files-found: warn
          retention-days: 7

  coverage-frontend:
    needs: changes
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The thresholds live in `frontend/vitest.config.ts`; a report below any of them makes vitest exit non-zero.
      - name: Run the frontend suite with a coverage report
        run: pnpm --filter @symmetry/frontend exec vitest run --coverage
      - name: Upload the frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
          retention-days: 7

  pi-control-e2e-windows:
    needs: changes
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: control
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: symmetry_control_test
    steps:
      - uses: actions/checkout@v7
      - name: Initialize Windows Pi E2E workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PI_E2E_TEMP = Join-Path $env:RUNNER_TEMP 'symmetry-pi-control-tmp'
          $env:PI_E2E_LOG = Join-Path $env:RUNNER_TEMP 'pi-control-e2e-windows.log'
          $env:PI_E2E_PROVENANCE = Join-Path $env:RUNNER_TEMP 'pi-control-e2e-windows-provenance.txt'
          $env:PI_E2E_POSTGRES_DATA = Join-Path $env:RUNNER_TEMP 'symmetry-pi-control-postgres'
          $env:PI_E2E_POSTGRES_LOG = Join-Path $env:RUNNER_TEMP 'symmetry-pi-control-postgres.log'
          $env:PI_E2E_EXECUTABLE = Join-Path $env:RUNNER_TEMP 'pi-1.5.2\pi.exe'
          @(
            "PI_E2E_TEMP=$env:PI_E2E_TEMP"
            "PI_E2E_LOG=$env:PI_E2E_LOG"
            "PI_E2E_PROVENANCE=$env:PI_E2E_PROVENANCE"
            "PI_E2E_POSTGRES_DATA=$env:PI_E2E_POSTGRES_DATA"
            "PI_E2E_POSTGRES_LOG=$env:PI_E2E_POSTGRES_LOG"
            "PI_E2E_EXECUTABLE=$env:PI_E2E_EXECUTABLE"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $env:PI_E2E_TEMP | Out-Null
          Set-Content -LiteralPath $env:PI_E2E_LOG -Value ''
          if ($env:POSTGRES_HOST -cne '127.0.0.1') {
            throw "Windows Pi E2E PostgreSQL host must remain IPv4 loopback: $env:POSTGRES_HOST"
          }
          $portListener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          try {
            $portListener.Server.ExclusiveAddressUse = $true
            $portListener.Start()
            $postgresPort = [int]$portListener.LocalEndpoint.Port
          }
          finally {
            if ($null -ne $portListener) { $portListener.Stop() }
          }
          if ($postgresPort -lt 1024 -or $postgresPort -gt 65535) {
            throw "Selected PostgreSQL loopback port is invalid: $postgresPort"
          }
          $env:POSTGRES_PORT = [string]$postgresPort
          "POSTGRES_PORT=$postgresPort" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $runnerImage = [Environment]::GetEnvironmentVariable('ImageVersion')
          @(
            "source_revision=$env:GITHUB_SHA"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "runner_image=$runnerImage"
            'pi_target=x86_64-pc-windows'
            'pi_version_expected=1.5.2'
            'pi_release_url=https://github.com/earendil-works/pi/releases/download/v1.5.2/pi-windows-x64.zip'
            'pi_archive_sha256_expected=e6adb8cb8c84eca14391ad24b363de9d2be98a89ca3ba3fdee1fa4de32b7f2e8'
            "pi_executable_path=$env:PI_E2E_EXECUTABLE"
            'pi_executable_sha256_expected=40a062bedd75767e2c3c889265de7c83d64a0ba55c74b60243c2453d97cffd85'
            'process_visibility=Elixir Port.open :hide for Windows native children; backup cleanup is verification-only and never invokes numeric process termination'
            'upstream_scope=numeric IPv4 loopback only'
            'provider_credentials=none'
            "postgres_host=$env:POSTGRES_HOST"
            "postgres_port=$postgresPort"
            'postgres_port_selection=IPv4 loopback TcpListener bound to port 0'
            'gate_status=initializing'
          ) | Set-Content -LiteralPath $env:PI_E2E_PROVENANCE
          Add-Content -LiteralPath $env:PI_E2E_LOG -Value "postgres_port=$postgresPort (selected from IPv4 loopback TcpListener port 0)"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.6
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: daemon/go.sum
      - name: Start isolated PostgreSQL loopback
        id: windows_postgres
        shell: pwsh
        working-directory: control
        run: pwsh -NoProfile -File ../scripts/ci/pi-windows-postgres-loopback.ps1
      - run: mix deps.get
      - name: Prepare pinned Windows Pi release
        uses: ./.github/actions/prepare-pi-release
        with:
          release-url: https://github.com/earendil-works/pi/releases/download/v1.5.2/pi-windows-x64.zip
          target: x86_64-pc-windows
          archive-name: pi-windows-x64.zip
          archive-sha256: e6adb8cb8c84eca14391ad24b363de9d2be98a89ca3ba3fdee1fa4de32b7f2e8
          executable-sha256: 40a062bedd75767e2c3c889265de7c83d64a0ba55c74b60243c2453d97cffd85
          executable-path: ${{ runner.temp }}\pi-1.5.2\pi.exe
          release-dir: ${{ runner.temp }}\pi-1.5.2
          expected-version: "1.5.2"
          provenance-file: ${{ runner.temp }}\pi-control-e2e-windows-provenance.txt
          log-file: ${{ runner.temp }}\pi-control-e2e-windows.log
          write-static-provenance: "false"
      - name: Run Windows Pi provider bridge smoke
        working-directory: daemon
        shell: pwsh
        env:
          SYMMETRY_PI_PROVIDER_ACTION_SMOKE: "1"
          SYMMETRY_PI_NATIVE_SMOKE_EXECUTABLE: ${{ runner.temp }}\pi-1.5.2\pi.exe
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $pythonVersion = & $python --version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "python --version failed with status $LASTEXITCODE" }
          $pythonVersion | Tee-Object -FilePath $env:PI_E2E_LOG -Append | Out-Host

          $testEvents = Join-Path $env:RUNNER_TEMP 'pi-provider-bridge-windows.json'
          $testErrors = Join-Path $env:RUNNER_TEMP 'pi-provider-bridge-windows.stderr.log'
          & $python ../scripts/ci/go-test-json-gate.py `
            --events $testEvents `
            --stderr $testErrors `
            --log $env:PI_E2E_LOG `
            --provenance $env:PI_E2E_PROVENANCE `
            --exit-status-key provider_bridge_smoke_exit_status `
            --gate-status-key provider_bridge_smoke_status `
            --assert github.com/wxxb789/symmetry/daemon/internal/harness/pi TestNativePiProviderBridgeAction `
            --command go test -json -count=1 -timeout 90s ./internal/harness/pi -run '^TestNativePiProviderBridgeAction$'
          exit $LASTEXITCODE
      - name: Compile Control for Windows Pi E2E
        shell: pwsh
        env:
          MIX_ENV: "test"
        run: |
          $ErrorActionPreference = 'Stop'
          $compileOutput = & mix compile --warnings-as-errors 2>&1
          $compileStatus = $LASTEXITCODE
          $compileOutput | Tee-Object -FilePath $env:PI_E2E_LOG -Append | Out-Host
          if ($compileStatus -ne 0) { exit $compileStatus }
      - name: Run Windows Pi Control E2E
        id: windows_pi_e2e
        if: steps.windows_postgres.outputs.ready == 'true'
        shell: pwsh
        env:
          SYMMETRY_PI_CONTROL_E2E: "1"
          SYMMETRY_PI_CONTROL_E2E_EXECUTABLE: ${{ runner.temp }}\pi-1.5.2\pi.exe
          SYMMETRY_EXUNIT_EVENTS_FILE: ${{ runner.temp }}\pi-control-e2e-windows-events.json
          TEMP: ${{ runner.temp }}\symmetry-pi-control-tmp
          TMP: ${{ runner.temp }}\symmetry-pi-control-tmp
          TMPDIR: ${{ runner.temp }}\symmetry-pi-control-tmp
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          [System.IO.File]::WriteAllText($env:SYMMETRY_EXUNIT_EVENTS_FILE, '')
          $testOutput = & mix test test/symmetry_control/pi_control_e2e_test.exs `
            --only pi_control_e2e_native_positive `
            --include skip:pi_control_e2e_native_positive `
            --formatter ExUnit.CLIFormatter `
            --formatter SymmetryControl.ExUnitJsonFormatter 2>&1
          $testStatus = $LASTEXITCODE
          $testOutput | Tee-Object -FilePath $env:PI_E2E_LOG -Append | Out-Host
          Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "e2e_exit_status=$testStatus"

          $gateOutput = & python ../scripts/ci/assert-exunit-json.py $env:SYMMETRY_EXUNIT_EVENTS_FILE `
            --runner-status $testStatus `
            --expected-selector pi_control_e2e_native_positive `
            'test real Pi repository work crosses Control receipts without accepting the Goal' `
            'test hard daemon crash recovers an in-flight Pi run without replaying effects' `
            'test real Pi committed candidate is independently validated and achieves the Goal' `
            'test real Pi fresh handoff preserves Control lineage and starts one new native session' `
            'test real Pi retained resume crosses a fresh daemon with fenced Control lineage' `
            --provenance $env:PI_E2E_PROVENANCE 2>&1
          $gateStatus = $LASTEXITCODE
          $gateOutput | Tee-Object -FilePath $env:PI_E2E_LOG -Append | Out-Host
          if ($testStatus -ne 0) { exit $testStatus }
          if ($gateStatus -ne 0) { exit $gateStatus }
          Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value 'gate_status=passed'
      - name: Record Windows Pi E2E prerequisite failure diagnostics
        if: always() && steps.windows_postgres.outcome == 'failure'
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value 'gate_status=failed: PostgreSQL loopback prerequisite unavailable'
          Add-Content -LiteralPath $env:PI_E2E_LOG -Value 'gate_status=failed: PostgreSQL loopback prerequisite unavailable'
      - name: Verify Windows Pi Control cleanup evidence
        if: always()
        shell: pwsh
        env:
          PI_E2E_OUTCOME: ${{ steps.windows_pi_e2e.outcome }}
        working-directory: control
        run: pwsh -NoProfile -File ../scripts/ci/pi-windows-cleanup-evidence.ps1
      - name: Stop isolated PostgreSQL
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:POSTGRES_PORT -notmatch '^[0-9]+$') {
            $message = "postgres_stop_status=failed: POSTGRES_PORT is not a decimal port: $env:POSTGRES_PORT"
            Add-Content -LiteralPath $env:PI_E2E_LOG -Value $message
            Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value $message
            exit 1
          }
          $postgresPort = [int]$env:POSTGRES_PORT
          if ($postgresPort -lt 1024 -or $postgresPort -gt 65535) {
            $message = "postgres_stop_status=failed: POSTGRES_PORT is outside the valid TCP range: $postgresPort"
            Add-Content -LiteralPath $env:PI_E2E_LOG -Value $message
            Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value $message
            exit 1
          }
          Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "postgres_stop_port=$env:POSTGRES_PORT"
          $pgCtlPath = $env:PI_E2E_POSTGRES_PGCTL
          if ([string]::IsNullOrWhiteSpace($pgCtlPath) -and -not [string]::IsNullOrWhiteSpace($env:PI_E2E_POSTGRES_BIN)) {
            $candidate = Join-Path $env:PI_E2E_POSTGRES_BIN 'pg_ctl.exe'
            if (Test-Path -LiteralPath $candidate -PathType Leaf) { $pgCtlPath = $candidate }
          }
          $pidFile = Join-Path $env:PI_E2E_POSTGRES_DATA 'postmaster.pid'
          if (Test-Path -LiteralPath $pidFile) {
            if ([string]::IsNullOrWhiteSpace($pgCtlPath) -or -not (Test-Path -LiteralPath $pgCtlPath -PathType Leaf)) {
              $message = 'postgres_stop_status=failed: postmaster.pid exists but the selected pg_ctl.exe path is unavailable'
              Add-Content -LiteralPath $env:PI_E2E_LOG -Value $message
              Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value $message
              exit 1
            }
            $stopOutput = & $pgCtlPath -D $env:PI_E2E_POSTGRES_DATA -m fast -w -t 10 stop 2>&1
            $stopStatus = $LASTEXITCODE
            $stopOutput | Tee-Object -FilePath $env:PI_E2E_LOG -Append | Out-Host
            Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value "postgres_stop_status=$stopStatus"
            if ($stopStatus -ne 0) { exit $stopStatus }
          }
          else {
            Add-Content -LiteralPath $env:PI_E2E_PROVENANCE -Value 'postgres_stop_status=not_running'
          }
      - name: Upload Windows Pi E2E log, provenance, and markers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pi-control-e2e-windows-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/pi-control-e2e-windows.log
            ${{ runner.temp }}/pi-control-e2e-windows-provenance.txt
            ${{ runner.temp }}/symmetry-pi-control-postgres.log
            ${{ runner.temp }}/symmetry-pi-control-tmp/symmetry-pi-control-run-*/process-marker*.json

  daemon:
    needs: changes
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: daemon/go.sum
      # Build tags change `unused`, `gocyclo` and errcheck results, so this `GOOS=linux` pass and
      # its `daemon-windows` twin may not stand in for each other.
      - name: Measure golangci-lint findings (GOOS=linux, advisory)
        if: always()
        continue-on-error: true
        # Bounded: a hung analysis can only redden this advisory step, never consume the job.
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          if [ ! -f .golangci.yml ]; then
            echo "note: daemon/.golangci.yml is absent; skipping the advisory golangci-lint metric"
            exit 0
          fi
          golangci_version='v2.15.0'
          golangci_archive='golangci-lint-2.15.0-linux-amd64.tar.gz'
          golangci_archive_sha256='9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea'
          golangci_dir="$RUNNER_TEMP/golangci-lint-$golangci_version"
          golangci_bin="$golangci_dir/golangci-lint-2.15.0-linux-amd64/golangci-lint"
          if [ ! -x "$golangci_bin" ]; then
            if ! curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 2 --retry-max-time 120 --retry-all-errors \
              "https://github.com/golangci/golangci-lint/releases/download/$golangci_version/$golangci_archive" \
              --output "$RUNNER_TEMP/$golangci_archive"; then
              echo "note: the pinned golangci-lint $golangci_version release could not be downloaded; skipping the advisory golangci-lint metric"
              exit 0
            fi
            if ! printf '%s  %s\n' "$golangci_archive_sha256" "$RUNNER_TEMP/$golangci_archive" | sha256sum --check --strict; then
              echo "note: the downloaded golangci-lint archive does not match the pinned digest; skipping the advisory golangci-lint metric"
              exit 0
            fi
            mkdir -p "$golangci_dir"
            tar --extract --gzip --file "$RUNNER_TEMP/$golangci_archive" --directory "$golangci_dir"
          fi
          "$golangci_bin" --version
          # The counts are deliberately uncapped: golangci-lint's defaults (50 per linter, 3 per
          # identical issue) would truncate the measured debt that is the ratchet baseline.
          set +e
          GOOS=linux "$golangci_bin" run --config .golangci.yml \
            --max-issues-per-linter=0 --max-same-issues=0
          golangci_status=$?
          set -e
          echo "golangci_lint_linux_exit_status=$golangci_status"
          exit "$golangci_status"
      - name: Measure govulncheck findings (advisory)
        if: always()
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          govulncheck_version='v1.10.0'
          if ! go install "golang.org/x/vuln/cmd/govulncheck@$govulncheck_version"; then
            echo "note: govulncheck $govulncheck_version could not be installed (no module proxy or toolchain); skipping the advisory vulnerability scan"
            exit 0
          fi
          govulncheck_bin="$(go env GOBIN)"
          govulncheck_bin="${govulncheck_bin:-$(go env GOPATH)/bin}/govulncheck"
          "$govulncheck_bin" -version
          govulncheck_log="$RUNNER_TEMP/govulncheck-daemon.log"
          set +e
          "$govulncheck_bin" ./... | tee "$govulncheck_log"
          govulncheck_status=${PIPESTATUS[0]}
          set -e
          echo "govulncheck_exit_status=$govulncheck_status"
          echo "govulncheck_vulnerabilities=$(grep -c '^Vulnerability #' "$govulncheck_log" || true)"
          exit "$govulncheck_status"
      - name: Prepare ordinary private user and PID namespaces
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          SYMMETRY_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash scripts/ci/prepare-private-namespace-tests.sh
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Check Linux v2 fixture contracts
        run: |
          python3 ../scripts/ci/test-linux-v2-source-subject.py
          python3 ../scripts/ci/test-linux-v2-go-events.py
          python3 ../scripts/ci/test-linux-v2-evidence.py
          python3 ../scripts/ci/test-linux-v2-host-prerequisite-probe.py
          python3 ../scripts/ci/test-rootless-compose-owner-claim.py
          sudo python3 ../scripts/ci/test-linux-v2-control-receipt.py
          python3 ../scripts/ci/test-rootless-compose-transition-proxy.py
          # This gate had no invocation site anywhere in the tree while the tooling
          # it exercises stayed live; run it here rather than never.
          python3 ../scripts/ci/test-omo-native-evidence.py
          # Same reason: the control witness's path and build-identity parsers
          # had no fixture of their own while they decided what evidence means.
          python3 ../scripts/ci/test-omo-control-native-evidence.py
      - name: Check CI gate helper scripts
        env:
          SYMMETRY_REQUIRE_PYYAML: "1"
        run: |
          pyyaml_version='6.0.3'
          python3 -m pip install --user --break-system-packages --disable-pip-version-check --quiet "PyYAML==$pyyaml_version"
          test "$(python3 -c 'import yaml; print(yaml.__version__)')" = "$pyyaml_version"
          python3 ../scripts/ci/test-assert-exunit-json.py
          python3 ../scripts/ci/test-go-test-json-gate.py
          python3 ../scripts/ci/test-assert-folded-gates.py
          python3 ../scripts/ci/test-assert-playwright-json.py
          python3 ../scripts/ci/test-assert-runner-matches-target.py
          python3 ../scripts/ci/test-check-lockfile-registry.py
          # The citation gate is a changed-file selector plus a citation grammar; this
          # fixture suite pins both, and the job that runs the gate itself is gated on
          # the classifier's `run-citations` output.
          python3 ../scripts/ci/test-check-citation-existence.py
          python3 ../scripts/ci/test-citest.py
          python3 ../scripts/ci/test-gitfixture.py
      - name: Check auditable model-routing workflow
        run: |
          python3 ../scripts/ci/test-model-routing-evaluation.py
          python3 ../scripts/ci/test-model-routing-omp-usage.py
          python3 ../scripts/ci/test-model-routing-record-sanitize.py
          python3 ../scripts/ci/test-model-routing-record-sanitize-json.py
          python3 ../scripts/ci/test-check-record-cleanliness.py
          python3 ../scripts/ci/test-model-routing-source-subject.py
      # The ordinary (non-race) pass is scoped to the two packages whose named
      # assertions are checked below. The full ordinary suite and the full race
      # suite are not redundant shapes: on run 43975580744 the ordinary pass failed
      # where the race pass passed for the same revision, so these packages keep a
      # non-race execution. Every other package is covered once, by the full-suite
      # race pass below. The stdio-only caller boundary is established before Go
      # exactly as before, and the JSON event stream is the same stream the
      # unscoped ordinary pass produced for these packages.
      - name: Run ordinary Go tests for the package-scoped named assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ../scripts/ci/go-test-json-gate.py \
            --events "$RUNNER_TEMP/daemon-go-test.json" \
            --stdio-boundary \
            --assert github.com/wxxb789/symmetry/daemon/internal/harness/pi \
              TestProviderBridgeCloseReleasesBoundPeerFD \
            --assert github.com/wxxb789/symmetry/daemon/internal/harness/opencode \
              TestOpenCodeHealthRejectsWrongLinuxV2PeerBindingsBeforeRequest \
              TestOpenCodeHealthRejectsWrongLinuxV2PeerBindingsBeforeRequest/mismatched_retained_pidfd \
              TestOpenCodeHealthRejectsWrongLinuxV2PeerBindingsBeforeRequest/closed_retained_pidfd \
              TestOpenCodeV2VerifierRejectsReleasedPeer \
              TestOpenCodePeerCloseWaitsForActiveVerification \
              TestOpenCodeAdapterWithoutV2OwnerFailsBeforeHealthRequest \
            -- "$(command -v go)" test -count=1 -timeout 300s -json \
              ./internal/harness/pi ./internal/harness/opencode
      # `-json` is what feeds the duration summary below; without it no per-test elapsed time reaches the log.
      - name: Run race tests with the same stdio-only caller boundary
        id: daemon_race_tests
        run: |
          python3 ../scripts/ci/go-test-json-gate.py \
            --events "$RUNNER_TEMP/daemon-go-race.json" \
            --stdio-boundary \
            --assert github.com/wxxb789/symmetry/daemon/internal/harness/opencode \
              TestOpenCodeV2VerifierRejectsReleasedPeer \
            -- "$(command -v go)" test -race -count=1 -timeout 600s -json ./...
      # Blocking: the summarizer's exit status is the verdict (cap, adopted ceilings, p95), and
      # `if: always()` keeps the table beside a red race run instead of erroring when it was skipped.
      - name: Summarize Go test durations
        if: always() && steps.daemon_race_tests.outcome != 'skipped'
        run: |
          python3 ../scripts/ci/go-test-durations.py "$RUNNER_TEMP/daemon-go-race.json"
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - name: Vet the Linux v2 host prerequisite peer probe (GOOS=linux)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOFLAGS=-mod=readonly go vet ../scripts/ci/linux-v2-host-peer-probe.go
      - name: Upload ordinary namespace prerequisite evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ordinary-private-namespace-daemon-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/ordinary-private-namespace-${{ github.run_id }}-${{ github.run_attempt }}.json

      # Folded from the retired `opencode-native-synthetic` job: same ubuntu runner,
      # same Go toolchain, same package tree. The folded steps keep `if: always()` so
      # they still run after an earlier daemon failure, and the closing assertion step
      # refuses to let a skipped or failed fold be read as success.
      - name: Prepare pinned OpenCode release
        id: opencode_native_prepare
        if: always()
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_url='https://github.com/anomalyco/opencode/releases/download/v1.18.32/opencode-linux-x64-baseline.tar.gz'
          archive="$RUNNER_TEMP/opencode-linux-x64-baseline.tar.gz"
          release_dir="$RUNNER_TEMP/opencode-1.18.32"
          executable="$release_dir/opencode"
          provenance="$RUNNER_TEMP/opencode-native-synthetic-provenance.txt"
          archive_sha256='763af386ef88a8cab18df00fcf055690e5a55e31a7088beabe02307142a6adce'

          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          {
            printf 'source_revision=%s\n' "$GITHUB_SHA"
            printf 'release_url=%s\n' "$release_url"
            printf 'version_expected=1.18.32\n'
            printf 'archive_sha256_expected=%s\n' "$archive_sha256"
            printf 'provider_credentials=none\n'
            printf 'upstream_scope=synthetic numeric loopback only\n'
            printf 'witness_scope=Linux legacy refusal before health HTTP; not installed-v2 positive acceptance\n'
          } > "$provenance"

          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-max-time 120 --retry-all-errors \
            "$release_url" --output "$archive"
          printf '%s  %s\n' "$archive_sha256" "$archive" | sha256sum --check --strict
          tar --extract --file "$archive" --directory "$release_dir"
          test -x "$executable"
          actual_version=$(timeout 30s "$executable" --version)
          test "$actual_version" = '1.18.32'
          {
            printf 'archive_sha256_actual=%s\n' "$(sha256sum "$archive" | awk '{print $1}')"
            printf 'version_actual=%s\n' "$actual_version"
            printf 'executable=%s\n' "$executable"
          } >> "$provenance"
      - name: Require Linux legacy OpenCode refusal before health request
        id: opencode_native_refusal
        if: always()
        working-directory: daemon
        env:
          SYMMETRY_OPENCODE_NATIVE_SYNTHETIC_TOOL: "1"
          SYMMETRY_OPENCODE_NATIVE_SYNTHETIC_TOOL_EXECUTABLE: ${{ runner.temp }}/opencode-1.18.32/opencode
        run: |
          set -Eeuo pipefail
          python3 ../scripts/ci/go-test-json-gate.py \
            --events "$RUNNER_TEMP/opencode-native-synthetic-test.json" \
            --provenance "$RUNNER_TEMP/opencode-native-synthetic-provenance.txt" \
            --exit-status-key e2e_exit_status \
            --gate-status-key gate_status \
            --assert github.com/wxxb789/symmetry/daemon/internal/harness/opencode \
              TestLinuxLegacyOpenCodeRefusesBeforeHealthRequest \
            -- "$(command -v go)" test -count=1 -timeout 180s -json \
              ./internal/harness/opencode \
              -run '^TestLinuxLegacyOpenCodeRefusesBeforeHealthRequest$'
      - name: Upload OpenCode synthetic provenance
        id: opencode_native_upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-native-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/opencode-native-synthetic-provenance.txt
      - name: Assert every folded OpenCode synthetic gate succeeded
        if: always()
        shell: bash
        env:
          PREPARE_OUTCOME: ${{ steps.opencode_native_prepare.outcome }}
          REFUSAL_OUTCOME: ${{ steps.opencode_native_refusal.outcome }}
          UPLOAD_OUTCOME: ${{ steps.opencode_native_upload.outcome }}
        run: |
          set -Eeuo pipefail
          gates=(
            "Prepare pinned OpenCode release=$PREPARE_OUTCOME"
            "Require Linux legacy OpenCode refusal before health request=$REFUSAL_OUTCOME"
            "Upload OpenCode synthetic provenance=$UPLOAD_OUTCOME"
          )
          python3 ../scripts/ci/assert-folded-gates.py --job daemon "${gates[@]}"

  legacy-route-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/audit-no-legacy-routes.sh
      # The audit derives its target list from `git ls-files`, so this test proves
      # the derivation covers the placements the retired hand-written list missed
      # and that the remaining exclusions are still load-bearing.
      - run: python3 scripts/ci/test-no-legacy-routes-audit.py
      # The `changes` job's classifier decides which jobs run at all, and this job is
      # the one place in this workflow that runs unconditionally: the fixture test runs
      # the classifier program that step invokes (`scripts/ci/classify-changed-paths.py`),
      # routes fixture diffs through it and pins the routing those outputs gate.
      - run: python3 scripts/ci/test-ci-changed-path-classifier.py
      - run: python3 scripts/ci/test-ci-structure-extraction.py
      - run: python3 scripts/ci/test-assert-credo-strict-baseline.py
      - run: python3 scripts/ci/test-go-test-durations.py
      - run: python3 scripts/ci/test-assert-go-coverage-floor.py

      # Runs here because the manual matrix lives in `browser/README.md`: a README-only pull request
      # would never reach a `run-heavy`-gated step; unlike the lint metrics below, this step is blocking.
      - run: python3 scripts/ci/assert-browser-suite-coverage.py

      # The workflow's only unconditional job: the advisory metrics run for every event, including
      # documentation-only pull requests, and no other job's failure can skip them.
      - name: Measure ruff findings in scripts/ci (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          # Without the root `pyproject.toml` (ruff selects it from the working directory) the count
          # would not be the ratchet baseline, so the step skips instead of measuring ruff's defaults.
          if [ ! -f pyproject.toml ]; then
            echo "note: the repository root has no pyproject.toml yet (refactor slice W1-11 owns the ruff configuration); skipping the advisory ruff metrics"
            exit 0
          fi
          ruff_version='0.17.5'
          ruff_archive='ruff-x86_64-unknown-linux-gnu.tar.gz'
          ruff_archive_sha256='7d261fc981a784668e19e9fa6ad437bfd95b67f2dc263fc1eab87d54d72fcc90'
          ruff_dir="$RUNNER_TEMP/ruff-$ruff_version"
          ruff_bin="$ruff_dir/ruff-x86_64-unknown-linux-gnu/ruff"
          if [ ! -x "$ruff_bin" ]; then
            if ! curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 2 --retry-max-time 120 --retry-all-errors \
              "https://github.com/astral-sh/ruff/releases/download/$ruff_version/$ruff_archive" \
              --output "$RUNNER_TEMP/$ruff_archive"; then
              echo "note: the pinned ruff $ruff_version release could not be downloaded; skipping the advisory ruff metrics"
              exit 0
            fi
            if ! printf '%s  %s\n' "$ruff_archive_sha256" "$RUNNER_TEMP/$ruff_archive" | sha256sum --check --strict; then
              echo "note: the downloaded ruff archive does not match the pinned digest; skipping the advisory ruff metrics"
              exit 0
            fi
            mkdir -p "$ruff_dir"
            tar --extract --gzip --file "$RUNNER_TEMP/$ruff_archive" --directory "$ruff_dir"
          fi
          "$ruff_bin" --version
          echo '=== ruff check scripts/ci'
          set +e
          "$ruff_bin" check scripts/ci
          ruff_check_status=$?
          set -e
          echo "ruff_check_exit_status=$ruff_check_status"
          echo '=== ruff format --check scripts/ci'
          set +e
          "$ruff_bin" format --check scripts/ci
          ruff_format_status=$?
          set -e
          echo "ruff_format_check_exit_status=$ruff_format_status"
          test "$ruff_check_status" -eq 0 && test "$ruff_format_status" -eq 0
      - name: Measure shellcheck findings in scripts/ci (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "note: shellcheck is not installed on this runner; skipping the advisory shellcheck metric"
            exit 0
          fi
          shellcheck --version
          shopt -s nullglob
          shellcheck_scripts=(scripts/ci/*.sh)
          if [ "${#shellcheck_scripts[@]}" -eq 0 ]; then
            echo "note: scripts/ci holds no *.sh file; skipping the advisory shellcheck metric"
            exit 0
          fi
          shellcheck_log="$RUNNER_TEMP/shellcheck-scripts-ci.log"
          set +e
          shellcheck --severity=warning --format=gcc "${shellcheck_scripts[@]}" | tee "$shellcheck_log"
          shellcheck_status=${PIPESTATUS[0]}
          set -e
          echo "shellcheck_exit_status=$shellcheck_status"
          echo "shellcheck_findings=$(grep -cE ': (warning|error): ' "$shellcheck_log" || true)"
          exit "$shellcheck_status"
      - name: Measure actionlint findings for the workflows (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          actionlint_version='1.7.12'
          actionlint_archive="actionlint_${actionlint_version}_linux_amd64.tar.gz"
          actionlint_archive_sha256='8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          actionlint_dir="$RUNNER_TEMP/actionlint-$actionlint_version"
          if [ ! -x "$actionlint_dir/actionlint" ]; then
            if ! curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 2 --retry-max-time 120 --retry-all-errors \
              "https://github.com/rhysd/actionlint/releases/download/v$actionlint_version/$actionlint_archive" \
              --output "$RUNNER_TEMP/$actionlint_archive"; then
              echo "note: the pinned actionlint $actionlint_version release could not be downloaded; skipping the advisory actionlint metric"
              exit 0
            fi
            if ! printf '%s  %s\n' "$actionlint_archive_sha256" "$RUNNER_TEMP/$actionlint_archive" | sha256sum --check --strict; then
              echo "note: the downloaded actionlint archive does not match the pinned digest; skipping the advisory actionlint metric"
              exit 0
            fi
            mkdir -p "$actionlint_dir"
            tar --extract --gzip --file "$RUNNER_TEMP/$actionlint_archive" --directory "$actionlint_dir"
          fi
          shopt -s nullglob
          workflow_files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ "${#workflow_files[@]}" -eq 0 ]; then
            echo "note: .github/workflows holds no workflow file; skipping the advisory actionlint metric"
            exit 0
          fi
          "$actionlint_dir/actionlint" -version
          # ShellCheck integration stays off: shellcheck-enabled actionlint does not terminate on the
          # Windows development host (docs/TODO.md); `-pyflakes=` keeps the verdict independent of the runner image.
          actionlint_log="$RUNNER_TEMP/actionlint-workflows.log"
          set +e
          "$actionlint_dir/actionlint" -shellcheck= -pyflakes= "${workflow_files[@]}" | tee "$actionlint_log"
          actionlint_status=${PIPESTATUS[0]}
          set -e
          echo "actionlint_exit_status=$actionlint_status"
          echo "actionlint_findings=$(grep -cE '\.ya?ml:[0-9]+:[0-9]+: ' "$actionlint_log" || true)"
          exit "$actionlint_status"

  daemon-windows:
    needs: changes
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: daemon/go.sum
      # The 20-minute job budget leaves room for the pinned release download plus one analysis; the
      # step bounds itself so a hung analysis can only redden itself.
      - name: Measure golangci-lint findings (GOOS=windows, advisory)
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Record the exit status explicitly: where `$PSNativeCommandUseErrorActionPreference` is on,
          # a non-zero native exit raises before the status line prints.
          $PSNativeCommandUseErrorActionPreference = $false
          if (-not (Test-Path '.golangci.yml')) {
            Write-Output 'note: daemon/.golangci.yml is absent; skipping the advisory golangci-lint metric'
            exit 0
          }
          $version = 'v2.15.0'
          $archive = 'golangci-lint-2.15.0-windows-amd64.zip'
          $archiveSha256 = 'cd7ea6063c95de245e17e5246e42bdc14bb221792c429dbd239ab3a6ade6ca6a'
          $releaseDir = Join-Path $env:RUNNER_TEMP "golangci-lint-$version"
          $binary = Join-Path $releaseDir 'golangci-lint-2.15.0-windows-amd64\golangci-lint.exe'
          if (-not (Test-Path $binary)) {
            $archivePath = Join-Path $env:RUNNER_TEMP $archive
            try {
              Invoke-WebRequest -Uri "https://github.com/golangci/golangci-lint/releases/download/$version/$archive" -OutFile $archivePath
            } catch {
              Write-Output "note: the pinned golangci-lint $version release could not be downloaded; skipping the advisory golangci-lint metric"
              exit 0
            }
            $actualSha256 = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $archiveSha256) {
              Write-Output 'note: the downloaded golangci-lint archive does not match the pinned digest; skipping the advisory golangci-lint metric'
              exit 0
            }
            Expand-Archive -Path $archivePath -DestinationPath $releaseDir -Force
          }
          & $binary --version
          $env:GOOS = 'windows'
          # Uncapped counts as in the Linux step: the defaults would truncate this ratchet baseline.
          & $binary run --config .golangci.yml --max-issues-per-linter=0 --max-same-issues=0
          $status = $LASTEXITCODE
          Write-Output "golangci_lint_windows_exit_status=$status"
          exit $status
      # Aggregate pass over the whole daemon tree: the budget is a hang guard, not a
      # performance assertion. A loaded Windows runner timed out at 180s inside
      # internal/app (panic: test timed out after 3m0s) on a head whose content could not
      # affect that package, while the same package passes on Linux. Single named tests
      # below keep their tight budgets because a hang there is a real signal.
      - run: go test -count=1 -timeout 600s ./...
      - run: go build ./cmd/symmetry-daemon ./cmd/symmetry-fake-agent
      - name: Run production Windows containment witness
        env:
          SYMMETRY_PRODUCTION_CONTAINMENT_WITNESS: "1"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $pythonVersion = & $python --version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "python --version failed with status $LASTEXITCODE" }
          $pythonVersion | Out-Host

          $testEvents = Join-Path $env:RUNNER_TEMP 'production-windows-containment-witness.json'
          $testErrors = Join-Path $env:RUNNER_TEMP 'production-windows-containment-witness.stderr.log'
          & $python ../scripts/ci/go-test-json-gate.py `
            --events $testEvents `
            --stderr $testErrors `
            --assert github.com/wxxb789/symmetry/daemon/internal/platform TestProductionContainmentSupervisorReplaysReceiptAfterLostRecoverResponse `
            --command go test -count=1 -timeout 180s -json ./internal/platform -run '^TestProductionContainmentSupervisorReplaysReceiptAfterLostRecoverResponse$'
          exit $LASTEXITCODE
      - name: Run production pre-authority crash witness matrix
        env:
          SYMMETRY_PRODUCTION_PREAUTHORITY_WITNESS: "1"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $testEvents = Join-Path $env:RUNNER_TEMP 'production-pre-authority-crash-witness.json'
          $testErrors = Join-Path $env:RUNNER_TEMP 'production-pre-authority-crash-witness.stderr.log'
          # The witness tests skip themselves unless the opt-in env var is set and
          # a renamed or mistyped `-run` pattern exits 0 with no test evidence, so
          # both named tests have to be present in the JSON event stream to pass.
          & $python ../scripts/ci/go-test-json-gate.py `
            --events $testEvents `
            --stderr $testErrors `
            --assert github.com/wxxb789/symmetry/daemon/e2e TestProductionPreAuthorityCrashWitnessMatrix TestProductionPreAuthorityWrongSecretFirstClientRace `
            --command go test -count=1 -timeout 600s -json ./e2e -run '^TestProductionPreAuthority(CrashWitnessMatrix|WrongSecretFirstClientRace)$'
          exit $LASTEXITCODE

      # Folded from the retired `opencode-production-unsupported-windows` job: same
      # windows runner, same Go toolchain, same `daemon` working directory. V1
      # positive synthetic execution is not evidence for the unsupported V2 adapter.
      # The folded steps keep `if: always()` so they still run after an earlier
      # daemon-windows failure, and the closing assertion step refuses to let a
      # skipped or failed fold be read as success.
      - name: Require production unsupported admission before execution
        id: opencode_production_admission
        if: always()
        working-directory: daemon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $testEvents = Join-Path $env:RUNNER_TEMP 'opencode-production-unsupported-windows.json'
          $testErrors = Join-Path $env:RUNNER_TEMP 'opencode-production-unsupported-windows.stderr.log'
          & $python ../scripts/ci/go-test-json-gate.py `
            --events $testEvents `
            --stderr $testErrors `
            --assert github.com/wxxb789/symmetry/daemon/internal/app TestOpenCodeLegacyAssignmentFailsBeforeRunningWorkspaceAndProcess `
            --command go test -count=1 -timeout 180s -json ./internal/app -run '^TestOpenCodeLegacyAssignmentFailsBeforeRunningWorkspaceAndProcess$'
          exit $LASTEXITCODE
      - name: Reject failed native executions and no-op interruption as support evidence
        id: opencode_support_evidence
        if: always()
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/ci/test-opencode-v2-support-witness.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload production unsupported admission test events
        id: opencode_admission_upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-production-unsupported-windows-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/opencode-production-unsupported-windows.json
            ${{ runner.temp }}/opencode-production-unsupported-windows.stderr.log
      - name: Assert every folded production admission gate succeeded
        if: always()
        shell: pwsh
        env:
          ADMISSION_OUTCOME: ${{ steps.opencode_production_admission.outcome }}
          SUPPORT_EVIDENCE_OUTCOME: ${{ steps.opencode_support_evidence.outcome }}
          UPLOAD_OUTCOME: ${{ steps.opencode_admission_upload.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          $gates = @(
            "Require production unsupported admission before execution=$env:ADMISSION_OUTCOME"
            "Reject failed native executions and no-op interruption as support evidence=$env:SUPPORT_EVIDENCE_OUTCOME"
            "Upload production unsupported admission test events=$env:UPLOAD_OUTCOME"
          )
          & python ../scripts/ci/assert-folded-gates.py --job daemon-windows @gates
          exit $LASTEXITCODE

  integration:
    needs: [changes, contracts]
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: symmetry_control_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d symmetry_control_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/symmetry_control_e2e
      SECRET_KEY_BASE: ci-only-secret-key-base-0123456789012345678901234567890123456789
      PHX_HOST: localhost
      PHX_SERVER: "true"
      PORT: "4000"
      SYMMETRY_ENROLLMENT_TOKEN: development-enrollment-token
      SYMMETRY_OPERATOR_TOKEN: development-operator-token
      SYMMETRY_HEARTBEAT_INTERVAL_MS: "1000"
      SYMMETRY_POLL_INTERVAL_MS: "1000"
      SYMMETRY_LEASE_DURATION_MS: "30000"
      SYMMETRY_ASSIGNMENT_DURATION_MS: "5000"
      SYMMETRY_REAPER_INTERVAL_MS: "500"
      SYMMETRY_CONTRACTS_DIR: ${{ github.workspace }}/contracts
      SYMMETRY_GOALS_ROLLOUT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      # contracts builds this production release once; the archive already
      # carries the portal assets.
      - uses: actions/download-artifact@v8
        with:
          name: control-release-linux
          path: ${{ runner.temp }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.6
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: daemon/go.sum
      - name: Prepare ordinary private user and PID namespaces
        shell: bash
        env:
          SYMMETRY_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash scripts/ci/prepare-private-namespace-tests.sh
      - name: Start shared Control release
        working-directory: control
        run: |
          mkdir -p _build/prod/rel
          tar --extract --gzip --file "$RUNNER_TEMP/control-release-linux.tar.gz" --directory _build/prod/rel
          _build/prod/rel/symmetry_control/bin/symmetry_control eval 'SymmetryControl.Release.migrate()'
          _build/prod/rel/symmetry_control/bin/symmetry_control start > /tmp/symmetry-control.log 2>&1 &
          echo "$!" > /tmp/symmetry-control.pid
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:4000/healthz
      - name: Verify Goal rollout and Oban worker execution
        working-directory: control
        shell: bash
        run: |
          set -Eeuo pipefail

          control_bin=_build/prod/rel/symmetry_control/bin/symmetry_control
          smoke_expr='
          if Application.get_env(:symmetry_control, :goals, [])[:rollout_enabled] != true do
            raise "Goal rollout is disabled"
          end

          unless is_pid(Oban.whereis(Oban)) do
            raise "Oban supervisor is not running"
          end

          job = SymmetryControl.Goals.Workers.WakeupWorker.new(%{}) |> Oban.insert!()

          result =
            Enum.reduce_while(1..60, nil, fn _, _ ->
              case SymmetryControl.Repo.get!(Oban.Job, job.id).state do
                "completed" ->
                  {:halt, :completed}

                state when state in ["cancelled", "discarded"] ->
                  raise "Goal Oban smoke job ended in #{state}"

                _ ->
                  Process.sleep(1000)
                  {:cont, nil}
              end
            end)

          unless result == :completed do
            raise "Goal Oban smoke job did not complete"
          end

          IO.puts("goal_oban_smoke=completed")
          '
          "$control_bin" rpc "$smoke_expr"
      - name: Run live daemon scenarios
        working-directory: daemon
        env:
          SYMMETRY_E2E: "1"
          SYMMETRY_E2E_URL: http://127.0.0.1:4000
          SYMMETRY_E2E_AGENT: /tmp/symmetry-fake-agent
        run: |
          set -Eeuo pipefail
          go build -o /tmp/symmetry-fake-agent ./cmd/symmetry-fake-agent
          python3 ../scripts/ci/go-test-json-gate.py \
            --events "$RUNNER_TEMP/integration-selective-tests.json" \
            --assert '*' \
              TestCoreDaemonWorkflows \
              TestPollingFallbackDispatchesWithoutNotifications \
              TestStaleRuntimeEpochCannotOverwriteNewGeneration \
              TestDaemonReregistersAfterRestart \
              TestDaemonReconnectReclaimsExpiredRunWithNewGeneration \
              TestTaskInputDistinguishesOmissionFromEmptyObject \
              TestGitWorktreeCleanupRemovesOwnedArtifacts \
              TestTerminalTransitionRetriesAfterLeaseExpiry \
            -- "$(command -v go)" test -count=1 -timeout 180s -json ./e2e \
              -run '^(TestCoreDaemonWorkflows|TestPollingFallbackDispatchesWithoutNotifications|TestStaleRuntimeEpochCannotOverwriteNewGeneration|TestDaemonReregistersAfterRestart|TestDaemonReconnectReclaimsExpiredRunWithNewGeneration|TestTaskInputDistinguishesOmissionFromEmptyObject|TestGitWorktreeCleanupRemovesOwnedArtifacts|TestTerminalTransitionRetriesAfterLeaseExpiry)$'
      - name: Run production daemon crash response-loss witness
        working-directory: daemon
        env:
          SYMMETRY_E2E_DAEMON_CRASH_WITNESS: "1"
          SYMMETRY_E2E: "1"
          SYMMETRY_E2E_URL: http://127.0.0.1:4000
          SYMMETRY_E2E_AGENT: /tmp/symmetry-fake-agent
        run: |
          set -Eeuo pipefail
          python3 ../scripts/ci/go-test-json-gate.py \
            --events "$RUNNER_TEMP/daemon-crash-response-loss.json" \
            --assert '*' TestProductionDaemonCrashResponseLossAndReconnect \
            -- "$(command -v go)" test -count=1 -timeout 240s -json ./e2e \
              -run '^TestProductionDaemonCrashResponseLossAndReconnect$'
      - name: Verify daemon recovers a live run after control restart
        working-directory: daemon
        shell: bash
        env:
          SYMMETRY_E2E: "1"
          SYMMETRY_E2E_URL: http://127.0.0.1:4000
          SYMMETRY_E2E_AGENT: /tmp/symmetry-fake-agent
          SYMMETRY_E2E_RESTART_MARKER: /tmp/symmetry-control-restart.marker
        run: bash ../scripts/ci/daemon-recovery-after-control-restart.sh

      - name: Run production Linux containment witness matrix
        if: ${{ always() }}
        working-directory: daemon
        env:
          SYMMETRY_E2E: "1"
          SYMMETRY_E2E_URL: http://127.0.0.1:4000
          SYMMETRY_E2E_AGENT: /tmp/symmetry-fake-agent
          SYMMETRY_PRODUCTION_LINUX_CONTAINMENT_WITNESS: "1"
          SYMMETRY_PRODUCTION_LINUX_CONTAINMENT_NEGATIVE_WITNESS: "1"
          SYMMETRY_PRODUCTION_LINUX_CONTAINMENT_REPLAY_WITNESS: "1"
          SYMMETRY_PRODUCTION_LINUX_CONTAINMENT_WITNESS_OUTPUT_DIR: ${{ runner.temp }}/symmetry-linux-containment-witness
        run: |
          set -Eeuo pipefail
          umask 077
          output_dir="$SYMMETRY_PRODUCTION_LINUX_CONTAINMENT_WITNESS_OUTPUT_DIR"
          evidence_dir="$RUNNER_TEMP/production-linux-containment-redacted-evidence"
          mkdir -m 0700 -p "$output_dir" "$evidence_dir"
          test_events="$RUNNER_TEMP/production-linux-containment-witness-test.json"
          : > "$RUNNER_TEMP/production-linux-containment-witness-workflow-provenance.txt"
          {
            printf 'source_revision=%s\n' "$GITHUB_SHA"
            printf 'subject_head=%s\n' "$(git rev-parse HEAD)"
            printf 'subject_tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'go_version=%s\n' "$(go version)"
            printf 'kernel=%s\n' "$(uname -a)"
            printf 'arch=%s\n' "$(uname -m)"
            printf 'witness_output_dir=%s\n' "$output_dir"
          } > "$RUNNER_TEMP/production-linux-containment-witness-workflow-provenance.txt"

          set +e
          python3 ../scripts/ci/go-test-json-gate.py \
            --events "$test_events" \
            --assert '*' \
              TestProductionLinuxContainmentWitnessSpine \
              TestProductionLinuxContainmentNegativeWitness \
              TestProductionLinuxContainmentReplayWitness \
            -- "$(command -v go)" test -count=1 -timeout 900s -json ./e2e \
              -run '^TestProductionLinuxContainment(WitnessSpine|NegativeWitness|ReplayWitness)$'
          gate_status=$?
          set -e

          evidence_status=failed
          if (( gate_status == 0 )); then
            evidence_status=passed
          fi
          export_status=0
          python3 ../scripts/ci/export-linux-v2-redacted-evidence.py \
            legacy "$evidence_dir" "$GITHUB_SHA" "$evidence_status" \
            --witness-root "$output_dir" || export_status=$?

          if (( gate_status != 0 )); then
            exit "$gate_status"
          fi
          if (( export_status != 0 )); then
            exit "$export_status"
          fi

      - name: Upload allowlisted sanitized production Linux containment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-linux-containment-witness-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/production-linux-containment-redacted-evidence/*.json
      - name: Upload raw Go test events on witness failure
        # Diagnostic only; local paths and raw test output are not acceptance evidence.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-linux-containment-witness-events-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 3
          path: ${{ runner.temp }}/production-linux-containment-witness-test.json
      - name: Upload ordinary namespace prerequisite evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ordinary-private-namespace-integration-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/ordinary-private-namespace-${{ github.run_id }}-${{ github.run_attempt }}.json

  compose:
    needs: changes
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: daemon/go.sum
      # The Compose stack builds docker/control.Dockerfile, which runs
      # `pnpm install --frozen-lockfile` inside the image, so this job installs
      # from the same lockfile as the `contracts` and `control` jobs.
      - name: Check lockfile registry provenance
        run: python3 scripts/ci/check-lockfile-registry.py
      - name: Smoke-test local HTTP and production HTTPS Compose stacks
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/compose-stack-smoke.sh

      - name: Run rootless Compose native refusal witnesses
        timeout-minutes: 35
        shell: bash
        run: |
          set -Eeuo pipefail

          project="symmetry-rootless-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/ci/linux-v2-source-subject.py "$GITHUB_WORKSPACE" "$GITHUB_SHA" >/dev/null
          temporary_dir=$(mktemp -d "$RUNNER_TEMP/rootless-compose-native.XXXXXX")
          evidence_dir="$RUNNER_TEMP/rootless-compose-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          chmod 0700 "$temporary_dir"
          mkdir -m 0700 "$evidence_dir"
          compose=(docker compose --project-name "$project" --file compose.yaml)
          native_override="$temporary_dir/rootless-native/compose.native.yaml"

          cleanup() {
            status=$?
            if [[ -f "$native_override" ]]; then
              "${compose[@]}" --file "$native_override" down --volumes --remove-orphans >/dev/null 2>&1 || true
            else
              "${compose[@]}" down --volumes --remove-orphans >/dev/null 2>&1 || true
            fi
            if [[ -d "$evidence_dir" ]]; then
              sudo chown -R "$(id -u):$(id -g)" "$evidence_dir" >/dev/null 2>&1 || true
              chmod 0700 "$evidence_dir" >/dev/null 2>&1 || true
            fi
            # Container teardown is not journal retirement. Keep private bind-mounted
            # journals and checkout evidence; publish only the allowlisted summaries.
            printf 'Retaining protected rootless fixture recovery directory: %s\n' "$temporary_dir" >&2
            exit "$status"
          }
          trap cleanup EXIT INT TERM

          "${compose[@]}" config --quiet
          "${compose[@]}" up --build --detach control
          control_ready=false
          for attempt in {1..90}; do
            if curl --fail --silent --show-error http://127.0.0.1:4000/healthz >/dev/null; then
              control_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$control_ready" != true ]]; then
            "${compose[@]}" ps >&2
            "${compose[@]}" logs --no-color control control-migrate postgres >&2 || true
            echo 'rootless Compose Control did not become ready' >&2
            exit 1
          fi

          SYMMETRY_LINUX_V2_ROOTLESS_EVIDENCE_DIR="$evidence_dir" \
            bash scripts/ci/rootless-compose-native-acceptance.sh "$project" "$temporary_dir"

      - name: Upload allowlisted sanitized rootless Compose evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rootless-compose-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/rootless-compose-evidence-${{ github.run_id }}-${{ github.run_attempt }}/manifest.json
            ${{ runner.temp }}/rootless-compose-evidence-${{ github.run_id }}-${{ github.run_attempt }}/rootless-compose-pi.json
            ${{ runner.temp }}/rootless-compose-evidence-${{ github.run_id }}-${{ github.run_attempt }}/rootless-compose-opencode.json
            ${{ runner.temp }}/rootless-compose-evidence-${{ github.run_id }}-${{ github.run_attempt }}/TestProductionLinuxV2UnprovisionedHostRefusal.json
            ${{ runner.temp }}/rootless-compose-evidence-${{ github.run_id }}-${{ github.run_attempt }}/rootless-compose-shared-diagnostic.json
            ${{ runner.temp }}/rootless-compose-evidence-${{ github.run_id }}-${{ github.run_attempt }}/rootless-compose-pi-diagnostic.json
            ${{ runner.temp }}/rootless-compose-evidence-${{ github.run_id }}-${{ github.run_attempt }}/rootless-compose-opencode-diagnostic.json
            ${{ runner.temp }}/rootless-compose-evidence-${{ github.run_id }}-${{ github.run_attempt }}/rootless-compose-unprovisioned-diagnostic.json

      # The smoke step's stack is torn down by its own EXIT trap, so the Compose
      # browser family provisions, uses and tears down a stack of its own.
      - uses: pnpm/action-setup@v6
        with:
          version: 12.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter symmetry-browser-acceptance exec playwright install --with-deps chromium
      - name: Run the Compose daemon acceptance on a stack this job provisions
        shell: bash
        timeout-minutes: 30
        run: |
          set -Eeuo pipefail
          project="symmetry-compose-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          origin_override="$RUNNER_TEMP/compose.browser-origin.yaml"
          cat > "$origin_override" <<'EOF'
          services:
            control:
              environment:
                PHX_HOST: 127.0.0.1
            control-migrate:
              environment:
                PHX_HOST: 127.0.0.1
          EOF
          compose=(docker compose --project-name "$project" --file compose.yaml --file "$origin_override")
          "${compose[@]}" up --build --detach
          curl --fail --silent --show-error --retry 90 --retry-delay 1 --retry-all-errors http://127.0.0.1:4000/healthz
          for attempt in {1..30}; do
            if "${compose[@]}" ps --status running --services | grep --fixed-strings --line-regexp daemon >/dev/null; then
              break
            fi
            if (( attempt == 30 )); then
              "${compose[@]}" ps >&2
              "${compose[@]}" logs --no-color daemon control postgres >&2 || true
              echo 'the daemon service did not stay running' >&2
              exit 1
            fi
            sleep 1
          done
          export SYMMETRY_COMPOSE_DAEMON=1
          export SYMMETRY_PORTAL_URL=http://127.0.0.1:4000
          export SYMMETRY_OPERATOR_TOKEN=development-operator-token
          export SYMMETRY_PLAYWRIGHT_JSON_REPORT="$RUNNER_TEMP/compose-daemon-report.json"
          pnpm --filter symmetry-browser-acceptance test tests/portal-compose-daemon.spec.mjs --project=desktop-chromium
          python3 scripts/ci/assert-playwright-json.py "$SYMMETRY_PLAYWRIGHT_JSON_REPORT" \
            --expect-skipped 0 \
            --expect-project desktop-chromium \
            --expect-file portal-compose-daemon.spec.mjs \
            'the production Compose stack completes F1-F7 and persists each outcome'
      - name: Verify the control restart preserves the Compose workspace
        shell: bash
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          project="symmetry-compose-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          compose=(docker compose --project-name "$project" --file compose.yaml --file "$RUNNER_TEMP/compose.browser-origin.yaml")
          record=$("${compose[@]}" exec -T postgres psql -U symmetry -d symmetry_dev -At -F '|' \
            -c "SELECT p.id, p.key, p.name FROM projects p WHERE p.key LIKE 'DC%' ORDER BY p.inserted_at DESC LIMIT 1;")
          IFS='|' read -r project_id project_key project_name <<< "$record"
          if [[ -z "$project_id" || -z "$project_key" || -z "$project_name" ]]; then
            echo 'the Compose acceptance workspace was not found' >&2
            exit 1
          fi
          fingerprint_sql=$(cat <<SQL
          SELECT md5(jsonb_build_object(
            'project', to_jsonb(p) - 'inserted_at' - 'updated_at',
            'resources', COALESCE((SELECT jsonb_agg(to_jsonb(r) - 'inserted_at' - 'updated_at' ORDER BY r.id) FROM project_resources r WHERE r.project_id = p.id), '[]'::jsonb),
            'work_items', COALESCE((SELECT jsonb_agg(to_jsonb(w) - 'inserted_at' - 'updated_at' ORDER BY w.id) FROM work_items w WHERE w.project_id = p.id), '[]'::jsonb),
            'tasks', COALESCE((SELECT jsonb_agg(to_jsonb(t) - 'inserted_at' - 'updated_at' ORDER BY t.id) FROM tasks t WHERE t.id IN (SELECT orchestration_task_id FROM work_items WHERE project_id = p.id)), '[]'::jsonb),
            'runs', COALESCE((SELECT jsonb_agg(to_jsonb(rn) - 'inserted_at' - 'updated_at' ORDER BY rn.id) FROM runs rn WHERE rn.task_id IN (SELECT orchestration_task_id FROM work_items WHERE project_id = p.id)), '[]'::jsonb),
            'events', COALESCE((SELECT jsonb_agg(to_jsonb(e) - 'inserted_at' ORDER BY e.id) FROM run_events e WHERE e.run_id IN (SELECT rn.id FROM runs rn WHERE rn.task_id IN (SELECT orchestration_task_id FROM work_items WHERE project_id = p.id))), '[]'::jsonb),
            'transitions', COALESCE((SELECT jsonb_agg(to_jsonb(tn) - 'inserted_at' ORDER BY tn.id) FROM run_transitions tn WHERE tn.run_id IN (SELECT rn.id FROM runs rn WHERE rn.task_id IN (SELECT orchestration_task_id FROM work_items WHERE project_id = p.id))), '[]'::jsonb),
            'commands', COALESCE((SELECT jsonb_agg(to_jsonb(c) - 'inserted_at' - 'updated_at' ORDER BY c.id) FROM commands c WHERE c.task_id IN (SELECT orchestration_task_id FROM work_items WHERE project_id = p.id)), '[]'::jsonb)
          )::text)
          FROM projects p
          WHERE p.id = '$project_id';
          SQL
          )
          fingerprint() {
            "${compose[@]}" exec -T postgres psql -U symmetry -d symmetry_dev -At -c "$fingerprint_sql"
          }
          before=$(fingerprint)
          "${compose[@]}" restart control
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:4000/healthz
          after=$(fingerprint)
          if [[ "$before" != "$after" ]]; then
            echo "database fingerprint changed across the control restart" >&2
            echo "before=$before" >&2
            echo "after=$after" >&2
            exit 1
          fi
          export SYMMETRY_COMPOSE_PROJECT_ID="$project_id"
          export SYMMETRY_COMPOSE_PROJECT_KEY="$project_key"
          export SYMMETRY_COMPOSE_PROJECT_NAME="$project_name"
          export SYMMETRY_PLAYWRIGHT_JSON_REPORT="$RUNNER_TEMP/compose-restart-report.json"
          pnpm --filter symmetry-browser-acceptance test tests/portal-compose-restart.spec.mjs --project=desktop-chromium
          python3 scripts/ci/assert-playwright-json.py "$SYMMETRY_PLAYWRIGHT_JSON_REPORT" \
            --expect-skipped 0 \
            --expect-project desktop-chromium \
            --expect-file portal-compose-restart.spec.mjs \
            'the control restart preserves the complete F1-F7 workspace'
      - name: Tear down the Compose acceptance stack
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          project="symmetry-compose-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          compose=(docker compose --project-name "$project" --file compose.yaml)
          "${compose[@]}" ps || true
          "${compose[@]}" logs --no-color || true
          "${compose[@]}" down --volumes --remove-orphans || true
      - name: Upload the Compose acceptance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-browser-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/compose-daemon-report.json
            ${{ runner.temp }}/compose-restart-report.json
            browser/playwright-report
            /tmp/symmetry-playwright-results

  # The connection-fixture and planning families need their own Control
  # instances (a provider-fixture transport, a planning fixture build and a
  # per-run operator token) that no existing job provides; this job owns them
  # and the three browser node suites.
  browser-fixture-linux:
    needs: [changes, contracts]
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: portal-assets
          path: control/priv/static/portal
      - uses: actions/download-artifact@v8
        with:
          name: control-release-linux
          path: ${{ runner.temp }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.6
      - uses: pnpm/action-setup@v6
        with:
          version: 12.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter symmetry-browser-acceptance exec playwright install --with-deps chromium
      - name: Build the Control instance the fixture families serve from
        working-directory: control
        run: |
          mix deps.get
          mix compile
      - name: Run the browser node suites
        working-directory: browser
        run: node --test scripts/connection-spec-env.test.mjs scripts/control-instance-isolation.test.mjs scripts/goal-context-fixtures.test.mjs
      - name: Run the connection fixture acceptance
        timeout-minutes: 30
        shell: bash
        run: |
          set -Eeuo pipefail
          export POSTGRES_DB="symmetry_0007e_test_4021"
          export SYMMETRY_OPERATOR_TOKEN="$(openssl rand -hex 32)"
          export SYMMETRY_FIXTURE_IDENTITY="$(openssl rand -hex 16)"
          export SYMMETRY_FIXTURE_IDENTITY_FILE="$RUNNER_TEMP/connection-fixture-identity.json"
          export SYMMETRY_FIXTURE_STATE_FILE="$RUNNER_TEMP/connection-fixture-state.json"
          export SYMMETRY_FIXTURE_TRANSPORT_LOG="$RUNNER_TEMP/connection-fixture-calls.jsonl"
          export SYMMETRY_FIXTURE_UNAUTHORIZED_ACCOUNTS=expired-fixture
          export SYMMETRY_INTEGRATION_SYNC_INTERVAL_MS=3600000
          export SYMMETRY_PORTAL_URL=http://127.0.0.1:4021
          export SYMMETRY_PLAYWRIGHT_JSON_REPORT="$RUNNER_TEMP/connection-fixture-report.json"
          echo '{}' > "$SYMMETRY_FIXTURE_STATE_FILE"
          fixture_log="$RUNNER_TEMP/connection-fixture.log"
          (cd control && mix ecto.create --quiet && mix ecto.migrate --quiet)
          (cd control && PHX_SERVER=true PORT=4021 mix run --no-halt --no-start ../scripts/ci/portal-connection-fixture.exs) \
            > "$fixture_log" 2>&1 &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true; wait "$fixture" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..90}; do
            if [[ -s "$SYMMETRY_FIXTURE_IDENTITY_FILE" ]] \
              && jq --exit-status --arg identity "$SYMMETRY_FIXTURE_IDENTITY" --arg port 4021 \
                '.identity == $identity and (.port | tostring) == $port' "$SYMMETRY_FIXTURE_IDENTITY_FILE" >/dev/null 2>&1 \
              && grep --fixed-strings --quiet 'connection fixture transport installed' "$fixture_log" \
              && grep --fixed-strings --quiet "$SYMMETRY_FIXTURE_IDENTITY" "$fixture_log" \
              && curl --fail --silent --show-error http://127.0.0.1:4021/healthz >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$fixture" 2>/dev/null; then
              echo 'the fixture control plane exited before it became ready' >&2
              tail -n 50 "$fixture_log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo 'the fixture control plane did not become ready' >&2
            tail -n 50 "$fixture_log" >&2 || true
            exit 1
          fi
          pnpm --filter symmetry-browser-acceptance test tests/portal-connections.spec.mjs
          python3 scripts/ci/assert-playwright-json.py "$SYMMETRY_PLAYWRIGHT_JSON_REPORT" \
            --expect-skipped 0 \
            --expect-project desktop-chromium \
            --expect-project mobile-chromium \
            --expect-file portal-connections.spec.mjs \
            'a connection is created, inspected, tested and removed through the real API' \
            'an expired provider session, a repeated submission and a refused submission stay actionable' \
            'stale updates and concurrent deletion reconcile to the server'\''s current state' \
            'a capability update visibly resets dependent resource health and sync state' \
            'Azure DevOps connection management runs on the new route' \
            'a GitHub repository resource is bound, synced, updated and unbound through the console' \
            'a provider failure and an ambiguous outcome stay explicit and the next readback writes the provider'\''s answer' \
            'project switching discards a late sync continuation and never writes into the new project' \
            'external work items keep their identity, their provider-owned lock and their availability' \
            'Azure DevOps repository, board and pipeline resources bind and sync against the fixture documents' \
            'a failed workspace re-read after a write surfaces the failure instead of the stale rows'
          # The fixture's provider tokens are canaries (scripts/ci/portal-connection-fixture.exs):
          # a token in the control log or the provider-call log is a leak, not evidence.
          if [[ ! -s "$SYMMETRY_FIXTURE_TRANSPORT_LOG" ]]; then
            echo "canary scan FAILED: provider-call log $SYMMETRY_FIXTURE_TRANSPORT_LOG is missing or empty: no recorded provider call to scan" >&2
            exit 1
          fi
          for scan_file in "$fixture_log" "$SYMMETRY_FIXTURE_TRANSPORT_LOG"; do
            for canary in gho_fixture_connection_token_canary fixture-ado-access-token-canary; do
              if grep --fixed-strings --quiet "$canary" "$scan_file"; then
                echo "canary scan FAILED: $scan_file contains $canary" >&2
                exit 1
              fi
            done
          done
      - name: Run the planning acceptance on the Control release
        timeout-minutes: 30
        shell: bash
        run: |
          set -Eeuo pipefail
          export POSTGRES_DB="symmetry_0007c_test"
          export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
          export SYMMETRY_OPERATOR_TOKEN="$(openssl rand -hex 32)"
          export SYMMETRY_ENROLLMENT_TOKEN="$(openssl rand -hex 32)"
          export SECRET_KEY_BASE="$(openssl rand -hex 64)"
          export SYMMETRY_CONTRACTS_DIR="$GITHUB_WORKSPACE/contracts"
          export SYMMETRY_GOALS_ROLLOUT_ENABLED=true
          export SYMMETRY_PLANNING_HARNESS=1
          export SYMMETRY_FIXTURE_MIX=mix
          export SYMMETRY_PORTAL_URL=http://127.0.0.1:4030
          export SYMMETRY_PLAYWRIGHT_JSON_REPORT="$RUNNER_TEMP/planning-report.json"
          (cd control && mix ecto.create --quiet && mix ecto.migrate --quiet)
          mkdir -p control/_build/prod/rel
          tar --extract --gzip --file "$RUNNER_TEMP/control-release-linux.tar.gz" --directory control/_build/prod/rel
          control_bin=control/_build/prod/rel/symmetry_control/bin/symmetry_control
          # The release evaluates the prod runtime config before any command, eval included.
          export PHX_HOST=127.0.0.1
          "$control_bin" eval 'SymmetryControl.Release.migrate()'
          PHX_SERVER=true PORT=4030 "$control_bin" start > "$RUNNER_TEMP/planning-release.log" 2>&1 &
          release=$!
          trap 'kill "$release" 2>/dev/null || true; wait "$release" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 60 --retry-delay 1 --retry-all-errors "$SYMMETRY_PORTAL_URL/healthz"
          pnpm --filter symmetry-browser-acceptance test tests/portal-work-planning.spec.mjs
          python3 scripts/ci/assert-playwright-json.py "$SYMMETRY_PLAYWRIGHT_JSON_REPORT" \
            --expect-skipped 0 \
            --expect-project desktop-chromium \
            --expect-project mobile-chromium \
            --expect-file portal-work-planning.spec.mjs \
            'creates, edits, archives and restores a project on real data' \
            'refuses a duplicate project key with the server'\''s field error and keeps the draft' \
            'submits a project and a work item once on a double submit' \
            're-syncs to the newest project after a stale update in two contexts' \
            'creates a work item with the project'\''s resources, edits it and moves status through the board' \
            'refuses a whitespace title with the server'\''s field error and keeps the draft' \
            'replays the failed intent verbatim on an explicit retry' \
            'keeps an open draft across a background refresh and applies it against the loaded revision' \
            're-syncs to the newest work item after a stale update in two contexts' \
            'applies a late board move only to its own project' \
            'moves and reorders the focused board card with the keyboard' \
            'moves work into a ready column that has no cards on the board' \
            'keeps the ready destination while the board is filtered to backlog' \
            'replays a lost create response without duplicating the work item' \
            'keeps an open editor draft across the responsive breakpoint' \
            'a Goal-managed item offers no writable path and the server refuses legacy writes' \
            'an external-tracker-owned item keeps its provider-owned fields and column unwritable' \
            'an archived project'\''s board offers no create, edit or move path'
      - name: Upload the browser fixture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/connection-fixture-report.json
            ${{ runner.temp }}/planning-report.json
            ${{ runner.temp }}/connection-fixture.log
            ${{ runner.temp }}/connection-fixture-calls.jsonl
            ${{ runner.temp }}/planning-release.log
            browser/playwright-report
            /tmp/symmetry-playwright-results
