name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: symmetry_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d symmetry_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: control
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: symmetry_control_test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.6
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: MIX_ENV=prod mix release --overwrite

  daemon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache-dependency-path: daemon/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=3 -timeout 180s ./...
      - run: go build ./cmd/symmetry-daemon ./cmd/symmetry-fake-agent

  daemon-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache-dependency-path: daemon/go.sum
      - run: go test -count=1 -timeout 180s ./...
      - run: go build ./cmd/symmetry-daemon ./cmd/symmetry-fake-agent

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: symmetry_control_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d symmetry_control_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/symmetry_control_e2e
      SECRET_KEY_BASE: ci-only-secret-key-base-0123456789012345678901234567890123456789
      PHX_HOST: localhost
      PHX_SERVER: "true"
      PORT: "4000"
      SYMMETRY_ENROLLMENT_TOKEN: development-enrollment-token
      SYMMETRY_OPERATOR_TOKEN: development-operator-token
      SYMMETRY_HEARTBEAT_INTERVAL_MS: "1000"
      SYMMETRY_POLL_INTERVAL_MS: "1000"
      SYMMETRY_LEASE_DURATION_MS: "5000"
      SYMMETRY_ASSIGNMENT_DURATION_MS: "5000"
      SYMMETRY_REAPER_INTERVAL_MS: "500"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.6
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache-dependency-path: daemon/go.sum
      - name: Build control release
        working-directory: control
        run: |
          MIX_ENV=prod mix deps.get
          MIX_ENV=prod mix release --overwrite
          _build/prod/rel/symmetry_control/bin/symmetry_control eval 'SymmetryControl.Release.migrate()'
          _build/prod/rel/symmetry_control/bin/symmetry_control start > /tmp/symmetry-control.log 2>&1 &
          echo "$!" > /tmp/symmetry-control.pid
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:4000/healthz
      - name: Run live daemon scenarios
        working-directory: daemon
        env:
          SYMMETRY_E2E: "1"
          SYMMETRY_E2E_URL: http://127.0.0.1:4000
          SYMMETRY_E2E_AGENT: /tmp/symmetry-fake-agent
        run: |
          go build -o /tmp/symmetry-fake-agent ./cmd/symmetry-fake-agent
          go test -count=1 -timeout 120s -v ./e2e -run '^(TestCoreDaemonWorkflows|TestPollingFallbackDispatchesWithoutNotifications|TestStaleRuntimeEpochCannotOverwriteNewGeneration|TestDaemonReregistersAfterRestart|TestDaemonReconnectReclaimsExpiredRunWithNewGeneration)$'
      - name: Verify daemon recovers a live run after control restart
        working-directory: daemon
        shell: bash
        env:
          SYMMETRY_E2E: "1"
          SYMMETRY_E2E_URL: http://127.0.0.1:4000
          SYMMETRY_E2E_AGENT: /tmp/symmetry-fake-agent
          SYMMETRY_E2E_RESTART_MARKER: /tmp/symmetry-control-restart.marker
        run: |
          set -Eeuo pipefail

          control_log=/tmp/symmetry-control.log
          control_pid_file=/tmp/symmetry-control.pid
          control_bin=../control/_build/prod/rel/symmetry_control/bin/symmetry_control
          marker=$SYMMETRY_E2E_RESTART_MARKER
          restarter_pid=
          rm -f "$marker"

          cleanup() {
            status=$?
            if [[ -n "$restarter_pid" ]] && kill -0 "$restarter_pid" 2>/dev/null; then
              kill "$restarter_pid" 2>/dev/null || true
              wait "$restarter_pid" 2>/dev/null || true
            fi
            if (( status != 0 )); then
              echo 'Control release log:' >&2
              cat "$control_log" >&2 || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          wait_for_marker() {
            for ((attempt = 1; attempt <= 60; attempt++)); do
              [[ -e "$marker" ]] && return 0
              sleep 1
            done
            echo "Timed out waiting for restart marker $marker" >&2
            return 1
          }

          wait_for_control_down() {
            for ((attempt = 1; attempt <= 60; attempt++)); do
              if ! curl --fail --silent --show-error http://127.0.0.1:4000/healthz >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            echo 'Timed out waiting for control health endpoint to stop' >&2
            return 1
          }

          wait_for_control_up() {
            for ((attempt = 1; attempt <= 60; attempt++)); do
              if curl --fail --silent --show-error http://127.0.0.1:4000/healthz >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            echo 'Timed out waiting for control health endpoint to recover' >&2
            return 1
          }

          restart_control() {
            wait_for_marker
            control_pid=$(<"$control_pid_file")
            kill -TERM "$control_pid"
            wait_for_control_down
            sleep 1
            "$control_bin" start >> "$control_log" 2>&1 &
            echo "$!" > "$control_pid_file"
            wait_for_control_up
          }

          restart_control &
          restarter_pid=$!
          go test -count=1 -timeout 150s -v ./e2e -run '^TestDaemonSurvivesControlRestart$'
          wait "$restarter_pid"
          restarter_pid=

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test compose stack
        shell: bash
        run: |
          set -Eeuo pipefail

          cleanup() {
            status=$?
            docker compose ps || true
            docker compose logs --no-color || true
            docker compose down --volumes --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT

          wait_for() {
            local description=$1
            local attempts=$2
            shift 2

            for ((attempt = 1; attempt <= attempts; attempt++)); do
              if "$@"; then
                return 0
              fi
              sleep 1
            done

            echo "Timed out waiting for ${description}" >&2
            return 1
          }

          docker compose config --quiet
          docker compose up --build --detach

          wait_for "control health endpoint" 60 \
            curl --fail --silent --show-error http://127.0.0.1:4000/healthz
          wait_for "daemon service to remain running" 30 \
            bash -c 'docker compose ps --status running --services | grep --fixed-strings --line-regexp daemon >/dev/null'

          task_json=$(curl --fail --silent --show-error \
            --request POST \
            --header 'Authorization: Bearer development-operator-token' \
            --header 'Idempotency-Key: compose-smoke-task' \
            --header 'Content-Type: application/json' \
            --data '{"work":{"goal":"compose smoke test","agent_profile":"default","workspace":"primary","input":{"mode":"success"}}}' \
            http://127.0.0.1:4000/api/v1/tasks)
          task_id=$(jq --exit-status --raw-output '.task_id' <<<"$task_json")
          test -n "$task_id"

          task_url="http://127.0.0.1:4000/api/v1/tasks/${task_id}"
          wait_for "fake-agent task ${task_id} to complete" 60 \
            bash -c 'task=$(curl --fail --silent --show-error --header "Authorization: Bearer development-operator-token" "$0"); jq --exit-status -e '\''.state == "completed"'\'' <<<"$task" >/dev/null' "$task_url"
