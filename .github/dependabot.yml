# No update groups: each pull request stays one reviewable bump, and the weekly
# cadence with a small open-pull-requests ceiling bounds the noise.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /daemon
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: mix
    directory: /control
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    # One entry for the whole pnpm workspace: `contracts/`, `frontend/` and `browser/`
    # share the root `pnpm-lock.yaml`, the repository's only lockfile on the npm side.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
