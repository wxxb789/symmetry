# ST1005 stays excluded (measured error strings start with proper nouns/initialisms) and
# gocritic runs `diagnostic` only: style/perf tags duplicate gofmt and review, not defects.
version: "2"

run:
  timeout: 10m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - dupl
    - errorlint
    - exhaustive
    - funlen
    - gocritic
    - gocyclo
    - misspell
    - nilerr
    - unconvert
    - unparam
    - whitespace
  settings:
    dupl:
      threshold: 150
    funlen:
      lines: 120
      statements: 60
    gocyclo:
      min-complexity: 25
    gocritic:
      enabled-tags:
        - diagnostic
    staticcheck:
      checks:
        - all
        - "-ST1000"
        - "-ST1003"
        - "-ST1005"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - funlen
          - gocyclo
          - dupl

formatters:
  enable:
    - gofmt
