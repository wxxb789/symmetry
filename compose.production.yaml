name: symmetry-production

services:
  control-migrate:
    build:
      context: .
      dockerfile: docker/control.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PHX_HOST: ${PHX_HOST:?PHX_HOST is required}
      PORT: "4000"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      SYMMETRY_ENROLLMENT_TOKEN: ${SYMMETRY_ENROLLMENT_TOKEN:?SYMMETRY_ENROLLMENT_TOKEN is required}
      SYMMETRY_OPERATOR_TOKEN: ${SYMMETRY_OPERATOR_TOKEN:?SYMMETRY_OPERATOR_TOKEN is required}
    command: ["eval", "SymmetryControl.Release.migrate()"]
    networks:
      - backend
      - database
    restart: "no"

  control:
    build:
      context: .
      dockerfile: docker/control.Dockerfile
    depends_on:
      control-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PHX_HOST: ${PHX_HOST:?PHX_HOST is required}
      PHX_SERVER: "true"
      PORT: "4000"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      SYMMETRY_ENROLLMENT_TOKEN: ${SYMMETRY_ENROLLMENT_TOKEN:?SYMMETRY_ENROLLMENT_TOKEN is required}
      SYMMETRY_OPERATOR_TOKEN: ${SYMMETRY_OPERATOR_TOKEN:?SYMMETRY_OPERATOR_TOKEN is required}
      SYMMETRY_INTEGRATION_SYNC_INTERVAL_MS: ${SYMMETRY_INTEGRATION_SYNC_INTERVAL_MS:-300000}
    networks:
      - backend
      - database
    volumes:
      - provider_gh_state:/app/.config/gh
      - provider_azure_state:/app/.azure
    restart: unless-stopped

  edge:
    image: nginx:1.27.5-alpine
    depends_on:
      control:
        condition: service_started
    environment:
      PHX_HOST: ${PHX_HOST:?PHX_HOST is required}
    ports:
      - "${SYMMETRY_HTTP_PORT:-80}:80"
      - "${SYMMETRY_HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ${SYMMETRY_TLS_CERT_FILE:?SYMMETRY_TLS_CERT_FILE is required}
        target: /run/symmetry/tls.crt
        read_only: true
      - type: bind
        source: ${SYMMETRY_TLS_KEY_FILE:?SYMMETRY_TLS_KEY_FILE is required}
        target: /run/symmetry/tls.key
        read_only: true
      - type: bind
        source: ./docker/edge-nginx.conf
        target: /etc/nginx/templates/default.conf.template
        read_only: true
    networks:
      - edge
      - backend
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true
  database:

volumes:
  provider_gh_state:
  provider_azure_state:
