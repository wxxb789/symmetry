map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

upstream symmetry_control {
  server control:4000;
  keepalive 32;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  return 421;
}

server {
  listen 80;
  listen [::]:80;
  server_name ${PHX_HOST};

  return 308 https://${PHX_HOST}$request_uri;
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name _;

  ssl_reject_handshake on;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name ${PHX_HOST};

  ssl_certificate /run/symmetry/tls.crt;
  ssl_certificate_key /run/symmetry/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  location / {
    proxy_pass http://symmetry_control;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Host ${PHX_HOST};
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host ${PHX_HOST};
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Server ${PHX_HOST};
    proxy_set_header X-Forwarded-Ssl on;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
