services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-symmetry_dev}
      POSTGRES_USER: ${POSTGRES_USER:-symmetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-symmetry}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  control-migrate:
    build:
      context: .
      dockerfile: docker/control.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-symmetry}:${POSTGRES_PASSWORD:-symmetry}@postgres:5432/${POSTGRES_DB:-symmetry_dev}
      PHX_HOST: localhost
      PORT: "4000"
      SECRET_KEY_BASE: development-only-secret-key-base-change-before-production-0123456789
      SYMMETRY_ENROLLMENT_TOKEN: ${SYMMETRY_ENROLLMENT_TOKEN:-development-enrollment-token}
      SYMMETRY_OPERATOR_TOKEN: ${SYMMETRY_OPERATOR_TOKEN:-development-operator-token}
    command: ["eval", "SymmetryControl.Release.migrate()"]

  control:
    build:
      context: .
      dockerfile: docker/control.Dockerfile
    depends_on:
      control-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-symmetry}:${POSTGRES_PASSWORD:-symmetry}@postgres:5432/${POSTGRES_DB:-symmetry_dev}
      PHX_HOST: localhost
      PORT: "4000"
      SECRET_KEY_BASE: development-only-secret-key-base-change-before-production-0123456789
      SYMMETRY_ENROLLMENT_TOKEN: ${SYMMETRY_ENROLLMENT_TOKEN:-development-enrollment-token}
      SYMMETRY_OPERATOR_TOKEN: ${SYMMETRY_OPERATOR_TOKEN:-development-operator-token}
    ports:
      - "127.0.0.1:4000:4000"

  daemon:
    build:
      context: .
      dockerfile: docker/daemon.Dockerfile
    depends_on:
      control:
        condition: service_started
    environment:
      SYMMETRY_ENROLLMENT_TOKEN: ${SYMMETRY_ENROLLMENT_TOKEN:-development-enrollment-token}
    volumes:
      - daemon_state:/var/lib/symmetry
      - daemon_workspaces:/workspaces
    restart: unless-stopped

volumes:
  postgres_data:
  daemon_state:
  daemon_workspaces:
